      why: ブランチ保護が通る理由と、証跡の集約で数えない理由を、続けて説明する。リポジトリの運用に慣れていない読者は追えない。第6節の中でも特に細かい
    - quote: "| G-1 企画承認 | 投資対効果、リスクの受容方針 | 事業決裁者 | 既存の稟議どおり |"
      why: 8行の表で、技術者が知りたい内側のループと関わるのは G-4〜G-6 の3行だけ。全体を同じ重さで並べるため、どこを読めばよいか分からない
  figure_only_subject: 図の alt だけでは、速い AI 協調ループの決まった場所に人が触る点(仕様承認・独立レビュー)を置き、外側を事業判断の節目が囲む開発プロセスと取れる。ただし、製品名や手法名は alt に出ない。第2図以降の alt は読み進めた後でないと意味が閉じず、図が説明に先行している
  next_step_clear: true
  ending_natural: true
  ending_note: 行き先は第10節(テンプレート)と「もっと読む」の表から分かる。最後の一文は、意見と反論を Issues へ送らせる依頼。本文の主張が「人の判定を守る」ことなので結びの2段落目は自然に出る。ただし最後の行動の依頼がテンプレートを試すことではなく反論の送付で、実務者の次の一手とは少し違う。
