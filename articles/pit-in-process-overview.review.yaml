      rule: V11
    - id: F03
      quote: 変更は4点あり、標準はこれを小さく見せないと明記しています(第11節)
      severity: 直す
      reason: 「標準は…明記しています(第11節)」は、標準の第11節に明記があると読める。指しているのはこの記事の第11節で、標準の所在は附属書A A.5 と附属書D。「第5節の責任の原則」も同じで、標準の責任の原則は第5章 5.2 にあり、番号が偶然重なる。記事の節を指すと分かる書き方にするか、標準の所在を書く。
      rule: AGENTS-2.3-2
