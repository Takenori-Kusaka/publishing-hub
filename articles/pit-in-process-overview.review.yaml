      why: 稟議・決裁権限規程は日本の大企業の制度を前提にしている。表の1つのセルに、変えないことと改めることが詰まり、検索から来た実務者には読む負担が重い。AI を使う開発の組み方が知りたい読者は、ここで外殻の話から離れやすい
