  figure_only_subject: データの持ち方と流し方を 9 つのステップ(要件・所有・モデル・流れ・契約・複製・正しさ・導出・基盤)の順に設計すること、事後報告から読んだ被害を広げる設計の 8 つの型、N・B・BE の 3 つの構成に同じケースを流して要素を 1 つずつ外す測り方、0 件と 1 件以上が 2 回の実行で入れ替わること。図の alt だけで、ガイドと実測の 2 本立てであることと、実測の題材(複製、切り替え、二重書き込み)まで読み取れる。製品名とサービスの舞台(宅配注文)は図からは分からない
