    - quote: ほかに、題材 A の追加実験 A-P1(CDC の読み取り間隔、25 実行)があります。
      why: CDC の初出だが、何の略で何をするものかの説明が無い。4.1 で「BE はアウトボックスと CDC(Debezium)です」と出るときも、説明があるのはアウトボックスだけ。冒頭は「用語は定義と図から説明しています」と言うが、これはスライドの話で、記事の本文では定義されていない。3 章の構成の説明に出る「二重書き込み」も、中身が分かるのは 4.1 まで読んでから
    - quote: Debezium を止めたまま書き続けると、既定(上限なし)ではスロットが保持する WAL が 271.7 MB・271.6 MB まで増え続けました。
      why: 「スロット」と「WAL」が何かの説明が無い。続く「上限(64MB)を付けるとスロットは無効になり」も、スロットが何を保持する仕組みかを知らないと、なぜ 800 件が届かなくなるのかがつながらない。9 章の「CDC のスロットに上限と監視はあるか」も同じ語に頼る
    - quote: "- 基準＋重点(BE):B に、題材ごとの重点を足した構成"
      why: 題材ごとの重点が何かの一覧が無い。題材 A は「BE はアウトボックスと CDC」、題材 B の入れ替えは「論理レプリケーション、照合、遮断、逆向きの複製を組み合わせた BE」、題材 C は「揺れた行を保留の表に回す BE」と本文から拾えるが、題材 D には N・B・BE の語が 1 度も出ない。4.2〜4.4 の多くの箇条(expand/contract、lock_timeout、ディスクのキュー、同期スタンバイの名指しなど)も、N・B・BE のどれの結果なのかが書かれていない。共通の基準 6 つのうちどれを外した除去実験なのかも、ほとんどの箇条で分からない
    - quote: ガイドが選んだ 19 件(2015〜2025 年)を、報告が最初に挙げる出来事で 1 件 1 分類にすると、変更・操作が 13 件でした。
      why: 1 件 1 分類なのに、変更・操作 13 件と「機器・電源・ネットワークの障害や乱れは 3 件」で 16 件にしかならず、残る 3 件の分類が書かれていない。次の段落の「原文を開けた 24 件(2015〜2026 年、13 事業者)」と、この 19 件が同じ集まりの一部なのか別の選び方なのかも分からない
    - quote: "| 9 基盤 | 各基盤を、同じ 4 つの問いでどう設計するか | 13・14 |"
      why: 「同じ 4 つの問い」が何なのか、記事のどこにも書かれていない。同じく、1 章の「柔軟性・拡張性・置換性・更新性」と、Part 1 の題の「4 つの性質」、xlsx の列の「4 つの性質のどれに効くか」が同じものだとは明記されておらず、4 つの性質それぞれの意味も定義されていない
    - quote: 最終状態の食い違いは、Redpanda では 2 回とも 0 注文でした。
      why: 「Redpanda では」と限定しているので、別のブローカー(Apache Kafka か)では違う結果だったように読めるが、その結果が書かれていない。題材 A がどのブローカーで流されたのかも、ここまでに書かれていない
    - quote: 冪等な受け手つきのアウトボックスの 2 構成(変種と除去の実行を除く 77 実行)で、届いた重複は 1551 回・1746 回、受け手の状態に 2 回効いたイベントは 0 でした。
      why: 「変種」が何を指すかが、この時点では分からない。3 つ後の箇条に「ポーリングの変種」が出て初めて見当が付く。題材 A の 179 実行のうち 77 実行がどう選ばれたかも、この文からは追えない
    - quote: この行の判定は「実行によって変わった」で、原因は調べていません。
      why: 「この行」が何の表の行なのか、4.2 の時点では分からない。6 章の「ガイドの記述との照合」の表に同じ判定の行が出て、初めてその表の行のことだと分かる
    - quote: 何も設定しないレジストリの既定は BACKWARD と表示されました。
      why: BACKWARD、BACKWARD_TRANSITIVE、FULL_TRANSITIVE が、何と何を比べる検査なのかの説明が無い。「段ごとには検査を通る変更の列」と「v3 の登録を拒否しました」から、直前の版だけと比べるか全部の版と比べるかの違いだと推測はできるが、本文は明言していない。対象読者は分散システムを体系的に学んでいない人なので、前提の知識を求められた箇所として挙げる
    - quote: 分離レベルごとの異常は、Hermitage の考え方で、文の実行順を固定して測りました。
      why: Hermitage が何か(道具なのか、文書なのか、誰のものか)の説明が無い。続く「Hermitage の README の表(100 セル)と食い違いませんでした」も、何と照らして合っていたのかが読者には決まらない。同じ節の「ライトスキュー」も定義が無い(ロストアップデートは「読み、1 を引いて書き戻す」から推測できる)
    - quote: 名指しした構成で同期スタンバイを止めると、書き込みは観測の時間(15・60 秒)の間は返りませんでした(12/12 試行)。
      why: 4 章の冒頭で「・」は「1 回目・2 回目」の順と約束しているが、ここの「15・60 秒」は 2 つの観測の時間の条件のように読める。どちらなのかが決まらない。次の箇条の「名指しなし・on」「名指しなし・local」の「・」も別の使い方で、local が synchronous_commit の値だという説明も無い
    - quote: PostgreSQL に索引を 1 本足すと、顧客 1 人の絞り込みは 42.5 ms・49.0 ms から 0.45 ms・0.56 ms になり、一括の取り込みは 1.59 倍・1.60 倍になりました。
      why: 「1.59 倍」が、取り込みにかかる時間が 1.59 倍に延びたのか、速さが 1.59 倍になったのか、文だけでは決まらない。文脈からは費用(時間が延びた)と推測できるが、何の倍なのかが書かれていない
    - quote: "| 1 つの RDB で兼ねてよい規模の境目は実測で示す | 一部だけ実測 | 集計を 4 本並べた 100 万行・300 万行でだけ、検索の p95 が 1.5 倍を超えた。境目の線は、この規模では引けていない |"
      why: この実験は 4.3 の結果の箇条に出てこない。「兼ねる」が何と何を 1 つの RDB で兼ねることなのか(業務の検索と集計か)、「集計を 4 本並べた」がどういう条件か、1.5 倍が何に対する倍なのかが、この表の行だけでは分からない
    - quote: Kafka の保持の 7 日を 5 秒に、削除の印の 1 日を 3 秒にしています。
      why: 「削除の印」を扱った実験が、4 章の本文に出てこない。何の削除の印で、どの題材のどの結果に関わる短縮なのかが分からない
    - quote: "- 判定器を監査する:誤りを仕込んだデータと誤りの無いデータを流す。監査は 189 ケースで、2 回とも全部が合格した"
