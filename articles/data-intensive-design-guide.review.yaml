premortem: |
  (1) 2 回の実行の比較の数字を、正本より広い範囲の数字として書いている。RERUN.md は結果のファイルごと(main.jsonl、kafka.jsonl)に比を出しているのに、原稿が「題材 A の」とまとめると、同じ題材の別のファイルの値(最大 179.90)と食い違う。
  (2) 正本が条件つきで書いた結果を、原稿が片方の条件だけで書く。スロットが無効になったときの Kafka Connect のログの警告、キーごとの順序を外したときの最終状態の食い違い、並べて切り替える構成で受け手が落ちた条件の古い読み取り(2 回とも発生)が落ち、「気づく手がかりが無い」「順序だけ」「2 回目にだけ起きた」と読める。
  (3) 「0 件」の一部に試行の数が無い。原稿は自分で「0 件は、この手順と試行の数で起きなかったという意味」と決めているので、試行の数の無い 0 件は「起きない」と読まれる。あわせて、ライセンス上は OSS と言い切れない製品(Redpanda、CockroachDB)を「OSS」とまとめた語が訂正の原因になりうる。
