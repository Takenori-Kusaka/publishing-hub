      why: 「連邦的」が本文のどこでも定義されていない。中央チームと各チームの権限の分け方を指すのか、資産の置き場所を分けることなのかが読み取れず、全社展開の担当者として何をすればよいかに落とせない。8章でも同じ語を繰り返すだけで説明がない。
