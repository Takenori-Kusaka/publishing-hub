      why: 続く表は番号つきの8項目を一度に並べ、以後の本文が「7、58、72」「11、18、29」のように番号だけで参照する。番号と中身の対応を覚えていないと後半が追えず、表に戻る往復が多くなる。
    - quote: 筆者は、ロールを分けたAIエージェント用のハーネスと、その評価基盤を [pit-crew](https://github.com/Takenori-Kusaka/pit-crew) で作っています。
      why: 筆者の読みの節の途中に自作リポジトリの紹介が入り、何がエンタープライズハーネスとどう関係するのか(どの部品にあたるのか)が書かれていない。「まだ作っている途中で、評価も途中です」とあり、参照する理由が読者にない。
    - quote: 薄く、連邦的に、という推奨は方向であって、設計の型ではありません
      why: 全社展開の担当者として最初の一歩(何をどこに置くか)を探しているが、記事の結論が「型はまだ無い」で終わる。apm.yml の例は targets が copilot のみで、Claude Code で同じことをどうするかは書かれていない。
  figure_only_subject: 図(画像)は無い。コード例の apm.yml だけを見ると、スキルやプラグインを依存として宣言するパッケージ管理の話に見える。
