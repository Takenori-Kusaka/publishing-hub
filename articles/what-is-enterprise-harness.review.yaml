    - quote: 決定的なガードレールには試験の一式を用意し
      why: 「決定的なガードレール」が何を指すか(フックや静的検査のような、LLM の判断を介さない制御か)が書かれていない。「試験の一式」も、何に対する試験かが分からない。
    - quote: 本番までの道筋の手引き
      why: 原語(paved road や path to production の類か)が示されておらず、社内のどの文書にあたるのかが分からない。表の他の項目(スキル、フック)と粒度がそろっているのかも判断できない。
  bounce_points:
    - quote: 日本でも、同じ方向の指摘があります。
      why: ここから IPA のシャドーAI(従業員が個人の AI サービスを業務に使うこと)の話に移るが、筆者自身が直後に「両者の対象は異なります。」と書いている。コーディングエージェントの全社展開を調べに来た読者には、77%・82% などの数字を含む一節が本題から外れた寄り道に見え、読み飛ばしたくなる。
