      why: 「エージェント体験」という語が定義されていない。開発者体験(DX)は分かるが、エージェントにとっての「体験」が何を指すのか(エージェントが読む文脈の整い方なのか、人がエージェントを使う体験なのか)が分からない。
    - quote: Radarは、OpenCodeの上に独自のコーディングエージェントを作った組織も見たと書いたうえで、それを勧めていません。
