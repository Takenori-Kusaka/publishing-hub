<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!--
    ピットイン方式 キービジュアル(1:1。LinkedIn / Bluesky の縦長表示用)。横長マスター(pit-in-overview.svg)と同じ要素を縦に積む。
    上: 題。中: 内側の速いループと外殻。下: 一文の要約。
  -->
  <defs>
    <symbol id="person" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" fill="currentColor"/>
      <path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor"/>
    </symbol>
    <symbol id="chip" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/>
      <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1080" height="1080" fill="{{color.paper.100}}"/>

  <!-- 題 -->
  <text x="70" y="104" font-family="{{font.heading}}" font-size="26" fill="{{color.ink.600}}" data-tier="secondary">AI が実装する時代の開発プロセス</text>
  <text x="66" y="184" font-family="{{font.heading}}" font-weight="700" font-size="66" fill="{{color.ai.800}}">ピットイン方式</text>
  <text x="70" y="222" font-family="{{font.code}}" font-size="20" letter-spacing="4" fill="{{color.ai.600}}" data-tier="secondary">PIT-IN</text>

  <!-- 外殻 -->
  <rect x="70" y="262" width="940" height="580" rx="280" fill="none" stroke="{{color.ink.300}}" stroke-width="{{figure.stroke.ring}}" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g font-family="{{font.heading}}" font-size="22" fill="{{color.ink.700}}" data-tier="secondary">
    <text x="540" y="246" fill="{{color.ink.600}}" text-anchor="middle">外殻 ── 事業判断の節目(低頻度)</text>
    <circle cx="350" cy="262" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="370" y="294">企画承認</text>
    <circle cx="975" cy="420" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="955" y="398" text-anchor="end">ステージ移行</text>
    <circle cx="930" cy="748" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="910" y="790" text-anchor="end">リリース決裁</text>
  </g>

  <!-- 内側のサーキット -->
  <rect x="330" y="402" width="420" height="300" rx="150" fill="none" stroke="{{color.ai.800}}" stroke-width="{{figure.stroke.track}}"/>
  <g fill="{{color.paper.100}}">
    <path d="M-10 -9 L10 0 L-10 9 Z" transform="translate(374 446) rotate(-45)"/>
    <path d="M-10 -9 L10 0 L-10 9 Z" transform="translate(706 658) rotate(135)"/>
  </g>
  <g font-family="{{font.heading}}" text-anchor="middle" data-tier="secondary">
    <text x="500" y="560" font-size="22" fill="{{color.ai.600}}">内側 ── AI 協調ループ</text>
    <text x="500" y="590" font-size="18" fill="{{color.ink.600}}">数時間〜数日で 1 周</text>
  </g>

  <g transform="translate(540 402)">
    <rect x="-120" y="-34" width="240" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <use href="#chip" x="-104" y="-18" width="36" height="36" color="{{color.paper.100}}"/>
    <text x="18" y="14" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">AI 実装</text>
  </g>

  <g transform="translate(750 552)">
    <rect x="-100" y="-62" width="200" height="124" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <use href="#chip" x="-18" y="-54" width="36" height="36" color="{{color.paper.100}}"/>
    <text x="0" y="26" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">自動検証</text>
    <text x="0" y="52" font-family="{{font.heading}}" font-size="20" fill="{{color.ai.200}}" text-anchor="middle" data-tier="secondary">機械が判定</text>
  </g>

  <g transform="translate(540 702)">
    <path d="M-70 0 v 50 M70 0 v 50" stroke="{{color.human.500}}" stroke-width="6"/>
    <rect x="-150" y="44" width="300" height="80" rx="{{figure.radius.box}}" fill="{{color.human.500}}"/>
    <use href="#person" x="-138" y="64" width="40" height="40" color="{{color.paper.100}}"/>
    <text x="24" y="98" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">独立レビュー</text>
  </g>

  <g transform="translate(330 552)">
    <path d="M0 -44 h -40 M0 44 h -40" stroke="{{color.human.500}}" stroke-width="6"/>
    <rect x="-240" y="-62" width="200" height="124" rx="{{figure.radius.box}}" fill="{{color.human.500}}"/>
    <use href="#person" x="-160" y="-56" width="40" height="40" color="{{color.paper.100}}"/>
    <text x="-140" y="28" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">仕様承認</text>
    <text x="-140" y="52" font-family="{{font.heading}}" font-size="20" fill="{{color.human.100}}" text-anchor="middle" data-tier="secondary">ここから始まる</text>
  </g>

  <!-- 一文の要約 -->
  <text font-family="{{font.heading}}" font-weight="700" font-size="34" fill="{{color.ink.900}}" text-anchor="middle">
    <tspan x="540" y="918">マシンは人間より速い。</tspan>
    <tspan x="540" y="968">それでも、決められた場所では必ず人間が触る。</tspan>
  </text>
  <text x="540" y="1012" font-family="{{font.body}}" font-size="22" fill="{{color.ink.600}}" text-anchor="middle" data-tier="secondary">速いループは AI と機械が回す。ループの中で人が触るのは、この 2 か所。</text>
  <text x="540" y="1050" font-family="{{font.code}}" font-size="18" fill="{{color.ink.500}}" text-anchor="middle" data-tier="secondary">process-compass / PIT-IN</text>
</svg>
