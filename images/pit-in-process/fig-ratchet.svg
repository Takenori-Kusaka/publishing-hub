<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 節図: AI 自律レベル L1〜L3 を階段で。引き上げは判定(細い矢印・藍)、引き下げは自動(太い矢印・弁柄)という非対称 -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">引き上げは判定、引き下げは自動</text>

  <!-- 階段 -->
  <g font-family="{{font.heading}}" font-weight="700" font-size="24" text-anchor="middle">
    <rect x="60" y="300" width="180" height="120" rx="12" fill="{{color.ai.100}}" stroke="{{color.ai.300}}" stroke-width="2"/>
    <text x="150" y="340" font-family="{{font.code}}" font-size="28" fill="{{color.ai.800}}">L1</text>
    <text x="150" y="376" fill="{{color.ink.900}}">主導実装</text>
    <text x="150" y="404" font-size="18" font-weight="400" fill="{{color.ink.600}}" data-tier="secondary">人が全変更を確認</text>

    <rect x="270" y="220" width="180" height="200" rx="12" fill="{{color.ai.200}}" stroke="{{color.ai.300}}" stroke-width="2"/>
    <text x="360" y="260" font-family="{{font.code}}" font-size="28" fill="{{color.ai.800}}">L2</text>
    <text fill="{{color.ink.900}}"><tspan x="360" y="296">仕様駆動の</tspan><tspan x="360" y="326">並行実行</tspan></text>
    <text x="360" y="356" font-size="18" font-weight="400" fill="{{color.ink.600}}" data-tier="secondary">人が統合点を確認</text>

    <rect x="480" y="140" width="180" height="280" rx="12" fill="{{color.ai.300}}" stroke="{{color.ai.400}}" stroke-width="2"/>
    <text x="570" y="180" font-family="{{font.code}}" font-size="28" fill="{{color.ai.900}}">L3</text>
    <text x="570" y="216" fill="{{color.ink.900}}">自己修復</text>
    <text x="570" y="244" font-size="18" font-weight="400" fill="{{color.ink.700}}" data-tier="secondary">機械が常時監視</text>
    <text x="570" y="268" font-size="18" font-weight="400" fill="{{color.ink.700}}" data-tier="secondary">登録した種別に限る</text>
  </g>

  <!-- 引き上げ(判定を要する): 細い点線の矢印 -->
  <path d="M110 280 Q 300 150 536 134" fill="none" stroke="{{color.ai.800}}" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M520 124 l 18 10 l -16 12" fill="none" stroke="{{color.ai.800}}" stroke-width="3"/>
  <text x="300" y="104" font-family="{{font.heading}}" font-weight="700" font-size="23" fill="{{color.ai.800}}" text-anchor="middle">引き上げ ── 申請して判定を受ける</text>

  <!-- 引き下げ(自動): 太い矢印 -->
  <path d="M560 436 Q 470 480 380 440" fill="none" stroke="{{color.danger.text}}" stroke-width="7" stroke-linecap="round"/>
  <path d="M340 436 Q 250 480 170 440" fill="none" stroke="{{color.danger.text}}" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 428 l -22 12 l 20 14" fill="none" stroke="{{color.danger.text}}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 428 l -22 12 l 20 14" fill="none" stroke="{{color.danger.text}}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="516" font-family="{{font.heading}}" font-weight="700" font-size="23" fill="{{color.danger.text}}" text-anchor="middle">引き下げ ── 検知した時点で 1 段階ずつ自動に発火</text>

  <text x="40" y="548" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">差し戻し率 0% が続いたら、順調ではなく形骸化の疑いとして引き下げる。</text>
</svg>
