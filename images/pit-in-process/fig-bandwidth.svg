<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 節図: 生成が速いほど人間の検証帯域が律速点になり、逐行確認が承認操作へ縮退する(標準のフェーズ2 まとめと開発者向け手引き)。下に帯域を守る 3 つの方法 -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">速くなるほど、人間の検証帯域が律速点になる</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24" text-anchor="middle">
    <rect x="130" y="88" width="460" height="60" rx="12" fill="{{color.ai.100}}" stroke="{{color.ai.300}}" stroke-width="2"/>
    <text x="360" y="127" fill="{{color.ai.800}}">生成が速く、自律的になる</text>
    <path d="M360 148 v 26" stroke="{{color.ink.400}}" stroke-width="3"/><path d="M350 168 l 10 10 l 10 -10" fill="none" stroke="{{color.ink.400}}" stroke-width="3"/>

    <rect x="130" y="184" width="460" height="60" rx="12" fill="{{color.human.100}}" stroke="{{color.human.500}}" stroke-width="3"/>
    <text x="360" y="223" fill="{{color.human.700}}">人間の検証帯域が、最大の律速点になる</text>
    <path d="M360 244 v 26" stroke="{{color.ink.400}}" stroke-width="3"/><path d="M350 264 l 10 10 l 10 -10" fill="none" stroke="{{color.ink.400}}" stroke-width="3"/>

    <rect x="90" y="280" width="540" height="64" rx="12" fill="{{color.paper.200}}" stroke="{{color.danger.text}}" stroke-width="3"/>
    <text x="360" y="321" fill="{{color.danger.text}}">大きな差分の逐行確認が、承認操作へ縮退する</text>
  </g>

  <text x="40" y="400" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">帯域を守る方法は 3 つ</text>
  <g font-family="{{font.heading}}" font-weight="700" font-size="23" text-anchor="middle">
    <rect x="40" y="420" width="200" height="64" rx="12" fill="{{color.ai.800}}"/>
    <text x="140" y="460" fill="{{color.paper.100}}">検査の機械化</text>
    <rect x="260" y="420" width="200" height="64" rx="12" fill="{{color.paper.200}}" stroke="{{color.ai.800}}" stroke-width="3"/>
    <text x="360" y="460" fill="{{color.ai.800}}">判断の分業</text>
    <rect x="480" y="420" width="200" height="64" rx="12" fill="{{color.paper.200}}" stroke="{{color.ai.800}}" stroke-width="3"/>
    <text x="580" y="460" fill="{{color.ai.800}}">判定の期限</text>
  </g>
  <text x="40" y="530" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">判断の質は、読んだ行数ではなく、確認した観点の数で決まる。</text>
</svg>
