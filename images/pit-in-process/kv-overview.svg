<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    ピットイン方式 キービジュアル(1.91:1 マスター)。@kusaka/brand の占位子 {{…}} は描画時に置換される。
    構図: 左に題と一文、右に「内側の速いループ」(角丸のサーキット)。人が触る 2 か所だけを丹のピットボックスとして外へ突き出す。
    外側の点線の環が「外殻 = 事業判断の節目」。読み順は時計回り、開始は 9 時の仕様承認。
    規則(brand/05-figures.md): 塊は 4 つ(題・ループ・ピット・外殻)、強調色は丹 1 色、主ラベルは 38px 以上、凡例を置かない、題と一文を画像内に置く。
    data-tier="secondary" の文字は補助ラベル。同じ情報を本文に書く。
  -->
  <defs>
    <symbol id="person" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" fill="currentColor"/>
      <path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor"/>
    </symbol>
    <symbol id="chip" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/>
      <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="630" fill="{{color.paper.100}}"/>

  <!-- 題 -->
  <text x="60" y="112" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.600}}" data-tier="secondary">AI が実装する時代の開発プロセス</text>
  <text x="56" y="186" font-family="{{font.heading}}" font-weight="700" font-size="60" fill="{{color.ai.800}}">ピットイン方式</text>
  <text x="60" y="224" font-family="{{font.code}}" font-size="20" letter-spacing="4" fill="{{color.ai.600}}" data-tier="secondary">PIT-IN</text>

  <!-- 一文の要約 -->
  <text font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ink.900}}" data-tier="secondary">
    <tspan x="60" y="316">マシンは人間より速い。</tspan>
    <tspan x="60" y="358">それでも、決められた場所では</tspan>
    <tspan x="60" y="400">必ず人間が触る。</tspan>
  </text>
  <text font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">
    <tspan x="60" y="458">速いループは AI と機械が回す。</tspan>
    <tspan x="60" y="490">ループの中で人が触るのは、この 2 か所。</tspan>
  </text>

  <!-- 外殻: 事業判断の節目(点線の環) -->
  <rect x="420" y="96" width="770" height="520" rx="260" fill="none" stroke="{{color.ink.300}}" stroke-width="{{figure.stroke.ring}}" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g font-family="{{font.heading}}" font-size="20" fill="{{color.ink.700}}" data-tier="secondary">
    <text x="700" y="62" fill="{{color.ink.600}}">外殻 ── 事業判断の節目(低頻度)</text>
    <circle cx="700" cy="96" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="720" y="103">企画承認</text>
    <circle cx="1129" cy="189" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="1110" y="168" text-anchor="end">ステージ移行</text>
    <circle cx="1155" cy="486" r="9" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="4"/>
    <text x="1138" y="468" text-anchor="end">リリース決裁</text>
  </g>

  <!-- 内側: AI 協調ループ(サーキット) -->
  <rect x="660" y="170" width="420" height="300" rx="150" fill="none" stroke="{{color.ai.800}}" stroke-width="{{figure.stroke.track}}"/>
  <!-- 走行方向(時計回り) -->
  <g fill="{{color.paper.100}}">
    <path d="M-10 -9 L10 0 L-10 9 Z" transform="translate(704 214) rotate(-45)"/>
    <path d="M-10 -9 L10 0 L-10 9 Z" transform="translate(1036 426) rotate(135)"/>
  </g>
  <g font-family="{{font.heading}}" text-anchor="middle" data-tier="secondary">
    <text x="822" y="328" font-size="22" fill="{{color.ai.600}}">内側 ── AI 協調ループ</text>
    <text x="822" y="358" font-size="18" fill="{{color.ink.600}}">数時間〜数日で 1 周</text>
  </g>

  <!-- 12 時: AI 実装(機械の面) -->
  <g transform="translate(870 170)">
    <rect x="-120" y="-34" width="240" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <use href="#chip" x="-104" y="-18" width="36" height="36" color="{{color.paper.100}}"/>
    <text x="18" y="14" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">AI 実装</text>
  </g>

  <!-- 3 時: 自動検証(機械の面) -->
  <g transform="translate(1080 320)">
    <rect x="-100" y="-62" width="200" height="124" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <use href="#chip" x="-18" y="-54" width="36" height="36" color="{{color.paper.100}}"/>
    <text x="0" y="26" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">自動検証</text>
    <text x="0" y="52" font-family="{{font.heading}}" font-size="20" fill="{{color.ai.200}}" text-anchor="middle" data-tier="secondary">機械が判定</text>
  </g>

  <!-- 6 時: 独立レビュー(人のピットボックス。コースから外へ突き出す) -->
  <g transform="translate(870 470)">
    <path d="M-70 0 v 50 M70 0 v 50" stroke="{{color.human.500}}" stroke-width="6"/>
    <rect x="-150" y="44" width="300" height="80" rx="{{figure.radius.box}}" fill="{{color.human.500}}"/>
    <use href="#person" x="-138" y="64" width="40" height="40" color="{{color.paper.100}}"/>
    <text x="24" y="98" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">独立レビュー</text>
  </g>

  <!-- 9 時: 仕様承認(人のピットボックス) -->
  <g transform="translate(660 320)">
    <path d="M0 -44 h -40 M0 44 h -40" stroke="{{color.human.500}}" stroke-width="6"/>
    <rect x="-240" y="-62" width="200" height="124" rx="{{figure.radius.box}}" fill="{{color.human.500}}"/>
    <use href="#person" x="-160" y="-56" width="40" height="40" color="{{color.paper.100}}"/>
    <text x="-140" y="28" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.paper.100}}" text-anchor="middle">仕様承認</text>
    <text x="-140" y="52" font-family="{{font.heading}}" font-size="20" fill="{{color.human.100}}" text-anchor="middle" data-tier="secondary">ここから始まる</text>
  </g>

  <!-- 署名 -->
  <text x="60" y="600" font-family="{{font.code}}" font-size="18" fill="{{color.ink.500}}" data-tier="secondary">process-compass / PIT-IN</text>
</svg>
