<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <!-- 節図: 明日から始める 3 ステップ。コマンドはコード書体 -->
  <rect width="720" height="380" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">明日から ── 3 ステップ</text>

  <g font-family="{{font.heading}}" text-anchor="middle">
    <rect x="40" y="84" width="196" height="200" rx="16" fill="{{color.paper.200}}" stroke="{{color.ai.300}}" stroke-width="2"/>
    <circle cx="138" cy="128" r="24" fill="{{color.ai.800}}"/>
    <text x="138" y="138" font-family="{{font.code}}" font-weight="700" font-size="28" fill="{{color.paper.100}}">1</text>
    <text x="138" y="190" font-weight="700" font-size="23" fill="{{color.ink.900}}">テンプレートから</text>
    <text x="138" y="220" font-weight="700" font-size="23" fill="{{color.ink.900}}">リポジトリを作る</text>
    <text x="138" y="256" font-family="{{font.code}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">Use this template</text>

    <path d="M244 184 h 16" stroke="{{color.ink.400}}" stroke-width="4"/><path d="M254 176 l 10 8 l -10 8" fill="none" stroke="{{color.ink.400}}" stroke-width="4"/>

    <rect x="262" y="84" width="196" height="200" rx="16" fill="{{color.paper.200}}" stroke="{{color.ai.300}}" stroke-width="2"/>
    <circle cx="360" cy="128" r="24" fill="{{color.ai.800}}"/>
    <text x="360" y="138" font-family="{{font.code}}" font-weight="700" font-size="28" fill="{{color.paper.100}}">2</text>
    <text x="360" y="190" font-weight="700" font-size="23" fill="{{color.ink.900}}">設問に答えて</text>
    <text x="360" y="220" font-weight="700" font-size="23" fill="{{color.ink.900}}">構成を決める</text>
    <text x="360" y="256" font-family="{{font.code}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">/process-init</text>

    <path d="M466 184 h 16" stroke="{{color.ink.400}}" stroke-width="4"/><path d="M476 176 l 10 8 l -10 8" fill="none" stroke="{{color.ink.400}}" stroke-width="4"/>

    <rect x="484" y="84" width="196" height="200" rx="16" fill="{{color.paper.200}}" stroke="{{color.human.500}}" stroke-width="3"/>
    <circle cx="582" cy="128" r="24" fill="{{color.human.500}}"/>
    <text x="582" y="138" font-family="{{font.code}}" font-weight="700" font-size="28" fill="{{color.paper.100}}">3</text>
    <text x="582" y="190" font-weight="700" font-size="23" fill="{{color.ink.900}}">次の一手に</text>
    <text x="582" y="220" font-weight="700" font-size="23" fill="{{color.ink.900}}">従って回す</text>
    <text x="582" y="256" font-family="{{font.code}}" font-size="18" fill="{{color.human.600}}" data-tier="secondary">/pit</text>
  </g>
  <text x="40" y="330" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">人の判断を要する段階では、AI は先へ進まず、待つ席を示して止まる。</text>
  <text x="40" y="360" font-family="{{font.code}}" font-size="18" fill="{{color.ink.500}}" data-tier="secondary">github.com/Takenori-Kusaka/pit-in-template</text>
</svg>
