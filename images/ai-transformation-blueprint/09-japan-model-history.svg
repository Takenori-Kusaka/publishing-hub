<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <!-- 第9章のスライド: 日本の国産モデルは、研究の公開 → 商用化 → 計算資源の支援 → 政府の調達 の 4 段を順に進んだ。1 主張、要素 4 段 + 題 -->
  <rect width="720" height="600" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">研究の公開から、政府の調達へ</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">日本の国産モデルは 5 年で 4 つの段を順に上がった</text>

  <!-- 縦の矢印(読み順は上→下) -->
  <path d="M72 120 v 420" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 530 l 12 22 l 12 -22 z" fill="{{color.ink.300}}"/>

  <g font-family="{{font.heading}}">
    <!-- 段1 -->
    <rect x="100" y="104" width="580" height="100" rx="14" fill="{{color.ai.100}}"/>
    <circle cx="72" cy="154" r="14" fill="{{color.ai.800}}"/>
    <text x="120" y="142" font-weight="700" font-size="24" fill="{{color.ai.900}}">1. 研究の公開</text>
    <text x="120" y="176" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">2021 rinna 日本語 GPT-2 ／ 2023 東大 Weblab-10B</text>
    <!-- 段2 -->
    <rect x="100" y="220" width="580" height="100" rx="14" fill="{{color.ai.100}}"/>
    <circle cx="72" cy="270" r="14" fill="{{color.ai.800}}"/>
    <text x="120" y="256" font-weight="700" font-size="24" fill="{{color.ai.900}}">2. 商用化</text>
    <text x="120" y="282" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">2023-11 tsuzumi</text>
    <text x="120" y="306" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">2024 ELYZA・Fugaku-LLM・Sarashina</text>
    <!-- 段3 -->
    <rect x="100" y="336" width="580" height="100" rx="14" fill="{{color.ai.100}}"/>
    <circle cx="72" cy="386" r="14" fill="{{color.ai.800}}"/>
    <text x="120" y="374" font-weight="700" font-size="24" fill="{{color.ai.900}}">3. 計算資源の支援</text>
    <text x="120" y="408" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">2024-02 GENIAC 採択 10・20・24・16 件 ／ ABCI 3.0</text>
    <!-- 段4 到達点(千歳緑) -->
    <rect x="100" y="452" width="580" height="100" rx="14" fill="{{color.growth.100}}"/>
    <circle cx="72" cy="502" r="16" fill="{{color.growth.700}}"/>
    <text x="120" y="490" font-weight="700" font-size="24" fill="{{color.growth.900}}">4. 政府が利用者になる</text>
    <text x="120" y="524" font-size="18" fill="{{color.growth.700}}" data-tier="secondary">2026 源内 18 万人の実証 ／ 国産 LLM 7 件を選定</text>
  </g>
  <text x="40" y="586" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">段の年と件数は本文 1〜5 節。2027 年度に有償調達の予定。</text>
</svg>
