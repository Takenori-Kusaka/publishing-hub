<svg xmlns="http://www.w3.org/2000/svg" width="720" height="569" viewBox="0 0 720 569">
  <!-- 第32章のスライド: 3 本の物差し(事業・導入・文化)。丹の印は「人が現在地を判定して置く場所」 -->
  <rect width="720" height="569" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">3つの現在地 ── 3 本の物差しに自社を置く</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">
    <!-- 事業フェーズ -->
    <text x="40" y="112">事業フェーズ</text>
    <rect x="40" y="128" width="640" height="56" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="72" y="165">探索</text>
    <text x="232" y="165">成長</text>
    <text x="392" y="165">成熟</text>
    <text x="552" y="165">再生</text>
    <circle cx="416" cy="128" r="14" fill="{{color.human.500}}"/>

    <!-- 導入フェーズ -->
    <text x="40" y="248">導入フェーズ</text>
    <rect x="40" y="264" width="640" height="56" rx="{{figure.radius.box}}" fill="{{color.ai.200}}"/>
    <text x="68" y="301">S1</text>
    <text x="174" y="301">S2</text>
    <text x="280" y="301">S3</text>
    <text x="386" y="301">S4</text>
    <text x="492" y="301">S5</text>
    <text x="598" y="301">S6</text>
    <circle cx="192" cy="264" r="14" fill="{{color.human.500}}"/>

    <!-- 文化フェーズ -->
    <text x="40" y="384">文化フェーズ</text>
    <rect x="40" y="400" width="640" height="56" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="80" y="437">C1</text>
    <text x="208" y="437">C2</text>
    <text x="336" y="437">C3</text>
    <text x="464" y="437">C4</text>
    <text x="592" y="437">C5</text>
    <circle cx="226" cy="400" r="14" fill="{{color.human.500}}"/>
  </g>

  <text x="40" y="520" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >丹の印は現在地を置く例(人が判定する)。3 本の位置の組み合わせが、</tspan><tspan x="40" dy="25">次の一手を決める。</tspan></text>
</svg>
