<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <!-- 第11章のスライド: 日本の個人利用は 2 年で 6 倍、ただし「ほぼ毎日」は 3 割。左に推移の棒、右に毎日利用の対比(他国の比較値は墨の枠)。1 主張 -->
  <rect width="720" height="500" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">2 年で 6 倍、ただし「毎日」は 3 割</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">日本の個人の生成AI利用(総務省 情報通信白書)</text>

  <!-- 左: 利用経験率の推移(横棒、幅は % × 3.6) -->
  <text x="40" y="130" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">使ったことがある</text>
  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <text x="40" y="178" fill="{{color.ink.900}}">2023 年度</text>
    <rect x="170" y="156" width="33" height="30" rx="6" fill="{{color.ai.300}}"/>
    <text x="214" y="178" fill="{{color.ai.900}}">9.1%</text>

    <text x="40" y="236" fill="{{color.ink.900}}">2024 年度</text>
    <rect x="170" y="214" width="96" height="30" rx="6" fill="{{color.ai.500}}"/>
    <text x="278" y="236" fill="{{color.ai.900}}">26.7%</text>

    <text x="40" y="294" fill="{{color.ink.900}}">2025 年度</text>
    <rect x="170" y="272" width="212" height="30" rx="6" fill="{{color.ai.800}}"/>
    <text x="394" y="294" fill="{{color.ai.900}}">58.8%</text>
  </g>
  <text x="40" y="332" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">2025 年度は 15〜19 歳を追加。20 歳以上なら 52.2%</text>

  <!-- 右下: 毎日使う人の対比 -->
  <text x="40" y="392" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">ほぼ毎日使う(2025 年度)</text>
  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <rect x="40" y="410" width="300" height="56" rx="14" fill="{{color.ai.100}}"/>
    <text x="60" y="446" fill="{{color.ai.900}}">日本 約 3 割</text>
    <rect x="380" y="410" width="300" height="56" rx="14" fill="{{color.paper.100}}" stroke="{{color.ink.300}}" stroke-width="3"/>
    <text x="400" y="446" fill="{{color.ink.900}}">米・独・中 4 割超</text>
  </g>
</svg>
