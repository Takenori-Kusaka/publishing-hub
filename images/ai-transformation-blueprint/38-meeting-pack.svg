<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <!-- 第38章のスライド: 左に1枚の資料の10の見出し、右に90日の周期(測る・決める・1つ上げる・更新する)。決裁事項に丹の印 -->
  <rect width="720" height="640" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">1枚の資料を、90日ごとに更新する</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">見出し1〜4は手順の出力、5〜9は会議が問う項目、10は決めなかったこと</text>

  <g font-family="{{font.heading}}">
    <!-- 左 1枚の資料 -->
    <text x="40" y="124" font-weight="700" font-size="24" fill="{{color.ink.900}}">1枚の資料</text>
    <rect x="40" y="140" width="330" height="420" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="3"/>
    <text x="60" y="178" font-size="24" fill="{{color.ink.900}}">1 現在地</text>
    <text x="60" y="214" font-size="24" fill="{{color.ink.900}}">2 前提とする道筋</text>
    <text x="60" y="250" font-size="24" fill="{{color.ink.900}}">3 早期警戒指標</text>
    <text x="60" y="286" font-size="24" fill="{{color.ink.900}}">4 次の一手</text>
    <text x="60" y="322" font-size="24" fill="{{color.ink.900}}">5 担当役員と取りまとめ</text>
    <text x="60" y="358" font-size="24" fill="{{color.ink.900}}">6 必要なものと層</text>
    <text x="60" y="394" font-size="24" fill="{{color.ink.900}}">7 投資・効果・撤退基準</text>
    <text x="60" y="430" font-size="24" fill="{{color.ink.900}}">8 統治の最低限</text>
    <circle cx="68" cy="458" r="10" fill="{{color.human.500}}"/>
    <text x="88" y="466" font-weight="700" font-size="24" fill="{{color.ai.900}}">9 決裁事項</text>
    <text x="60" y="502" font-size="24" fill="{{color.ink.600}}">10 答えていない問い</text>
    <text x="60" y="534" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">決めなかったことを書く欄</text>

    <!-- 右 90日の周期 -->
    <text x="410" y="124" font-weight="700" font-size="24" fill="{{color.ink.900}}">90日の周期</text>
    <rect x="410" y="140" width="270" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="426" y="179" font-weight="700" font-size="24" fill="{{color.ai.900}}">測る 第1〜30日</text>
    <path d="M545 200 v 24" stroke="{{color.ink.300}}" stroke-width="4"/>
    <rect x="410" y="224" width="270" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="426" y="263" font-weight="700" font-size="24" fill="{{color.ai.900}}">決める 第31〜60日</text>
    <path d="M545 284 v 24" stroke="{{color.ink.300}}" stroke-width="4"/>
    <rect x="410" y="308" width="270" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="426" y="347" font-weight="700" font-size="24" fill="{{color.ai.900}}">1つ上げる 61〜90日</text>
    <path d="M545 368 v 24" stroke="{{color.ink.300}}" stroke-width="4"/>
    <rect x="410" y="392" width="270" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="426" y="431" font-weight="700" font-size="24" fill="{{color.text.inverse}}">更新する 90日目</text>
    <!-- 戻る線: 更新 → 測る -->
    <path d="M680 422 h 20 v -252 h -20" stroke="{{color.ink.300}}" stroke-width="4" fill="none"/>
    <!-- 更新 → 1枚の資料 -->
    <path d="M410 422 h -40" stroke="{{color.ai.800}}" stroke-width="4"/>
  </g>

  <text x="40" y="600" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">丹の印は、会議で人が決める場所。1回の90日で上げる段階は1つ。</text>
</svg>
