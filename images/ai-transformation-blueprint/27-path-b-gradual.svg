<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
  <!-- 第27章のスライド: 生産性 J カーブ。測定される生産性が 2027 年前後で底を打ち、2029 年から上向く。点線は能力の向上。1 主張「能力は上がり、成果は補完投資の後に来る」 -->
  <rect width="720" height="580" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">道筋B ── 能力は上がり、成果は補完投資の後に来る</text>

  <!-- 軸 -->
  <path d="M80 450 H 680" stroke="{{color.ink.400}}" stroke-width="3"/>
  <path d="M80 450 V 100" stroke="{{color.ink.400}}" stroke-width="3"/>
  <text x="48" y="92" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">測定される生産性</text>

  <!-- 年のラベル -->
  <g font-family="{{font.heading}}" font-size="24" font-weight="700" fill="{{color.ink.800}}" text-anchor="middle">
    <text x="140" y="488">2025</text>
    <text x="290" y="488">2027</text>
    <text x="440" y="488">2029</text>
    <text x="620" y="488">2031 →</text>
  </g>

  <!-- 能力の点線(単調増加)。ラベルは点線の右端の上 -->
  <path d="M100 370 C 250 330, 400 250, 640 130" fill="none" stroke="{{color.ai.500}}" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="660" y="118" text-anchor="end" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ai.700}}">能力の向上</text>

  <!-- J カーブ(測定される生産性)。ラベルは曲線の右端の下 -->
  <path d="M100 300 C 200 330, 250 410, 300 410 C 360 410, 420 350, 480 290 C 540 230, 600 200, 660 180" fill="none" stroke="{{color.growth.700}}" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="410" r="10" fill="{{color.growth.700}}"/>
  <text x="680" y="340" text-anchor="end" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.growth.800}}">成果が統計に現れる</text>

  <!-- 補完投資の区間(底の下の帯)。ラベルは帯の下 -->
  <rect x="200" y="420" width="220" height="4" fill="{{color.ink.400}}"/>
  <text x="310" y="446" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">補完投資の区間</text>

  <!-- 添え書き -->
  <text x="40" y="528" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">補完投資の区間では、手順・訓練・評価は産出に計上されない。</text>
  <text x="40" y="556" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">到達点は道筋Aより低い。上へ外れれば道筋A、下へ外れれば道筋C。</text>
</svg>
