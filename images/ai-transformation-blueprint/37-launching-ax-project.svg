<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 第37章のスライド: 左に本章の4つの手順、右に次の章(第38章)の手順5・6。手順1〜4の出力が1枚の型へ流れる。道筋を選ぶ・承認の位置を決めるの2か所に丹の印 -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">手順1〜4で決め、次の章の1枚に書く</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">AXコンパスは手順1〜4を画面で行い、手順5の型で1枚を出す</text>

  <g font-family="{{font.heading}}">
    <!-- 左列 本章の手順 -->
    <text x="40" y="124" font-weight="700" font-size="24" fill="{{color.ink.900}}">本章(第37章)</text>
    <rect x="40" y="140" width="300" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="56" y="179" font-weight="700" font-size="24" fill="{{color.ai.900}}">1 現在地を診断する</text>
    <rect x="40" y="212" width="300" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <circle cx="64" cy="242" r="10" fill="{{color.human.500}}"/>
    <text x="84" y="251" font-weight="700" font-size="24" fill="{{color.ai.900}}">2 道筋と指標を選ぶ</text>
    <rect x="40" y="284" width="300" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="56" y="323" font-weight="700" font-size="24" fill="{{color.ai.900}}">3 次の一手を計画する</text>
    <rect x="40" y="356" width="300" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <circle cx="64" cy="386" r="10" fill="{{color.human.500}}"/>
    <text x="84" y="395" font-weight="700" font-size="24" fill="{{color.ai.900}}">4 統治を決める</text>

    <!-- 線: 4つの手順から右の1枚へ -->
    <path d="M340 170 h 30 v 108 h 30" stroke="{{color.ink.300}}" stroke-width="4" fill="none"/>
    <path d="M340 242 h 30 v 36 h 30" stroke="{{color.ink.300}}" stroke-width="4" fill="none"/>
    <path d="M340 314 h 30 v -36 h 30" stroke="{{color.ink.300}}" stroke-width="4" fill="none"/>
    <path d="M340 386 h 30 v -108 h 30" stroke="{{color.ink.300}}" stroke-width="4" fill="none"/>

    <!-- 右列 次の章 -->
    <text x="400" y="124" font-weight="700" font-size="24" fill="{{color.ink.900}}">次の章(第38章)</text>
    <rect x="400" y="140" width="280" height="276" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ai.800}}" stroke-width="3"/>
    <text x="420" y="190" font-weight="700" font-size="24" fill="{{color.ai.900}}">5 1枚の型に書く</text>
    <text x="420" y="226" font-size="24" fill="{{color.ink.900}}">現在地・道筋・指標</text>
    <text x="420" y="262" font-size="24" fill="{{color.ink.900}}">次の一手・統治</text>
    <text x="420" y="298" font-size="24" fill="{{color.ink.900}}">投資と効果・決裁事項</text>
    <text x="420" y="358" font-weight="700" font-size="24" fill="{{color.ai.900}}">6 90日ごとに更新する</text>
    <text x="420" y="394" font-size="24" fill="{{color.ink.900}}">費用の試算・記入例</text>
  </g>

  <text x="40" y="470" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">丹の印は、人が判定する2か所(道筋を選ぶ、承認の位置を決める)。</text>
  <text x="40" y="500" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">手順1〜4の出力は、すべて手順5の1枚の見出しになる。</text>
</svg>
