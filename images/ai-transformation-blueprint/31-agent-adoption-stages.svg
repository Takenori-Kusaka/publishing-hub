<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <!-- 第31章のスライド: 自律性A0〜A4を縦に並べ、人の承認の位置(丹の印)が実行の前から後へ移る。A2とA3の間に太い境界線 -->
  <rect width="720" height="640" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">自律性は、承認の位置を動かすことで上がる</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">藍=エージェントの実行、丹=人が判定する場所(著者の整理)</text>

  <g font-family="{{font.heading}}">
    <!-- A0 -->
    <text x="40" y="140" font-family="{{font.heading}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">A0</text>
    <text x="90" y="140" font-weight="700" font-size="24" fill="{{color.ink.900}}">助言</text>
    <rect x="300" y="118" width="60" height="32" rx="8" fill="{{color.ai.800}}"/>
    <circle cx="400" cy="134" r="12" fill="{{color.human.500}}"/>
    <text x="424" y="141" font-size="20" fill="{{color.human.600}}" data-tier="secondary">人が実行</text>

    <!-- A1 -->
    <text x="40" y="214" font-family="{{font.heading}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">A1</text>
    <text x="90" y="214" font-weight="700" font-size="24" fill="{{color.ink.900}}">提案</text>
    <rect x="300" y="192" width="110" height="32" rx="8" fill="{{color.ai.800}}"/>
    <circle cx="450" cy="208" r="12" fill="{{color.human.500}}"/>
    <text x="474" y="215" font-size="20" fill="{{color.human.600}}" data-tier="secondary">案を見て人が実行</text>

    <!-- A2 -->
    <text x="40" y="288" font-family="{{font.heading}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">A2</text>
    <text x="90" y="288" font-weight="700" font-size="24" fill="{{color.ink.900}}">承認つき実行</text>
    <rect x="300" y="266" width="160" height="32" rx="8" fill="{{color.ai.800}}"/>
    <circle cx="480" cy="282" r="12" fill="{{color.human.500}}"/>
    <rect x="500" y="266" width="60" height="32" rx="8" fill="{{color.ai.800}}"/>
    <text x="580" y="289" font-size="20" fill="{{color.human.600}}" data-tier="secondary">事前に承認</text>

    <!-- 境界線 -->
    <path d="M40 330 h 640" stroke="{{color.ink.900}}" stroke-width="4" stroke-dasharray="12 8"/>
    <text x="40" y="360" font-weight="700" font-size="24" fill="{{color.ink.900}}">この線を越えるには ID・権限・記録・停止が要る</text>

    <!-- A3 -->
    <text x="40" y="426" font-family="{{font.heading}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">A3</text>
    <text x="90" y="426" font-weight="700" font-size="24" fill="{{color.ink.900}}">範囲内の自律実行</text>
    <rect x="300" y="404" width="250" height="32" rx="8" fill="{{color.ai.800}}"/>
    <circle cx="582" cy="420" r="12" fill="{{color.human.500}}"/>
    <text x="604" y="427" font-size="20" fill="{{color.human.600}}" data-tier="secondary">事後に監査</text>
    <text x="300" y="462" font-size="20" fill="{{color.human.600}}" data-tier="secondary">範囲を定め、事後に監査する</text>

    <!-- A4 -->
    <text x="40" y="520" font-family="{{font.heading}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">A4</text>
    <text x="90" y="520" font-weight="700" font-size="24" fill="{{color.ink.900}}">協調</text>
    <rect x="300" y="498" width="140" height="32" rx="8" fill="{{color.ai.800}}"/>
    <rect x="450" y="498" width="140" height="32" rx="8" fill="{{color.ai.800}}"/>
    <circle cx="264" cy="514" r="12" fill="{{color.human.500}}"/>
    <text x="300" y="556" font-size="20" fill="{{color.human.600}}" data-tier="secondary">人は目標だけを与え、個々の行動は見ない</text>
  </g>
  <text x="40" y="612" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">段階は会社に1つではなく、業務ごと・行動の種類ごとに付ける。</text>
</svg>
