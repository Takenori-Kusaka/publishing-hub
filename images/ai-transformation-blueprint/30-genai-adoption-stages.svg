<svg xmlns="http://www.w3.org/2000/svg" width="720" height="649" viewBox="0 0 720 649">
  <!-- 第30章のスライド: 導入の深さ 6 段階を下から上へ積む。色の濃さは誤りが及ぶ範囲の広さ。右に「誰が判断するか」 -->
  <rect width="720" height="649" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">導入の深さ 6 段階 ── 判断を任せる相手が広がる</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <!-- S6 -->
    <rect x="40" y="88" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.900}}"/>
    <text x="64" y="131" fill="{{color.text.inverse}}">S6 顧客へ届ける</text>
    <!-- S5 -->
    <rect x="40" y="166" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="64" y="209" fill="{{color.text.inverse}}">S5 商品に組み込む</text>
    <!-- S4 -->
    <rect x="40" y="244" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.600}}"/>
    <text x="64" y="287" fill="{{color.text.inverse}}">S4 システムに組み込む</text>
    <!-- S3 -->
    <rect x="40" y="322" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.500}}"/>
    <text x="64" y="365" fill="{{color.text.inverse}}">S3 仕事に組み込む</text>
    <!-- S2 -->
    <rect x="40" y="400" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.200}}"/>
    <text x="64" y="443" fill="{{color.ink.900}}">S2 仕事に適用する</text>
    <!-- S1 -->
    <rect x="40" y="478" width="420" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="521" fill="{{color.ink.900}}">S1 触れる</text>

    <!-- 誰が判断するか -->
    <path d="M488 92 v 140" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <text x="508" y="150" fill="{{color.ink.900}}"><tspan x="508" dy="0">顧客との</tspan><tspan x="508" dy="30">関係で決まる</tspan></text>
    <path d="M488 248 v 140" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <text x="508" y="306" fill="{{color.ink.900}}"><tspan x="508" dy="0">組織が</tspan><tspan x="508" dy="30">手順で判断</tspan></text>
    <path d="M488 404 v 140" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <text x="508" y="462" fill="{{color.ink.900}}"><tspan x="508" dy="0">個人が</tspan><tspan x="508" dy="30">毎回判断</tspan></text>
  </g>

  <text x="40" y="600" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >判断を任せる相手が、個人から組織へ、組織から顧客へ広がる。</tspan><tspan x="40" dy="25">段が上がるほど評価と統治が先に要る。</tspan></text>
</svg>
