<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <!-- 第10章のスライド: 「使われる速さ」と「効くまでの時間」は別の曲線。上段に普及、下段に生産性。1 主張 -->
  <rect width="720" height="600" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">使われるのは速く、効くのは遅い</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">普及の速さと、生産性に現れるまでの時間は別の問い</text>

  <!-- 上段: 使われる速さ -->
  <text x="40" y="130" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">使われる速さ</text>
  <g font-family="{{font.heading}}">
    <rect x="40" y="148" width="200" height="124" rx="14" fill="{{color.ai.100}}"/>
    <text x="60" y="184" font-weight="700" font-size="24" fill="{{color.ai.900}}">電化</text>
    <text x="60" y="212" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">数十年かけて普及</text>
    <text x="60" y="236" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">1880 年代〜</text>

    <rect x="260" y="148" width="200" height="124" rx="14" fill="{{color.ai.100}}"/>
    <text x="280" y="184" font-weight="700" font-size="24" fill="{{color.ai.900}}">PC</text>
    <text x="280" y="212" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">仕事利用 25%</text>
    <text x="280" y="236" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">発売から 3 年</text>
    <text x="280" y="260" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">1981〜84 年</text>

    <rect x="480" y="148" width="200" height="124" rx="14" fill="{{color.growth.100}}"/>
    <text x="500" y="184" font-weight="700" font-size="24" fill="{{color.growth.900}}">生成AI</text>
    <text x="500" y="212" font-size="18" fill="{{color.growth.700}}" data-tier="secondary">仕事利用 27%</text>
    <text x="500" y="236" font-size="18" fill="{{color.growth.700}}" data-tier="secondary">公開から 2 年</text>
    <text x="500" y="260" font-size="18" fill="{{color.growth.700}}" data-tier="secondary">2022〜24 年</text>
  </g>

  <!-- 下段: 効くまでの時間 -->
  <text x="40" y="326" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">生産性に効くまでの時間</text>
  <g font-family="{{font.heading}}">
    <rect x="40" y="344" width="200" height="124" rx="14" fill="{{color.ai.100}}"/>
    <text x="60" y="380" font-weight="700" font-size="24" fill="{{color.ai.900}}">約 40 年</text>
    <text x="60" y="408" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">工場の配置を変えて</text>
    <text x="60" y="432" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">1920 年代に加速</text>

    <rect x="260" y="344" width="200" height="124" rx="14" fill="{{color.ai.100}}"/>
    <text x="280" y="380" font-weight="700" font-size="24" fill="{{color.ai.900}}">約 25 年</text>
    <text x="280" y="408" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">生産性パラドックス</text>
    <text x="280" y="432" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">1970 年代の普及〜</text>
    <text x="280" y="456" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">1995 年以降の加速</text>

    <rect x="480" y="344" width="200" height="124" rx="14" fill="{{color.paper.300}}" stroke="{{color.ink.300}}" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="500" y="380" font-weight="700" font-size="24" fill="{{color.ink.900}}">未確定</text>
    <text x="500" y="408" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">仕事の組み替えが先</text>
    <text x="500" y="432" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">J カーブの途中</text>
  </g>
  <text x="40" y="516" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ai.800}}">速さの記録は更新された。効く時間は別の問い。</text>
  <text x="40" y="552" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >出典は本文 2・4・6 節(David 1990、Brynjolfsson ら 2021、Bick ら</tspan><tspan x="40" dy="25">2024)</tspan></text>
</svg>
