<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595">
  <!-- 第15章のスライド: 試行→個人の効果→損益→大きな価値 の4段で到達する組織の割合が落ちる階段。段が下がるほど藍を濃くする -->
  <rect width="720" height="595" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">「使う」と「儲かる」の間の段差</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">段階ごとに「はい」と答えた組織の割合(2024〜2026年の各調査)</text>

  <g font-family="{{font.heading}}">
    <!-- 1段目 -->
    <rect x="40" y="110" width="640" height="88" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="146" font-weight="700" font-size="24" fill="{{color.ai.900}}">試行した</text>
    <text x="64" y="180" font-size="20" fill="{{color.ai.700}}" data-tier="secondary">汎用ツールを検討・試行した組織</text>
    <text x="656" y="164" text-anchor="end" font-weight="700" font-size="30" fill="{{color.ai.900}}">8割超</text>

    <!-- 2段目 -->
    <rect x="80" y="212" width="600" height="88" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="104" y="248" font-weight="700" font-size="24" fill="{{color.ai.950}}">個人が速くなった</text>
    <text x="104" y="282" font-size="20" fill="{{color.ai.800}}" data-tier="secondary">生産性の向上、業務の効率化を報告</text>
    <text x="656" y="266" text-anchor="end" font-weight="700" font-size="30" fill="{{color.ai.950}}">8〜9割</text>

    <!-- 3段目 -->
    <rect x="120" y="314" width="560" height="88" rx="{{figure.radius.box}}" fill="{{color.ai.600}}"/>
    <text x="144" y="350" font-weight="700" font-size="24" fill="{{color.paper.100}}">損益に効いた</text>
    <text x="144" y="384" font-size="20" fill="{{color.ai.100}}" data-tier="secondary">利益・売上・営業利益への影響を報告</text>
    <text x="656" y="368" text-anchor="end" font-weight="700" font-size="30" fill="{{color.paper.100}}">1〜4割弱</text>

    <!-- 4段目 -->
    <rect x="160" y="416" width="520" height="88" rx="{{figure.radius.box}}" fill="{{color.ai.900}}"/>
    <text x="184" y="452" font-weight="700" font-size="24" fill="{{color.paper.100}}">大きな価値を得た</text>
    <text x="184" y="486" font-size="20" fill="{{color.ai.200}}" data-tier="secondary">変革的な価値、営業利益の5%以上</text>
    <text x="656" y="470" text-anchor="end" font-weight="700" font-size="30" fill="{{color.paper.100}}">1割前後</text>
  </g>
  <text x="40" y="546" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >最も大きく落ちるのは2段目と3段目の間。</tspan><tspan x="40" dy="25">速くなった時間がどこへ行ったかを測る。</tspan></text>
</svg>
