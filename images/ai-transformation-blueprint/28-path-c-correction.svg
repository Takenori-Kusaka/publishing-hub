<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592">
  <!-- 第28章のスライド: 左に Bain の推計(必要な売上 2 兆ドルと不足 8,000 億ドル)の 2 本の棒、右に調整の後も残るもの。1 主張「投資が売上を追い越した差は、調整で埋まる。技術は残る」 -->
  <rect width="720" height="592" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">道筋C ── 投資と売上の差は調整で埋まり、技術は残る</text>

  <!-- 左: 棒 -->
  <text x="60" y="110" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">2030 年に必要な売上(Bain)</text>
  <rect x="60" y="130" width="300" height="56" rx="8" fill="{{color.ai.700}}"/>
  <text x="76" y="168" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}">年 2 兆ドル</text>

  <text x="60" y="236" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">節約を含めても足りない分</text>
  <rect x="60" y="256" width="120" height="56" rx="8" fill="{{color.warn.600}}"/>
  <text x="196" y="294" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.warn.700}}">8,000 億ドル</text>

  <!-- 矢印 -->
  <path d="M210 360 v 60" stroke="{{color.ink.500}}" stroke-width="4"/>
  <path d="M196 408 L 210 424 L 224 408" fill="none" stroke="{{color.ink.500}}" stroke-width="4" stroke-linecap="round"/>
  <text x="236" y="396" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">2026〜28 年: 投資の収縮と再編</text>

  <!-- 右: 残るもの -->
  <rect x="400" y="100" width="280" height="216" rx="{{figure.radius.box}}" fill="{{color.growth.100}}" stroke="{{color.growth.700}}" stroke-width="3"/>
  <text x="540" y="140" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.growth.800}}">調整の後も残るもの</text>
  <g font-family="{{font.body}}" font-size="24" fill="{{color.growth.900}}">
    <text x="424" y="190">・建設された計算基盤</text>
    <text x="424" y="232">・学習済みのモデル</text>
    <text x="424" y="274">・下がり続ける推論の価格</text>
  </g>

  <!-- 下: 展開期 -->
  <rect x="60" y="448" width="620" height="56" rx="{{figure.radius.box}}" fill="{{color.growth.100}}"/>
  <text x="370" y="484" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.growth.800}}">2031 年: 残った基盤の上で展開期が始まる</text>

  <text x="40" y="540" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >Perez の枠組み: 導入期のバブル → 転換点 → 展開期。</tspan><tspan x="40" dy="28">利用者には価格と人材の面で有利。</tspan></text>
</svg>
