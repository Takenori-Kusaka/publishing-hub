<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 第7章のスライド: METR の時間地平を 3 段の階段で示し、16 時間超は測れないという限界を点線の枠で置く。1 主張「倍増を続け、計測の限界に達した」 -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">任せられる作業の長さは、倍増を続けてきた</text>
  <text x="40" y="84" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">AI が 50% の確率で完了できる作業の長さ(METR 時間地平 1.1)</text>

  <path d="M60 440 H660" stroke="{{color.ink.300}}" stroke-width="3"/>

  <!-- 段 1: 214 分 -->
  <rect x="80" y="360" width="150" height="80" rx="{{figure.radius.box}}" fill="{{color.ai.400}}"/>
  <text x="155" y="344" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="28" fill="{{color.ai.900}}">214 分</text>
  <text x="155" y="474" text-anchor="middle" font-family="{{font.body}}" font-size="24" fill="{{color.ink.800}}">2025 年 8 月</text>

  <!-- 段 2: 320 分 -->
  <rect x="250" y="300" width="150" height="140" rx="{{figure.radius.box}}" fill="{{color.ai.600}}"/>
  <text x="325" y="284" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="28" fill="{{color.ai.900}}">320 分</text>
  <text x="325" y="474" text-anchor="middle" font-family="{{font.body}}" font-size="24" fill="{{color.ink.800}}">2025 年 11 月</text>

  <!-- 段 3: 約 12 時間 -->
  <rect x="420" y="160" width="150" height="280" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
  <text x="495" y="144" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="28" fill="{{color.ai.900}}">約 12 時間</text>
  <text x="495" y="474" text-anchor="middle" font-family="{{font.body}}" font-size="24" fill="{{color.ink.800}}">2026 年 2 月</text>

  <!-- 限界の枠 -->
  <rect x="590" y="100" width="100" height="340" rx="{{figure.radius.box}}" fill="none" stroke="{{color.ink.500}}" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="640" y="250" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">16 時間</text>
  <text x="640" y="282" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">超は</text>
  <text x="640" y="314" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">測れない</text>

  <text x="40" y="520" font-family="{{font.body}}" font-size="24" fill="{{color.ink.900}}">2023 年以降の倍増時間は 131 日。</text>
  <text x="40" y="546" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">計測団体は 2026 年 9 月に更新を停止。倍増の傾向は 2026 年前半まで。</text>
</svg>
