<svg xmlns="http://www.w3.org/2000/svg" width="720" height="549" viewBox="0 0 720 549">
  <!-- 第22章: Agrawal・Gans・Goldfarb の 3 水準(点・応用・システム)を 3 段の帯で示し、右に本書の導入の深さ S1〜S6 を対応づける。下の帯ほど組み替える範囲が広く、補完的な投資が大きい -->
  <rect width="720" height="520" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">AI 導入の 3 水準と、本書の 6 段階</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">下へ行くほど組み替える範囲が広く、補完的な投資が大きい</text>

  <g font-family="{{font.heading}}">
    <!-- 点の解決策 -->
    <rect x="40" y="110" width="640" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="150" font-weight="700" font-size="26" fill="{{color.ai.900}}">点の解決策</text>
    <text x="64" y="186" font-size="24" fill="{{color.ink.800}}">個人の作業を置き換える</text>
    <text x="520" y="150" font-weight="700" font-size="26" fill="{{color.ai.800}}">S1・S2</text>
    <text x="520" y="186" font-size="22" fill="{{color.ink.700}}" data-tier="secondary">触れる・適用</text>

    <!-- 応用の解決策 -->
    <rect x="40" y="236" width="640" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.200}}"/>
    <text x="64" y="276" font-weight="700" font-size="26" fill="{{color.ai.900}}">応用の解決策</text>
    <text x="64" y="312" font-size="24" fill="{{color.ink.800}}">部門の手順とシステムを組み直す</text>
    <text x="520" y="276" font-weight="700" font-size="26" fill="{{color.ai.800}}">S3・S4</text>
    <text x="520" y="312" font-size="22" fill="{{color.ink.700}}" data-tier="secondary">組み込む</text>

    <!-- システムの解決策 -->
    <rect x="40" y="362" width="640" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="64" y="402" font-weight="700" font-size="26" fill="{{color.ai.950}}">システムの解決策</text>
    <text x="64" y="438" font-size="24" fill="{{color.ink.900}}">事業の意思決定を組み直す</text>
    <text x="520" y="402" font-weight="700" font-size="26" fill="{{color.ai.900}}">S5・S6</text>
    <text x="520" y="438" font-size="22" fill="{{color.ink.800}}" data-tier="secondary">商品に・顧客へ</text>
  </g>

  <text x="40" y="504" font-family="{{font.body}}" font-size="15" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >3 水準は Agrawal・Gans・Goldfarb『Power and Prediction』(2022)。S1〜S6</tspan><tspan x="40" dy="21">は本書の定義(第32章)</tspan></text>
</svg>
