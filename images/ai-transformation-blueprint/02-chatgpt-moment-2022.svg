<svg xmlns="http://www.w3.org/2000/svg" width="720" height="557" viewBox="0 0 720 557">
  <!-- 第2章のスライド: 仕事での利用率を PC(発売 3 年後 25%)と生成AI(公開 2 年後 27%)の 2 本の棒で比べる。1 主張「PC より速く広がった」 -->
  <rect width="720" height="557" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">仕事での利用は、PC より速く広がった</text>
  <text x="40" y="84" font-family="{{font.body}}" font-size="20" fill="{{color.ink.600}}" data-tier="secondary">米国の就業者のうち、仕事で使っている人の割合(Bick ほか 2024)</text>

  <!-- 基線 -->
  <path d="M80 400 H640" stroke="{{color.ink.300}}" stroke-width="3"/>

  <!-- PC の棒: 25% → 高さ 250 -->
  <rect x="150" y="150" width="160" height="250" rx="{{figure.radius.box}}" fill="{{color.ink.300}}"/>
  <text x="230" y="134" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="30" fill="{{color.ink.800}}">25%</text>
  <text x="230" y="440" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">PC</text>
  <text x="230" y="470" text-anchor="middle" font-family="{{font.body}}" font-size="24" fill="{{color.ink.700}}">発売から 3 年(1984)</text>

  <!-- 生成AI の棒: 27% → 高さ 270 -->
  <rect x="410" y="130" width="160" height="270" rx="{{figure.radius.box}}" fill="{{color.ai.700}}"/>
  <text x="490" y="114" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="30" fill="{{color.ai.900}}">27%</text>
  <text x="490" y="440" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ai.900}}">生成AI</text>
  <text x="490" y="470" text-anchor="middle" font-family="{{font.body}}" font-size="24" fill="{{color.ai.800}}">公開から 2 年(2024)</text>

  <text x="40" y="508" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >人口ベースでは 3 年で世界人口の 53%(AI Index 2026)。</tspan><tspan x="40" dy="25">速さは成果を意味しない。</tspan></text>
</svg>
