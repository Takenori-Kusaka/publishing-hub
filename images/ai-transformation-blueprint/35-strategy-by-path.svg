<svg xmlns="http://www.w3.org/2000/svg" width="720" height="569" viewBox="0 0 720 569">
  <!-- 第35章のスライド: 3 種類の手を 3 段に積む。下 2 段は 3 つの道筋すべてにまたがり、上 1 段だけ道筋ごとに分かれる -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">3 種類の手 ── 賭けるのは上の 1 段だけ</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <!-- 上段: 道筋ごとの賭ける手 -->
    <rect x="40" y="110" width="200" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="60" y="152" fill="{{color.text.inverse}}"><tspan x="60" dy="0">道筋A 加速</tspan><tspan x="60" dy="34">S5・S6へ先行</tspan></text>
    <rect x="260" y="110" width="200" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="280" y="152" fill="{{color.text.inverse}}"><tspan x="280" dy="0">道筋B 漸進</tspan><tspan x="280" dy="34">S3・S4を広げる</tspan></text>
    <rect x="480" y="110" width="200" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="500" y="152" fill="{{color.text.inverse}}"><tspan x="500" dy="0">道筋C 調整</tspan><tspan x="500" dy="34">費用の規律</tspan></text>

    <!-- 中段: 選択権を買う手 -->
    <rect x="40" y="240" width="640" height="100" rx="{{figure.radius.box}}" fill="{{color.ai.400}}"/>
    <text x="60" y="282" fill="{{color.text.inverse}}"><tspan x="60" dy="0">選択権を買う手</tspan><tspan x="60" dy="34">乗り換えられる設計、小さな本番、探索事業で試す</tspan></text>

    <!-- 下段: 後悔しない手 -->
    <rect x="40" y="360" width="640" height="100" rx="{{figure.radius.box}}" fill="{{color.growth.600}}"/>
    <text x="60" y="402" fill="{{color.text.inverse}}"><tspan x="60" dy="0">後悔しない手</tspan><tspan x="60" dy="34">S3まで、データ整理、評価の能力、文化C3</tspan></text>
  </g>

  <text x="40" y="520" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >下の 2 段はどの道筋でも使える。賭ける手は後悔しない手と選択権を買う手の</tspan><tspan x="40" dy="25">上に乗る。</tspan></text>
</svg>
