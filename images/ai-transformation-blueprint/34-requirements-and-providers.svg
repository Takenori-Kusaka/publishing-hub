<svg xmlns="http://www.w3.org/2000/svg" width="720" height="621" viewBox="0 0 720 621">
  <!-- 第34章のスライド: 段階 S1〜S6 を横に、要るものを 4 段に積む。下ほど買えるもの、上ほど作るもの -->
  <rect width="720" height="600" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">段階が上がるほど「買う」から「作る」へ</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <!-- 4 段の帯(左端の開始位置が段階に対応: S1, S3, S4, S5) -->
    <rect x="40" y="380" width="640" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="60" y="423" fill="{{color.ink.900}}">買える：席の契約、業務アプリ</text>

    <rect x="254" y="302" width="426" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.400}}"/>
    <text x="274" y="345" fill="{{color.text.inverse}}">整える：社内文書、権限</text>

    <rect x="361" y="224" width="319" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="381" y="267" fill="{{color.text.inverse}}">運用し続ける：評価・監視</text>

    <rect x="468" y="146" width="212" height="68" rx="{{figure.radius.box}}" fill="{{color.growth.700}}"/>
    <text x="488" y="189" fill="{{color.text.inverse}}">顧客に負う</text>

    <!-- 段階の目盛 -->
    <path d="M40 476 h 640" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <text x="48" y="516" fill="{{color.ink.900}}">S1</text>
    <text x="155" y="516" fill="{{color.ink.900}}">S2</text>
    <text x="262" y="516" fill="{{color.ink.900}}">S3</text>
    <text x="369" y="516" fill="{{color.ink.900}}">S4</text>
    <text x="476" y="516" fill="{{color.ink.900}}">S5</text>
    <text x="583" y="516" fill="{{color.ink.900}}">S6</text>
  </g>

  <text x="40" y="572" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >運用し続けるもの＝評価・監視・費用管理。買えるものは下に、</tspan><tspan x="40" dy="25">作るものは上に積み上がる。</tspan></text>
</svg>
