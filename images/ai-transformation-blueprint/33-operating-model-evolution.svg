<svg xmlns="http://www.w3.org/2000/svg" width="720" height="575" viewBox="0 0 720 575">
  <!-- 第33章のスライド: 運営モデル 5 つの型。推進組織の帯(藍)は O1 で細く、O2 で最も広く、右へ行くほど細くなる。事業部・製品組織の帯(千歳緑)はその逆 -->
  <rect width="720" height="575" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">運営モデルの進化 ── 推進組織の役割は縮んでいく</text>

  <!-- 推進組織の帯(上) と 事業部の帯(下) -->
  <!-- 帯の境界: O1 で細く、O2 で最も広く、右へ縮む -->
  <path d="M40 120 H680 V158 C 600 164, 480 190, 360 240 C 290 270, 250 300, 220 300 C 180 300, 110 190, 40 150 Z" fill="{{color.ai.700}}"/>
  <path d="M40 150 C 110 190, 180 300, 220 300 C 250 300, 290 270, 360 240 C 480 190, 600 164, 680 158 V340 H40 Z" fill="{{color.growth.600}}"/>
  <text x="236" y="200" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}">推進組織</text>
  <text x="470" y="290" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}">事業部・製品組織</text>

  <!-- 5 つの型 -->
  <g font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">
    <path d="M40 364 h 640" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="364" r="12" fill="{{color.ai.800}}"/>
    <text x="52" y="408"><tspan x="52" dy="0">O1</tspan><tspan x="52" dy="30">SaaS</tspan><tspan x="52" dy="30">利用</tspan></text>
    <circle cx="220" cy="364" r="12" fill="{{color.ai.800}}"/>
    <text x="196" y="408"><tspan x="196" dy="0">O2</tspan><tspan x="196" dy="30">集中</tspan></text>
    <circle cx="360" cy="364" r="12" fill="{{color.ai.800}}"/>
    <text x="304" y="408"><tspan x="304" dy="0">O3</tspan><tspan x="304" dy="30">ハブ&amp;</tspan><tspan x="304" dy="30">スポーク</tspan></text>
    <circle cx="500" cy="364" r="12" fill="{{color.ai.800}}"/>
    <text x="476" y="408"><tspan x="476" dy="0">O4</tspan><tspan x="476" dy="30">分散</tspan></text>
    <circle cx="640" cy="364" r="12" fill="{{color.ai.800}}"/>
    <text x="592" y="408"><tspan x="592" dy="0">O5</tspan><tspan x="592" dy="30">製品</tspan><tspan x="592" dy="30">組織</tspan></text>
  </g>

  <text x="40" y="526" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40" >推進組織の役割は、全部から基盤と統治へ、標準と監査へと縮む。</tspan><tspan x="40" dy="25">後戻りもある。</tspan></text>
</svg>
