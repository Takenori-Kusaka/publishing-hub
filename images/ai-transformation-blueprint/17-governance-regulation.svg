<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <!-- 第17章のスライド: 左に外の規則(法令・指針・標準の3層)、右に中の統治(ID・権限・承認の3つの道具)。承認だけ丹(人が判定する場所) -->
  <rect width="720" height="600" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">外の規則は3層、中の統治は3つの道具</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">任意か義務かにかかわらず、中の統治は企業が自ら整える(2026年10月)</text>

  <g font-family="{{font.heading}}">
    <!-- 左列 外の規則 -->
    <text x="40" y="126" font-weight="700" font-size="24" fill="{{color.ink.900}}">外の規則</text>
    <rect x="40" y="140" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.300}}" stroke-width="3"/>
    <text x="60" y="178" font-weight="700" font-size="24" fill="{{color.ink.900}}">法令</text>
    <text x="60" y="206" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">EU AI Act(高リスクは延期)</text>
    <text x="60" y="232" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">日本のAI推進法(罰則なし)</text>

    <rect x="40" y="266" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.300}}" stroke-width="3"/>
    <text x="60" y="304" font-weight="700" font-size="24" fill="{{color.ink.900}}">指針</text>
    <text x="60" y="332" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">AI事業者ガイドライン 1.2版</text>
    <text x="60" y="358" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">適正性確保の指針(自主的)</text>

    <rect x="40" y="392" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.300}}" stroke-width="3"/>
    <text x="60" y="430" font-weight="700" font-size="24" fill="{{color.ink.900}}">標準</text>
    <text x="60" y="458" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">ISO/IEC 42001</text>
    <text x="60" y="484" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">NIST AI RMF</text>

    <!-- 矢印 -->
    <path d="M348 320 h 24" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>

    <!-- 右列 中の統治 -->
    <text x="380" y="126" font-weight="700" font-size="24" fill="{{color.ink.900}}">中の統治</text>
    <rect x="380" y="140" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="400" y="178" font-weight="700" font-size="24" fill="{{color.ai.900}}">ID</text>
    <text x="400" y="206" font-size="18" fill="{{color.ai.700}}" data-tier="secondary">人とは別の身分を与える</text>
    <text x="400" y="232" font-size="18" fill="{{color.ai.700}}" data-tier="secondary">Entra Agent ID、Okta</text>

    <rect x="380" y="266" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="400" y="304" font-weight="700" font-size="24" fill="{{color.ai.900}}">権限</text>
    <text x="400" y="332" font-size="18" fill="{{color.ai.700}}" data-tier="secondary">読む範囲と実行の範囲を分ける</text>
    <text x="400" y="358" font-size="18" fill="{{color.ai.700}}" data-tier="secondary">段階的な許可</text>

    <rect x="380" y="392" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.human.100}}"/>
    <circle cx="416" cy="430" r="12" fill="{{color.human.500}}"/>
    <text x="440" y="440" font-weight="700" font-size="24" fill="{{color.human.700}}">承認</text>
    <text x="400" y="470" font-size="18" fill="{{color.human.600}}" data-tier="secondary">戻せない操作の前に人が止める</text>
    <text x="400" y="496" font-size="18" fill="{{color.human.600}}" data-tier="secondary">送信・支払い・削除・署名</text>
  </g>

  <rect x="40" y="520" width="640" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
  <text x="60" y="556" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">統制を整備済みの企業は 5%(BCG、2026年10月)</text>
</svg>
