<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <!-- 第19章のスライド: 評価の成熟度 V0〜V4 の階段。判断の根拠が印象から記録へ移る。丹=人が判定する段(V0〜V1)、藍=機械が加わる段(V2〜V3)、千歳緑=到達(V4)。同じ区分は同じ濃さ。注記は括弧で段にまたがらせる -->
  <rect width="720" height="640" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">評価の成熟度は、根拠が記録へ移る階段</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <rect x="40" y="440" width="124" height="90" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="56" y="474" fill="{{color.ink.900}}">V0</text>
    <text x="56" y="506" fill="{{color.ink.900}}">目視</text>

    <rect x="169" y="370" width="124" height="160" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="185" y="404" fill="{{color.ink.900}}">V1</text>
    <text x="185" y="436" fill="{{color.ink.900}}">固定</text>
    <text x="185" y="466" fill="{{color.ink.900}}">セット</text>

    <rect x="298" y="300" width="124" height="230" rx="{{figure.radius.box}}" fill="{{color.ai.700}}"/>
    <text x="314" y="334" fill="{{color.text.inverse}}">V2</text>
    <text x="314" y="366" fill="{{color.text.inverse}}">自動</text>
    <text x="314" y="396" fill="{{color.text.inverse}}">評価</text>

    <rect x="427" y="230" width="124" height="300" rx="{{figure.radius.box}}" fill="{{color.ai.700}}"/>
    <text x="443" y="264" fill="{{color.text.inverse}}">V3</text>
    <text x="443" y="296" fill="{{color.text.inverse}}">本番</text>
    <text x="443" y="326" fill="{{color.text.inverse}}">評価</text>

    <rect x="556" y="160" width="124" height="370" rx="{{figure.radius.box}}" fill="{{color.growth.700}}"/>
    <text x="572" y="194" fill="{{color.text.inverse}}">V4</text>
    <text x="572" y="226" fill="{{color.text.inverse}}">評価</text>
    <text x="572" y="256" fill="{{color.text.inverse}}">駆動</text>

    <text x="40" y="340" fill="{{color.human.800}}">V0〜V1：人が判定</text>
    <path d="M40 360 V350 H293 V360" fill="none" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="298" y="170" fill="{{color.ai.800}}">V2〜V3：</text>
    <text x="298" y="200" fill="{{color.ai.800}}">機械が加わる</text>
    <path d="M298 220 V210 H551 V220" fill="none" stroke="{{color.ai.700}}" stroke-width="3"/>
  </g>

  <text x="40" y="574" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.900}}"><tspan x="40">判断の根拠が、印象から記録へ移る。</tspan><tspan x="40" dy="32">丹は人が判定する段、藍は機械の評価が加わる段。</tspan></text>
</svg>
