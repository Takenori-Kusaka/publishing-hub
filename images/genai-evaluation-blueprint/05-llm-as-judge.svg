<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530">
  <!-- 第5章のスライド: 中央に審判モデル、左に人との一致(2023)、右に見つかった偏り、下に 2025 年の格下げ。1 主張「審判は人の代役になり、偏りも見つかった」 -->
  <rect width="720" height="530" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">審判は人の代役になり、偏りも見つかった</text>
  <text x="40" y="84" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">言語モデルが別のモデルの出力を採点する(2023〜2025 年)</text>

  <!-- 左: 人との一致(丹) -->
  <rect x="40" y="120" width="190" height="230" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
  <text x="135" y="166" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.human.800}}">人との一致</text>
  <text x="135" y="226" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="36" fill="{{color.ink.900}}">85%</text>
  <text x="135" y="270" text-anchor="middle" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary"><tspan x="135">同点を除く比較</tspan><tspan x="135" dy="24">人どうしは 81%</tspan><tspan x="135" dy="24">2023 年 6 月</tspan></text>

  <path d="M236 235 H262" stroke="{{color.ink.500}}" stroke-width="3"/>
  <path d="M270 235 l-12 -8 v16 z" fill="{{color.ink.500}}"/>

  <!-- 中央: 審判モデル -->
  <rect x="276" y="160" width="160" height="150" rx="{{figure.radius.box}}" fill="{{color.ai.200}}" stroke="{{color.ai.800}}" stroke-width="3"/>
  <text x="356" y="230" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ai.900}}"><tspan x="356">審判</tspan><tspan x="356" dy="32">モデル</tspan></text>

  <path d="M442 235 H468" stroke="{{color.ink.500}}" stroke-width="3"/>
  <path d="M476 235 l-12 -8 v16 z" fill="{{color.ink.500}}"/>

  <!-- 右: 見つかった偏り -->
  <rect x="482" y="120" width="198" height="230" rx="{{figure.radius.box}}" fill="none" stroke="{{color.ink.500}}" stroke-width="3"/>
  <text x="581" y="166" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">見つかった偏り</text>
  <text x="506" y="212" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">位置</text>
  <text x="506" y="248" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">冗長さ</text>
  <text x="506" y="284" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">自己選好</text>
  <text x="506" y="320" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.800}}">選好の漏洩</text>

  <!-- 下: 2025 年の格下げ -->
  <rect x="40" y="378" width="640" height="70" rx="{{figure.radius.box}}" fill="{{color.ink.100}}" stroke="{{color.ink.500}}" stroke-width="2"/>
  <text x="360" y="422" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">2025 年、Trial から Assess へ下がった</text>

  <text x="40" y="482" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">Thoughtworks Technology Radar(2024 年 10 月版と 2025 年 11 月版)。</tspan><tspan x="40" dy="26">「かつて信じられていたほど成熟していない」。</tspan></text>
</svg>
