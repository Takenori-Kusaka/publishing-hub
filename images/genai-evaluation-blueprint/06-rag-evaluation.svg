<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 第6章のスライド: RAG の失敗の7類型(Barnett ら 2024)を入力側3つ・生成側4つの2列に分ける -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">RAGの失敗は、入力側3つと生成側4つ</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">Seven Failure Points(2024年1月)の7類型を本書の2層に対応させた</text>

  <g font-family="{{font.heading}}">
    <text x="40" y="132" font-weight="700" font-size="24" fill="{{color.ai.800}}">入力側：情報が揃わない</text>
    <text x="370" y="132" font-weight="700" font-size="24" fill="{{color.ai.900}}">生成側：回答がずれる</text>

    <rect x="40" y="150" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="194" font-weight="700" font-size="24" fill="{{color.ai.900}}">FP1 内容が無い</text>
    <rect x="40" y="232" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="276" font-weight="700" font-size="24" fill="{{color.ai.900}}">FP2 上位に入らない</text>
    <rect x="40" y="314" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="358" font-weight="700" font-size="24" fill="{{color.ai.900}}">FP3 文脈に入らない</text>

    <rect x="370" y="150" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="394" y="194" font-weight="700" font-size="24" fill="{{color.ai.950}}">FP4 抽出できない</text>
    <rect x="370" y="232" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="394" y="276" font-weight="700" font-size="24" fill="{{color.ai.950}}">FP5 形式が違う</text>
    <rect x="370" y="314" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="394" y="358" font-weight="700" font-size="24" fill="{{color.ai.950}}">FP6 具体性が合わない</text>
    <rect x="370" y="396" width="310" height="70" rx="{{figure.radius.box}}" fill="{{color.ai.300}}"/>
    <text x="394" y="440" font-weight="700" font-size="24" fill="{{color.ai.950}}">FP7 不完全</text>
  </g>
  <text x="40" y="508" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">2つの列を分けて測る問いが「文脈は十分か」。</tspan><tspan x="40" dy="25">検証は運用中にしかできない、と論文は結論した。</tspan></text>
</svg>
