<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630">
  <!-- 第13章のスライド: 任意の枠組み→認証の規格→法的義務の3本の柱。拘束力は色の濃淡でなく上の矢印のラベルで示す(3本とも墨の枠)。下の帯=出力の指標はどの文書も組織に委ねる -->
  <rect width="760" height="630" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">求められるのは、測る仕組みと記録</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">規格・枠組み・法令が評価について求めること(2023〜2026年)</text>

  <text x="40" y="124" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.800}}">拘束力 弱い</text>
  <text x="720" y="124" text-anchor="end" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.800}}">強い</text>
  <line x1="190" y1="116" x2="652" y2="116" stroke="{{color.ink.500}}" stroke-width="2"/>
  <polygon points="664,116 652,110 652,122" fill="{{color.ink.500}}"/>

  <g font-family="{{font.heading}}">
    <!-- 任意 -->
    <rect x="40" y="144" width="216" height="320" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.700}}" stroke-width="2"/>
    <text x="56" y="186" font-weight="700" font-size="24" fill="{{color.ink.900}}">任意の枠組み</text>
    <text font-size="24" fill="{{color.ink.800}}"><tspan x="56" y="222">NIST AI RMF</tspan><tspan x="56" dy="30">日本の指針</tspan></text>
    <text font-size="24" fill="{{color.ink.900}}"><tspan x="56" y="344">本番に近い</tspan><tspan x="56" dy="30">条件で測る。</tspan><tspan x="56" dy="30">作業記録を</tspan><tspan x="56" dy="30">残す</tspan></text>

    <!-- 認証 -->
    <rect x="272" y="144" width="216" height="320" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.700}}" stroke-width="2"/>
    <text x="282" y="186" font-weight="700" font-size="24" fill="{{color.ink.900}}">認証の規格</text>
    <text font-size="24" fill="{{color.ink.800}}"><tspan x="282" y="222">ISO/IEC 42001</tspan></text>
    <text font-size="24" fill="{{color.ink.900}}"><tspan x="282" y="344">監視・測定と</tspan><tspan x="282" dy="30">内部監査の</tspan><tspan x="282" dy="30">仕組みを持つ</tspan></text>

    <!-- 法的義務 -->
    <rect x="504" y="144" width="216" height="320" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.700}}" stroke-width="2"/>
    <text x="520" y="186" font-weight="700" font-size="24" fill="{{color.ink.900}}">法的義務</text>
    <text font-size="24" fill="{{color.ink.800}}"><tspan x="520" y="222">EU AI法</tspan></text>
    <text font-size="24" font-weight="700" fill="{{color.ink.900}}"><tspan x="520" y="274">高リスク：</tspan></text>
    <text font-size="24" fill="{{color.ink.900}}"><tspan x="520" y="304">しきい値で</tspan><tspan x="520" dy="30">試験する</tspan></text>
    <text font-size="24" font-weight="700" fill="{{color.ink.900}}"><tspan x="520" y="380">GPAI：</tspan></text>
    <text font-size="24" fill="{{color.ink.900}}"><tspan x="520" y="410">評価の結果を</tspan><tspan x="520" dy="30">文書にする</tspan></text>

    <!-- 共通の帯 -->
    <rect x="40" y="482" width="680" height="70" rx="{{figure.radius.box}}" fill="{{color.paper.300}}" stroke="{{color.ink.300}}" stroke-width="2"/>
    <text x="380" y="526" text-anchor="middle" font-weight="700" font-size="24" fill="{{color.ink.900}}">出力の指標そのものは、組織に委ねる</text>
  </g>
  <text x="40" y="594" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">認証や適合は仕組みの確認であり、出力が正しいことの保証ではない。</text>
</svg>
