<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <!-- 第20章のスライド: 本編の導入段階 S1〜S6 と、各段階で要る評価の成熟度 V0〜V4 -->
  <rect width="720" height="500" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">導入の段階を上げる前に、評価を上げる</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <rect x="40" y="88" width="150" height="64" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="129" text-anchor="middle" fill="{{color.ink.900}}">S1〜S2</text>
    <rect x="206" y="88" width="474" height="64" rx="{{figure.radius.box}}" fill="{{color.human.100}}"/>
    <text x="230" y="129" fill="{{color.ink.900}}">V0目視</text>

    <rect x="40" y="164" width="150" height="64" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="205" text-anchor="middle" fill="{{color.ink.900}}">S3</text>
    <rect x="236" y="164" width="444" height="64" rx="{{figure.radius.box}}" fill="{{color.human.200}}"/>
    <text x="260" y="205" fill="{{color.ink.900}}">V1固定セット</text>

    <rect x="40" y="240" width="150" height="64" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="281" text-anchor="middle" fill="{{color.ink.900}}">S4</text>
    <rect x="266" y="240" width="414" height="64" rx="{{figure.radius.box}}" fill="{{color.ai.600}}"/>
    <text x="290" y="281" fill="{{color.text.inverse}}">V2〜V3 自動・本番評価</text>

    <rect x="40" y="316" width="150" height="64" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="357" text-anchor="middle" fill="{{color.ink.900}}">S5〜S6</text>
    <rect x="296" y="316" width="384" height="64" rx="{{figure.radius.box}}" fill="{{color.growth.700}}"/>
    <text x="320" y="357" fill="{{color.text.inverse}}">V3〜V4評価駆動</text>
  </g>

  <text x="40" y="436" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">左は本編の導入段階、右は要る評価の成熟度。</tspan><tspan x="40" dy="25">下の段ほど、誤りが及ぶ範囲が広い。</tspan></text>
</svg>
