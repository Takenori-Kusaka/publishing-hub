<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 第20章のスライド: 本編の導入段階 S1〜S6 と、各段階で要る評価の成熟度 V0〜V4(第1節の表と同じ対応)。V0〜V1は丹、V2〜V3は藍、V4を含む段は千歳緑で、第19章の図と同じ規則。同じ区分は同じ濃さ -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">導入の段階を上げる前に、評価の成熟度を上げる</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <rect x="40" y="84" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="121" text-anchor="middle" fill="{{color.ink.900}}">S1</text>
    <rect x="206" y="84" width="474" height="56" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="230" y="121" fill="{{color.ink.900}}">V0目視</text>

    <rect x="40" y="150" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="187" text-anchor="middle" fill="{{color.ink.900}}">S2</text>
    <rect x="206" y="150" width="474" height="56" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="230" y="187" fill="{{color.ink.900}}">V0〜V1 目視・固定セット</text>

    <rect x="40" y="216" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="253" text-anchor="middle" fill="{{color.ink.900}}">S3</text>
    <rect x="236" y="216" width="444" height="56" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
    <text x="260" y="253" fill="{{color.ink.900}}">V1固定セット</text>

    <rect x="40" y="282" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="319" text-anchor="middle" fill="{{color.ink.900}}">S4</text>
    <rect x="266" y="282" width="414" height="56" rx="{{figure.radius.box}}" fill="{{color.ai.700}}"/>
    <text x="290" y="319" fill="{{color.text.inverse}}">V2〜V3 自動・本番評価</text>

    <rect x="40" y="348" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="385" text-anchor="middle" fill="{{color.ink.900}}">S5</text>
    <rect x="296" y="348" width="384" height="56" rx="{{figure.radius.box}}" fill="{{color.growth.700}}"/>
    <text x="320" y="385" fill="{{color.text.inverse}}">V3〜V4 本番・評価駆動</text>

    <rect x="40" y="414" width="150" height="56" rx="{{figure.radius.box}}" fill="{{color.paper.300}}"/>
    <text x="115" y="451" text-anchor="middle" fill="{{color.ink.900}}">S6</text>
    <rect x="326" y="414" width="354" height="56" rx="{{figure.radius.box}}" fill="{{color.growth.700}}"/>
    <text x="350" y="451" fill="{{color.text.inverse}}">V4評価駆動</text>
  </g>

  <text x="40" y="502" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">左は本編の導入段階、右は要る評価の成熟度。</text>
  <text x="40" y="536" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.900}}">下の段ほど、誤りが及ぶ範囲が広い。</text>
</svg>
