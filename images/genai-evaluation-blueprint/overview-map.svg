<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <!-- 第0章のスライド: 左の砂時計(系譜・現在地・3つの道筋)で時間を読み、右の物差し(2層10項目と V0〜V4)で自社を測る -->
  <rect width="720" height="560" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">砂時計で時間を読み、物差しで自社を測る</text>

  <!-- 左: 砂時計 -->
  <rect x="40" y="96" width="290" height="110" rx="{{figure.radius.box}}" fill="{{color.ink.100}}" stroke="{{color.ink.600}}" stroke-width="3"/>
  <text x="185" y="140" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}"><tspan x="185" dy="0">過去：系譜</tspan><tspan x="185" dy="36">第1〜10章</tspan></text>

  <rect x="105" y="226" width="160" height="110" rx="{{figure.radius.box}}" fill="{{color.ink.100}}" stroke="{{color.ink.600}}" stroke-width="3"/>
  <text x="185" y="270" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}"><tspan x="185" dy="0">現在地</tspan><tspan x="185" dy="36">第11〜15章</tspan></text>

  <rect x="40" y="356" width="290" height="110" rx="{{figure.radius.box}}" fill="{{color.ink.100}}" stroke="{{color.ink.600}}" stroke-width="3"/>
  <text x="185" y="400" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}"><tspan x="185" dy="0">未来：3つの道筋</tspan><tspan x="185" dy="36">第21〜22章</tspan></text>

  <!-- くびれから物差しへ -->
  <path d="M265 281 L380 281" stroke="{{color.ink.500}}" stroke-width="3" stroke-dasharray="8 6" fill="none"/>

  <!-- 右: 物差し(第Ⅲ部) -->
  <rect x="380" y="96" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
  <text x="400" y="140" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}"><tspan x="400" dy="0">入力側 I1〜I5</tspan><tspan x="400" dy="36">集めた情報を測る</tspan></text>

  <rect x="380" y="226" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
  <text x="400" y="270" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}"><tspan x="400" dy="0">生成側 G1〜G5</tspan><tspan x="400" dy="36">出力を測る</tspan></text>

  <rect x="380" y="356" width="300" height="110" rx="{{figure.radius.box}}" fill="{{color.growth.600}}"/>
  <text x="400" y="400" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.text.inverse}}"><tspan x="400" dy="0">成熟度 V0→V4</tspan><tspan x="400" dy="36">第23章で1つ上げる</tspan></text>

  <!-- 添え書き -->
  <text x="40" y="510" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">左は社会の評価の時間軸で、外部環境。自社が動かせるのは右の</tspan><tspan x="40" dy="26">物差し(第16〜20章)だけ。</tspan></text>
</svg>
