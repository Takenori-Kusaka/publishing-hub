<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <!-- 第2章のスライド: 人の判定の費用 → 代役の自動指標 → 3 つの批判を左から右へ。1 主張「参照との一致は、人の判定の代役として生まれた」 -->
  <rect width="720" height="520" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">参照との一致は、人の判定の代役として生まれた</text>
  <text x="40" y="84" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">人が書いた正解の文と、語の並びがどれだけ重なるか(2002〜2021 年)</text>

  <!-- 左: 人の判定 -->
  <rect x="40" y="120" width="170" height="300" rx="{{figure.radius.box}}" fill="{{color.human.100}}" stroke="{{color.human.600}}" stroke-width="3"/>
  <text x="125" y="168" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.human.800}}">人の判定</text>
  <text x="125" y="240" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">数か月</text>
  <text x="125" y="268" text-anchor="middle" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">翻訳(2002 年)</text>
  <text x="125" y="336" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">3,000時間超</text>
  <text x="125" y="364" text-anchor="middle" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">要約(2004 年)</text>

  <path d="M216 270 H244" stroke="{{color.ink.500}}" stroke-width="3"/>
  <path d="M244 270 l-12 -8 v16 z" fill="{{color.ink.500}}"/>

  <!-- 中央: 代役 -->
  <rect x="250" y="120" width="150" height="300" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="3"/>
  <text x="325" y="168" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ai.900}}">代役</text>
  <text x="325" y="250" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="28" fill="{{color.ai.800}}">BLEU</text>
  <text x="325" y="278" text-anchor="middle" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">2002 年</text>
  <text x="325" y="336" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="28" fill="{{color.ai.800}}">ROUGE</text>
  <text x="325" y="364" text-anchor="middle" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">2004 年</text>

  <path d="M406 270 H434" stroke="{{color.ink.500}}" stroke-width="3"/>
  <path d="M434 270 l-12 -8 v16 z" fill="{{color.ink.500}}"/>

  <!-- 右: 批判 -->
  <rect x="440" y="120" width="240" height="300" rx="{{figure.radius.box}}" fill="none" stroke="{{color.ink.500}}" stroke-width="3"/>
  <text x="560" y="168" text-anchor="middle" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">批判</text>
  <text x="464" y="222" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">2006 年</text>
  <text x="464" y="250" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">十分条件でない</text>
  <text x="464" y="290" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">2018 年</text>
  <text x="464" y="318" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">翻訳の外は不可</text>
  <text x="464" y="358" font-family="{{font.body}}" font-size="18" fill="{{color.ink.700}}" data-tier="secondary">2021 年</text>
  <text x="464" y="386" font-family="{{font.heading}}" font-weight="700" font-size="24" fill="{{color.ink.900}}">判断を誤らせた</text>

  <text x="40" y="464" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">2018 年の検討: 34 本の論文の 284 の相関。支持は機械翻訳の診断だけ。</tspan><tspan x="40" dy="26">2021 年の検証: 4,380 システム、230 万件の人手評価。</tspan></text>
</svg>
