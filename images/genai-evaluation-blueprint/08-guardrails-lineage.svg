<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <!-- 第8章のスライド: 上段はモデル自体の2つの率(見逃しの側と過剰拒否の側)、下段は外付けの分類器で見逃しを減らしたときの費用 -->
  <rect width="720" height="600" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">見逃しと過剰拒否を、同時に測る</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">上段はOpus 4のsystem card(2025年5月)。モデル自体の2つの率</text>

  <g font-family="{{font.heading}}">
    <rect x="40" y="110" width="250" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="152" font-weight="700" font-size="24" fill="{{color.ai.900}}">違反する要求</text>
    <text x="64" y="186" font-size="24" fill="{{color.ai.800}}">見逃しを測る側</text>
    <text x="64" y="248" font-weight="700" font-size="30" fill="{{color.ai.900}}">98.43%</text>
    <text x="64" y="290" font-size="24" fill="{{color.ai.900}}">無害に応答した率</text>

    <rect x="310" y="110" width="100" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="360" y="200" text-anchor="middle" font-weight="700" font-size="24" fill="{{color.paper.100}}"><tspan x="360">モデル</tspan><tspan x="360" dy="32">自体</tspan></text>

    <rect x="430" y="110" width="250" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="454" y="152" font-weight="700" font-size="24" fill="{{color.ai.900}}">安全な要求</text>
    <text x="454" y="186" font-size="24" fill="{{color.ai.800}}">過剰拒否を測る側</text>
    <text x="454" y="248" font-weight="700" font-size="30" fill="{{color.ai.900}}">0.07%</text>
    <text x="454" y="290" font-size="24" fill="{{color.ai.900}}">誤って断った率</text>

    <rect x="40" y="344" width="640" height="150" rx="{{figure.radius.box}}" fill="{{color.ink.100}}"/>
    <text x="64" y="386" font-weight="700" font-size="24" fill="{{color.ink.900}}">外付けの分類器で見逃しを減らすと</text>
    <text x="64" y="424" font-weight="700" font-size="24" fill="{{color.ink.900}}">脱獄の成功率 86% → 4.4% の代わりに</text>
    <text x="64" y="462" font-weight="700" font-size="24" fill="{{color.ink.900}}">拒否率 +0.38ポイント、計算の費用 +23.7%</text>
  </g>
  <text x="40" y="534" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">下の帯はConstitutional Classifiers(2025年2月)。</tspan><tspan x="40" dy="25">片方だけの数値では、この交換が見えない。</tspan></text>
</svg>
