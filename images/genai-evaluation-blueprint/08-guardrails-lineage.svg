<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <!-- 第8章のスライド: ガードレールの評価は見逃しと過剰拒否の2つの向きを同時に測り、その交換に費用がかかる -->
  <rect width="720" height="540" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">見逃しと過剰拒否を、同時に測る</text>
  <text x="40" y="82" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary">Claude Opus 4のsystem card(2025年5月)が並べて報告した2つの率</text>

  <g font-family="{{font.heading}}">
    <rect x="40" y="110" width="250" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="64" y="152" font-weight="700" font-size="24" fill="{{color.ai.900}}">見逃し</text>
    <text x="64" y="184" font-size="18" fill="{{color.ai.800}}" data-tier="secondary">危険な要求を通す誤り</text>
    <text x="64" y="252" font-weight="700" font-size="30" fill="{{color.ai.900}}">98.43%超</text>
    <text x="64" y="290" font-size="18" fill="{{color.ai.800}}" data-tier="secondary">違反する要求を断った割合</text>

    <rect x="310" y="110" width="100" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
    <text x="360" y="200" text-anchor="middle" font-weight="700" font-size="24" fill="{{color.paper.100}}"><tspan x="360">ガード</tspan><tspan x="360" dy="32">レール</tspan></text>

    <rect x="430" y="110" width="250" height="210" rx="{{figure.radius.box}}" fill="{{color.ai.100}}"/>
    <text x="454" y="152" font-weight="700" font-size="24" fill="{{color.ai.900}}">過剰拒否</text>
    <text x="454" y="184" font-size="18" fill="{{color.ai.800}}" data-tier="secondary">安全な要求を断る誤り</text>
    <text x="454" y="252" font-weight="700" font-size="30" fill="{{color.ai.900}}">0.07%</text>
    <text x="454" y="290" font-size="18" fill="{{color.ai.800}}" data-tier="secondary">良性の要求を断った割合</text>

    <rect x="40" y="344" width="640" height="104" rx="{{figure.radius.box}}" fill="{{color.ink.100}}"/>
    <text x="64" y="386" font-weight="700" font-size="24" fill="{{color.ink.900}}">脱獄の成功率 86% → 4.4% の代わりに</text>
    <text x="64" y="424" font-weight="700" font-size="24" fill="{{color.ink.900}}">拒否率 +0.38%、計算の費用 +23.7%</text>
  </g>
  <text x="40" y="482" font-family="{{font.body}}" font-size="18" fill="{{color.ink.600}}" data-tier="secondary"><tspan x="40">下の帯はConstitutional Classifiers(2025年2月)。</tspan><tspan x="40" dy="25">片方だけの数値では、この交換が見えない。</tspan></text>
</svg>
