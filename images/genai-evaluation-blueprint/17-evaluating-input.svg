<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610">
  <!-- 第17章のスライド: 入力側の5項目を上から下へ関門として並べ、通った情報だけが生成へ渡る。関門の順は位置で示し、色の濃淡は使わない -->
  <rect width="720" height="610" fill="{{color.paper.100}}"/>
  <text x="40" y="52" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ai.800}}">集めた情報を5つの問いで確かめる</text>

  <g font-family="{{font.heading}}" font-weight="700" font-size="24">
    <rect x="40" y="84" width="640" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="2"/>
    <text x="64" y="123" fill="{{color.ink.900}}">I1必要：足りないものを知る</text>
    <rect x="60" y="156" width="600" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="2"/>
    <text x="84" y="195" fill="{{color.ink.900}}">I2十分：必要な情報がそろう</text>
    <rect x="80" y="228" width="560" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="2"/>
    <text x="104" y="267" fill="{{color.ink.900}}">I3精度：雑音が少ない</text>
    <rect x="100" y="300" width="520" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="2"/>
    <text x="124" y="339" fill="{{color.ink.900}}">I4鮮度：古くない</text>
    <rect x="120" y="372" width="480" height="60" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="2"/>
    <text x="144" y="411" fill="{{color.ink.900}}">I5出所：信頼でき、読んでよい</text>

    <path d="M360 442 v 30" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round"/>
    <path d="M348 466 l 12 14 l 12 -14" fill="none" stroke="{{color.ink.300}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="220" y="490" width="280" height="60" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.700}}" stroke-width="3"/>
    <text x="360" y="529" text-anchor="middle" fill="{{color.ink.900}}">生成側へ渡す</text>
  </g>

  <text x="40" y="590" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.900}}">5つを通った情報だけが生成へ渡る。</text>
</svg>
