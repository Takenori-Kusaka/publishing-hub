<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 『AIトランスフォーメーションの設計図』のカード。1 主張「使われているが、損益に効いていない」を IPA の 2 つの数で示す。1.91:1(LinkedIn)。主ラベルは 38px 以上。data-tier="secondary" は補助ラベルで、同じ情報を投稿の本文に書く -->
  <rect width="1200" height="630" fill="{{color.paper.100}}"/>
  <text x="60" y="84" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.600}}" data-tier="secondary">AIを導入した企業の効果 ── IPA「DX動向2026」(回収 1,799 社)</text>
  <text x="58" y="156" font-family="{{font.heading}}" font-weight="700" font-size="54" fill="{{color.ai.800}}">使われている。でも、損益に効いていない。</text>
  <rect x="60" y="212" width="520" height="230" rx="{{figure.radius.box}}" fill="{{color.ai.800}}"/>
  <text x="320" y="330" font-family="{{font.heading}}" font-weight="700" font-size="88" fill="{{color.paper.100}}" text-anchor="middle">91.6%</text>
  <text x="320" y="396" font-family="{{font.heading}}" font-size="38" fill="{{color.ai.100}}" text-anchor="middle">業務が効率化・迅速化した</text>
  <rect x="620" y="212" width="520" height="230" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.300}}" stroke-width="4"/>
  <text x="880" y="330" font-family="{{font.heading}}" font-weight="700" font-size="88" fill="{{color.ink.900}}" text-anchor="middle">3.9%</text>
  <text x="880" y="396" font-family="{{font.heading}}" font-size="38" fill="{{color.ink.700}}" text-anchor="middle">売上や利益が向上した</text>
  <text x="60" y="520" font-family="{{font.heading}}" font-weight="700" font-size="38" fill="{{color.ink.900}}">この段差を、どの段階で、何から埋めるか。</text>
  <text x="60" y="574" font-family="{{font.heading}}" font-size="26" fill="{{color.ink.600}}" data-tier="secondary">生成AIの系譜・現在地・3つの道筋・導入フェーズ ── 第0〜38章と付録、出典 608 件</text>
  <text x="1140" y="600" font-family="{{font.code}}" font-size="18" fill="{{color.ink.500}}" text-anchor="end" data-tier="secondary">ai-transformation-blueprint</text>
</svg>
