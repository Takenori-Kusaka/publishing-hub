<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 費用の内訳を 2 つの箱で示す。顧客の処理は 0 ドル、最大の費目は費用を測る費用。 1:1(Bluesky の画像)。主ラベルは 34px 以上。data-tier="secondary" は補助ラベルで、同じ情報を投稿の本文に書いている。 -->
  <rect width="1080" height="1080" fill="{{color.paper.100}}"/>
  <text x="70" y="112" font-family="{{font.heading}}" font-size="28" fill="{{color.ink.600}}" data-tier="secondary">家庭向けアプリの AWS 費用 ― 3 か月の実測</text>
  <text x="68" y="196" font-family="{{font.heading}}" font-weight="700" font-size="60" fill="{{color.ai.800}}">AWS は、月 1〜3 ドル</text>
  <rect x="70" y="290" width="940" height="220" rx="{{figure.radius.box}}" fill="{{color.ai.800}}" />
  <text x="110" y="376" font-family="{{font.heading}}" font-weight="700" font-size="40" fill="{{color.paper.100}}">顧客のリクエストの処理</text>
  <text x="110" y="462" font-family="{{font.heading}}" font-weight="700" font-size="78" fill="{{color.paper.100}}">0 ドル</text>
  <text x="970" y="456" font-family="{{font.heading}}" font-size="24" fill="{{color.ai.200}}" text-anchor="end" data-tier="secondary">Lambda・Cognito・Aurora DSQL は無料枠</text>
  <rect x="70" y="550" width="940" height="220" rx="{{figure.radius.box}}" fill="{{color.ai.100}}" stroke="{{color.ai.800}}" stroke-width="5"/>
  <text x="110" y="636" font-family="{{font.heading}}" font-weight="700" font-size="40" fill="{{color.ink.900}}">最大の費目は</text>
  <text x="110" y="722" font-family="{{font.heading}}" font-weight="700" font-size="70" fill="{{color.ai.800}}">費用を測る費用</text>
  <text x="70" y="822" font-family="{{font.heading}}" font-size="26" fill="{{color.ink.600}}" data-tier="secondary">Cost Explorer の照会は 1 回 0.01 ドル。3 か月のうち 2 か月で最大</text>
  <text x="70" y="938" font-family="{{font.heading}}" font-weight="700" font-size="30" fill="{{color.ink.900}}" data-tier="secondary">費用は、見積もりではなく実測を貼る。</text>
  <text x="1010" y="1040" font-family="{{font.code}}" font-size="20" fill="{{color.ink.500}}" text-anchor="end" data-tier="secondary">ganbari-quest / design notes</text>
</svg>
