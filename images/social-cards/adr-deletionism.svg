<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 設計判断の記録。書いた本数と削除した本数を、同じ尺の棒で比べる。削除した側は中を抜いた点線の棒にして「もう無い」を形で示す。 1.91:1(LinkedIn の記事カード)。主ラベルは 38px 以上。data-tier="secondary" は補助ラベルで、同じ情報を投稿の本文に書いている。 -->
  <rect width="1200" height="630" fill="{{color.paper.100}}"/>
  <text x="60" y="84" font-family="{{font.heading}}" font-size="24" fill="{{color.ink.600}}" data-tier="secondary">生成AIと設計判断の記録 ― 7 か月の実測</text>
  <text x="58" y="156" font-family="{{font.heading}}" font-weight="700" font-size="54" fill="{{color.ai.800}}">役目を終えた記録は、削除する</text>
  <text x="60" y="280" font-family="{{font.heading}}" font-weight="700" font-size="40" fill="{{color.ink.900}}">書いた</text>
  <rect x="220" y="232" width="700" height="68" rx="{{figure.radius.box}}" fill="{{color.ai.800}}" />
  <text x="944" y="284" font-family="{{font.heading}}" font-weight="700" font-size="48" fill="{{color.ai.800}}">70 本超</text>
  <text x="60" y="392" font-family="{{font.heading}}" font-weight="700" font-size="40" fill="{{color.ink.900}}">削除</text>
  <rect x="220" y="344" width="350" height="68" rx="{{figure.radius.box}}" fill="{{color.paper.100}}" stroke="{{color.ink.500}}" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="594" y="396" font-family="{{font.heading}}" font-weight="700" font-size="48" fill="{{color.ink.600}}">35 本</text>
  <text x="60" y="524" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ink.900}}" data-tier="secondary">保管庫に残した古い決定は、生成AIには現役と同じ文書に見える。</text>
  <text x="60" y="564" font-family="{{font.heading}}" font-weight="700" font-size="26" fill="{{color.ink.900}}" data-tier="secondary">削除すれば、残るのは git の履歴だけ。</text>
  <text x="1140" y="600" font-family="{{font.code}}" font-size="18" fill="{{color.ink.500}}" text-anchor="end" data-tier="secondary">ganbari-quest / design notes</text>
</svg>
