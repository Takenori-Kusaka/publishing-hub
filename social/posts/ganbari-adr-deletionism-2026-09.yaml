  text: |-
    意思決定の記録（ADR）は、生成AIが最も気前よく書く文書です。決定のたびに 1 本、数分で。「がんばりクエスト」というひとりで作っているサービスの 7 か月で 70 本を超え、そのうち 35 本を削除しました。

    当初の目標は「常時参照される ADR は 10 本まで」でした。達成できていません。25 本が 44 本に増え、37 本で落ち着いています。

    ただ、この数字を失敗と読むと正確さを欠きます。AI が安く書ける環境で総数を目標にすると、書かない圧力になるからです。

    効いたのは削除主義でした。役目を終えた記録は archive ではなく削除し、履歴は git に任せます。

    archive は「読める場所にある古い決定」で、AI はそれを読んで古い決定に従います。削除すれば読めるのは git だけで、AI は git を自発的には読みません。

    - 1 本は 150 行・7 セクションまで
    - 削除した番号は再利用しない
    - 現状の正解と経緯を分け、経緯は ADR に積まない
    - 不採用と記録した OSS には「不在の証明」を持たせ、存在したらテストで落とす

    ADR を減らすための装置を増やすのは矛盾に近い、とも思っています。増える速度と削る判断を、1 章にまとめました。
