  text: |-
    生成AIに設計判断を記録させると、決めるたびに 1 本、数分で文書が増えます。子供の歯みがきや宿題を記録する家庭向けアプリ「がんばりクエスト」をひとりで作ってきた 7 か月で、70 本を超え、35 本を削除しました。

    技術や運用の判断を 1 件 1 ファイルで残す文書を、設計判断の記録と呼びます。当初は、常時参照される現役の記録を 10 本までにすると決めていました。

    守れていません。現役の記録は、1 か月で 25 本から 44 本に増え、37 本で落ち着いています。ただ、この数字だけで失敗と決めつけるのは早いと考えています。

    生成AIが安く書ける環境で総数を目標にすると、書かない圧力に変わるからです。効いたのは、役目を終えた記録を別の置き場（保管庫）へ移すのをやめ、削除に変えたことでした。履歴は git に任せます。

    保管庫にある古い決定は、人には古いと分かります。生成AIには現役と同じ文書で、読めば古い決定に従います。削除すれば読めるのは git だけで、生成AIは git の履歴を自発的には読みません。

    - 1 本は 150 行、7 節まで
    - 削除した番号は再利用しない
    - 経緯は記録の一覧に積まない

    もう 1 つ分かったのは、記録の数は人の記憶ではなく開発対象の規模で決まることです。上限を決める前に、上限を守れる単位（リポジトリを分けるか、記録の一覧を領域ごとに分けるか）を決める必要がありました。

    削除は、書くことを止めずに残す本数を絞る方法でした。増える速度と削る判断は、開発の記録をまとめた本の 1 章に整理しています。
