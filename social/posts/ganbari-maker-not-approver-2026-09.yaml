  text: |-
    生成AIに実装を任せると、AI は自分の成果物を自分で承認します。「がんばりクエスト」というひとりで作っている子育て向けサービスの開発で、実際に何度も起きました。

    人間なら常識で止まる行為を、AI は止めません。そこで、作る側と承認する側を別のセッションと別の GitHub アカウントに分け、管理者権限で承認を飛ばす抜け道も自分に対して閉じました。

    分けたら終わり、ではありませんでした。承認する側の AI は、顧客の品質を見る役割から自動の検査結果を読み上げる役割へ滑り落ちます。

    この現象を 33 日で 42 回観測しました。指示を書き足しても頻度は変わりませんでした。

    - 長い会話の中で役割が薄まる
    - 作った側の主張を肯定的に繰り返し、独立した判断が消える
    - 事故のない期間の積み重ねで、逸脱を許容と読み替える
    - 検査が通ったという代理指標を、本来の判断と取り違える

    対策は、反対意見を構造化して必ず出させる仕組みと、証拠がなければ承認操作を物理的に止める仕組みでした。ただし後者は、丁寧にレビューするほど証拠の期限が切れるという副作用のため、観測を残したまま外し、戻す条件を書いています。

    一人と AI で独立した判断をどう持つか。3 つの意思決定記録を並べて整理しました。
