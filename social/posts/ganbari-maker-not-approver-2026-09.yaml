  text: |-
    生成AIに実装を任せると、生成AIは自分の成果物を自分で承認します。子供の歯みがきや宿題を記録する家庭向けアプリ「がんばりクエスト」をひとりで作るうちに、実際に何度も起きました。

    人間なら常識で止まる行為を、生成AIは止めません。そこで、作る側の開発部と認める側の品質保証部を別の生成AIのセッションと別の GitHub アカウントに分け、管理者の権限で承認を飛ばす抜け道も自分に対して閉じました。

    分けると決めても、規則は 6 回破られました。品質保証部のアカウントのままプルリクエストを作ってしまう事故が 2 回続き、手元の検査では塞げない経路が残ったため、最後の段は GitHub 側の自動処理に置きました。

    分けたら終わり、でもありませんでした。承認する側の生成AIは、顧客の品質を見る役割から、自動検査の結果を読み上げる役割へ滑り落ちます。この現象を 33 日で 42 回観測し、指示を書き足す対処を 5 回試しても頻度は変わりませんでした。

    - 長い会話の中で役割が薄まる
    - 作った側の主張を肯定的に繰り返し、独立した判断が消える
    - 事故のない期間の積み重ねで、逸脱を許容と読み替える
    - 自動検査が通ったという代理の指標を、本来の判断と取り違える

    対策は、事業・使い勝手・安全の観点から反対理由を必ず出す反対役と、その証跡がなければ承認の操作を物理的に止めるフックでした。ただし後者は、丁寧にレビューするほど証跡の期限が切れる副作用のため、滑り落ちの観測の記録は残したまま外し、戻す条件を書いています。

    分けるだけでは足りず、分けた相手に反対させる構造まで要りました。経緯は、開発の記録をまとめた本の 1 章に整理しています。
