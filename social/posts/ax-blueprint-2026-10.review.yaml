  first_lines_given: 3
  subject_identified: 書籍紹介
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: S1触れる、S2仕事に適用する（個人が判断する）
      why: 「S」が何の略か、S1〜S6 の番号が何を数えているかが本文に定義されていない。段階名として読めはするが、「触れる」と「適用する」の違いが経営判断の語で説明されておらず、自社がどこかを当てはめられない。
    - quote: 同じ枠組みを画面にしたWebアプリ「AXコンパス」も公開しています。
      why: 「AX」が本文のどこにも展開されていない。題名の「AIトランスフォーメーション」の略と推測はできるが、本文にその根拠がない。また「公開しています」とあるのに、アプリへの行き先(リンク)が本文にもリンクカードにもない。
    - quote: 分岐の条件と早期警戒指標の表
      why: 「早期警戒指標」が何を警戒する指標かが定義されていない。直後に「経営会議で見る指標は3つに絞っています」とあるが、その3つが何かも書かれていない。予告として読めるので退ける候補。
    - quote: 母集団と設問が違うだけです
      why: 統計用語だが、直前の「調査によって2割から9割まで開きます」から「調べた相手と聞き方が違う」と意味は取れる。退ける候補。
  bounce_points:
    - quote: "- S3仕事に組み込む、S4システムに組み込む（組織が手順として判断する）"
      why: 記号つきの箇条書きが 3 行続き、技術資料の体裁に見える。読者像は技術用語を読まないので、ここで折りたたみを閉じる可能性がある。主張(段差は「配る」と「組み込む」の間)は直前の文で既に述べられており、この 3 行を飛ばしても筋は通る。
    - quote: 本は全42章、出典608件で、第0章の1枚の図から読めます。
      why: 42 章という量が、会議で何を決めるか知りたい読者には重く見える。「第0章」も、章番号が 0 から始まる慣習を知らない読者には引っかかる。ただし「1枚の図から読めます」と軽さを添えているので退ける候補。
    - quote: "リンクカード: AIトランスフォーメーションの設計図 ―― 生成AIの系譜・現在地・5年後の3つの道筋と企業導入フェーズ"
      why: カードの「企業導入フェーズ」と本文の「導入の深さ6段階」が同じものを指すのか、語が揃っていない。カードは本文の外なので退ける候補。
  figure_only_subject: DXの効果の段差(効率化はしたが損益に効いていない)。画像の alt だけでは「生成AI」の語がなく、「DX動向2026」の名から DX 全般の話に読める。
  next_step_clear: true
  ending_natural: true
  ending_note: LinkedIn の結びは本の仕様(章数・出典数・事実と解釈の分離)の列挙で、本文の筋(段差→6段階→道筋→会議資料)から自然につながる。ただし最後の一文「事実には一次資料へのリンクを付けています」は読者に何かをさせる文ではなく、行動はリンクカード(本)に委ねている。途中で紹介したアプリ「AXコンパス」への行き先は本文にない。Bluesky はリンクカードが 3 投稿目にしかなく、タイムラインに流れる 1 投稿目は画像のみで行き先がない。
