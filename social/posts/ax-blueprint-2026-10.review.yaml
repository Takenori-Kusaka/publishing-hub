premortem: |
  (1) 章数「全42章」が本文・alt・カード画像の3か所に入っているが、本のどこにも総章数の記述がなく、番号付きの章は第0章〜第38章の39章、序と総括を足して41章(リポジトリの査読記録も「公開時 41 章」)で、42の根拠が無い。読者が Zenn の目次と数えて食い違えば訂正になる。
  (2) IPA の 91.6% と 3.9% は「AI導入の効果として」答えた企業の割合であり、回収 1,799 社全体の割合ではない。LinkedIn 本文の「1,799社の回答のうち…91.6%」とカードの見出し「日本企業 1,799 社の回答」は分母を 1,799 社に読ませる。導入率が 59.6% の調査で 91.6% が効率化と答えたことになり、数字に詳しい読者が矛盾を指摘する。
  (3) 「段差は配ると組み込むの間にある」「速くなった時間が残業の削減や外注の縮小に変換されていない」は、正本では「著者は考えます」の解釈として置かれている。SNS では断定形になっており、調査の事実として引用されると出典(IPA)に無い主張が IPA の名で広まる。
