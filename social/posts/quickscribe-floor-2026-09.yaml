  text: |-
    「精度はコモディティだから、そこで差別化は追わない」と公開した自分の設計判断が、11分40秒の録音1本で覆りました。末尾の約24秒が、丸ごと欠落していたのです。

    学んだのは、「差別化しない」ことと「壊れてもよい」ことは全く別だということです。文字起こしは差別化の軸ではありませんが、その上に載るものすべてを支える床でした。床が抜ければ、どれだけ高度な整形を載せても、その部分の価値はゼロになります。

    原因は、当時の日本語の既定モデルにありました。高速化のためデコーダを2層に蒸留した設計で、長尺の末尾タイムスタンプの予測が弱い。30秒の窓をスライドさせる処理が、最終窓を早期に打ち切っていました。

    前の文脈への条件付けを切る対症療法では、トークンの反復は消えても、末尾の欠落は直りませんでした。停止位置は、むしろ早まりました。

    そこで問いを「パラメータをどう直すか」から「既定モデルを選び直すべきか」へ引き上げ、3つの判断をしました。

    - 公開コーパスでのCER測定に加え、利用者の実録音での到達タイムスタンプを併用して比べる
    - 既定を差し替え、旧モデルは削除せず、用途を変えてカタログに残す
    - 「壊れないこと」の担保は人の目視ではなく、CERベンチとCIの回帰監視に委ねる

    差別化を追わないと決めた領域こそ、床として機械に見張らせる価値がありました。コモディティと、壊れてはいけない土台は別物です。

    公開した判断を自分で覆した記録は、却下案と反証条件を添えて意思決定記録に残しました。

    ※この投稿は、生成AI（Gemini と Claude）で下書きし、筆者が内容を確認して公開しています。
