      why: 図のラベルと本文の「型番とシリーズの関係をデータとして書き込む」が同じ段階を指すと読み取れるのは数値(37)が一致するからで、語としては対応していない。
  bounce_points:
    - quote: 通信仕様が製品の取扱説明書ではなくシリーズ共通の別冊にあるマニュアル、多段の結合ヘッダを持つ FMEA の Excel、番号と引出線だけの特許の図、文字層のないスキャン PDF です。
      why: 4 種類のデータ特性が修飾の長い名詞句で 1 文に並び、タイムラインで流し読みするとここで止まる。どの特性が後の結果(分冊マニュアル 2→7、特許 4→1 など)に対応するかがこの時点では分からない。
    - quote: 表を表ごと読ませる工夫と、別冊の参照をたどる工夫は、このデータでは改善しませんでした。
      why: 候補としては挙げるが離脱点としては弱い。「工夫」が具体的な手法名で書かれていないため、手法名で知っている読者には何が効かなかったのか特定できない。ただし直後の数値(4 問から 1 問)で読み続ける動機は保たれる。
  figure_only_subject: RAG のパイプラインを段階的に強化したときの回答可能な質問数の推移(18→44)。図だけでは FMEA という題材も、何問中かという母数(48 問)も分からない。
  next_step_clear: true
  ending_natural: true
  ending_note: 18 行目の「手法を足す順番は、手法の一覧ではなく、残った失敗の種類が決めます。」は、成功した段階・効かなかった手・残った失敗という本文の流れから自然に出る結論。最後の一文「データ特性ごとの指針と 76 枚のスライド、コードと合成データは、記事からたどれます。」は、直下のリンクカードから記事へ移動させることを狙っており、行き先は明確。Bluesky 2 投稿目も「こちらです」+リンクカードで同じ行き先に揃っている。
