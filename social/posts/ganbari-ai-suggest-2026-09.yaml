        title: "第Ⅱ部-11　AI 提案 ― 前面に出ない生成AI、provider の抽象化、1 度も成立していなかった本番"
        description: "前面に出ない生成AIの provider 抽象化と、本番で 1 度も成立していなかった AI 提案の事故。"
    - text: |-
        学びは、isAvailable() の true を成功の保証にしないことです。既定値があることは、設定が配られたことを意味しません。稼働の判定は実呼び出しだけで、静的な根拠で未有効化と結論づけると誤検出になります。縮退の率を alarm にしました。
