  text: |-
    Android 16 端末にて、Family Link 管理下の子供アカウントで PWA をインストールしようとしました。しかし、「ホーム画面に追加」などのインストール導線が完全に消失する問題に遭遇しました。自社サービス「がんばりクエスト」だけでなく、Starbucks 等の著名 PWA でも同様の事象が発生しました。

    原因究明と対策の特定には、約2時間の実機検証を要しました。結論として、子供向けランチャー「Google Kids Space」単体の制限ではありません。Family Link における Chrome のウェブ制限（オンデバイスデータ無効化やフィルター制限等）が、PWA インストール（WebAPK）機能を直接抑止していることが判明しました。

    実機検証から得られた知見と、実務における要点は以下の通りです。

    - Kids Space ランチャーを終了しても導線は復活しない。
    - Family Link の Chrome ウェブフィルター設定（Only allow approved sites やオンデバイスデータ制限）を緩和すると、PWA 導線が復活する。
    - 安全性を保つためには、個別オリジンの詳細な許可設定や最小権限設計が必要となる。

    PWA は手軽に配布できます。しかし、保護者向けの管理機能などの外部ポリシーにより、インストールを制限する隠れた仕様が存在します。

    子供向けにサービスを確実に届けるなら、別のアプローチが推奨されます。Trusted Web Activity（TWA）を用い、Google Play ストア経由で配布します。これにより、Family Link のアプリ承認機能が利用可能となります。

    このトラブルシューティングの全検証ステップと、最小構成を見つけるための推奨設計について、共有カードのリンク先に詳しく整理しました。
