premortem: |
  (1) 短くした結果、正本の限定が落ちる。引き下げの検知条件「AI が起因の重大事象」から「AI が起因の」が落ちると、障害一般で自律レベルが下がると読まれ、訂正の原因になる。
  (2) 「ゲート」の範囲がずれる。正本で単独判定なのは工程ゲート(G-1〜G-8)だけで、ステージ移行ゲートと自律レベルの引き上げは会議体が判定する。「ゲートの判定は1人」と無限定に書くと、標準の会議体の規定と食い違う。
  (3) 記事に無い導線や表を予告する。「標準の本文とテンプレートへのリンク」「ゲート・自律レベルの表」が記事に実在しなければ、リンク先で読者が見つけられない。画像の alt が図の実態と違う場合も同じ。
