  text: |-
    「ピットイン方式」は、AI が実装を主導する前提で、人の判定を守るための開発プロセスです。F1 のピット作業のように、レースは止めず、決められた場所でだけ人の手を入れます。

    AI に実装を任せると、コードは速く書き上がります。生成が速くなるほど、全体の速さは、人が確かめる作業で決まるようになります。大きな差分を1行ずつ確認する作業は、時間の制約のもとで、実質的な承認操作へ縮退します。

    そこで、全体を二層に分けて回します。

    - 外側は、事業判断の節目です。投資の継続や出荷の可否を、案件あたり数回で決めます
    - 内側は、AI と協調して作るループです。仕様承認(人)→ AI 実装 → 自動検証(機械)→ 独立レビュー(人)を、機能単位で回します
    - 判定の場(ゲート)は8つあります。このうち機能仕様承認と自動検証は、どの事業ステージ(探索・価値確立・スケール)でも省略しません
    - ゲートでは、合議を判定の場にしません。判定は1人が単独で行います。作成を指示した本人は独立レビュアを兼ねません。AI は結果責任を持てません

    稟議と決裁権限の規程は変えません。ただし、技術判断を決裁の階層から分けるなど、既存の制度への変更は4点あります。

    AI に任せる度合い(自律レベル)は、上げるときは判定を要します。下げるときは、判定を待ちません。重大事象の発生などを計測が検知すると、自動に下がります。差し戻し率(独立レビューで差し戻された変更の割合)が0%のまま続いたら、順調ではなく形骸化の疑いとして扱います。

    全体像を一枚の図と表で整理しました。プロセスを定めた標準の本文と、この方式に沿ったテンプレートのリポジトリへのリンクも置いています。
