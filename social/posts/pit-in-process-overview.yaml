  text: |-
    AI に実装を任せると、コードは速く書き上がります。それでもチーム全体が速くならないのは、人が読んで判断する時間がそのまま残り、しかも読む量が増えるからです。承認は、読み切れないまま印を押す操作へ縮んでいきます。

    「ピットイン方式」は、この問題に対して、AI の賢さではなく人が触る場所を決めることで応える開発プロセスです。F1 のピット作業のように、レースは止めず、決められた場所でだけ人の手を入れます。

    - 外側の輪は壊さない。投資の是非、ステージ移行、リリース決裁は既存の稟議のまま
    - 内側の輪だけを AI の速度に合わせて作り替える。仕様承認(人)→ AI 実装 → 自動検証(機械)→ 独立レビュー(人)を機能単位で回す
    - 8つのゲート(判定の場)のうち、機能仕様承認と自動検証だけは、どの事業ステージでも省略しない
    - 変更を次へ進めてよいかの判定は、1人が名前で引き受ける。作成を指示した本人は承認しない。AI は結果責任を持てない

    AI に任せる度合い(自律レベル)は、上げるときは判定を要し、下げるときは兆候を検知した時点で自動に下げます。差し戻し率(ゲートで差し戻された変更の割合)が0%のまま続いたら、順調ではなく形骸化の疑いとして扱います。

    全体像を一枚の図と表で整理しました。章ごとの詳細と、設計判断の記録(ADR)への導線も置いています。
