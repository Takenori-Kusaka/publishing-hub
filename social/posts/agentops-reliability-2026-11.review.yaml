cold_read:
  first_lines_given: 10
  subject_identified: AgentOps(AIエージェントの評価・制御・回復・運用)を新任テックリード向けにまとめた記事とスライドの告知
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: τ-bench(小売、当時の GPT-4o)
      why: τ-bench が何を測るベンチマークか、「小売」が何の領域・タスクを指すかが本文に書かれていない。61.2% と 25% 未満の差が何を意味するかは読めるが、測定条件は確かめられない。
    - quote: 危険率の上限はおよそ 3%
      why: 100 件で 0 件から上限およそ 3% を出す根拠(どの信頼水準の上限か、どの計算か)が書かれていない。統計に詳しくない読者には数字の出どころが分からない。
    - quote: (AgentDojo、GPT-4o)
      why: AgentDojo が何(ベンチマークか、攻撃データセットか)かが定義されていない。直前の「注入の検出器」の「注入」がプロンプトインジェクションを指すことも、本文からは推測するしかない。
    - quote: モデルの外の決定的な仕組み
      why: 「決定的」が deterministic(同じ入力で同じ結果)の意味か、「決め手となる」の意味か、日本語だけでは決められない。括弧内の列挙から前者だと推測はできる。
    - quote: 実行ブローカー
      why: LinkedIn 本文では「認可済みの操作だけを代行する」と説明があるが、Bluesky の 1 投稿目では説明なしで出てくる。Bluesky だけを見た読者には意味が取れない。LinkedIn の読者像としては退ける候補。
    - quote: 状態での成功判定
      why: 画像の alt にあるが、何の「状態」(外部システムの状態か、エージェントの内部状態か)で判定するのかが alt だけでは分からない。
  bounce_points:
    - quote: 注入の検出器を足すと、攻撃の成功は 7.95% に下がったが、普通のタスクの有用性も 69.0% から 41.49% に下がった(AgentDojo、GPT-4o)。
      why: 1 文に 3 つの数値と未定義の固有名が詰まっており、タイムラインで流し読みする読者はここで止まりやすい。攻撃成功率の「下がる前」の値が書かれていないため、7.95% が大きな改善かどうかも本文から判断できない。
    - quote: 新任のテックリード向けのスライド 104 枚と記事にまとめました
      why: 104 枚という分量が最初の段落に出てくるので、「重そうだ」と感じた読者は要点を読む前に離れるおそれがある。一方で「新任のテックリード向け」と対象がはっきり書かれているので、読者像には当たる。退ける候補。
    - quote: RAG は、AIエージェントに渡す証拠の質を上げる技術です。
      why: 最初の一文が RAG の説明から始まるので、RAG を知っている読者には既知の話に見える。ただし次の文の「けれど」で問題提起に移るため、離脱の要因としては弱い。退ける候補。
  figure_only_subject: AIエージェント(と読める)の 4 つの制御の仕組み(構造化出力・ガードレール・ポリシーによる認可・状態での成功判定)の比較と、モデルの提案から状態の照合までの処理の流れ。alt には「エージェント」も「AgentOps」も出てこないため、図だけでは何のシステムの話かは推測になる。
  next_step_clear: true
  ending_natural: true
  ending_note: 最後の一文「事故と運用事例から学ぶアンチパターン、評価の統計、最初の 90 日の進め方も、記事とスライドからたどれます。」は、記事(リンクカード)を開かせたい文。箇条書きの後に「他にもある」と続けるので流れは自然。ただし本文中に URL はなく、行き先はリンクカードの記事だけ。スライドへの直接の行き先は本文からは確かめられない。Bluesky は 2 投稿目の末尾「試験と、実行時に止める仕組みの両方を置きます。」で終わり、外部リンクカードが行き先になる。
