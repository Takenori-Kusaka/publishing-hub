  text: |-
    手元で回す検査を Ready 化の条件にしていたら、いつのまにか誰も実行しない gate になっていました。「がんばりクエスト」の開発で、20 ステップ・20 分超に育った検査 CLI の話です。

    実行されない gate は、機能していない gate です。私は判定の根拠を CI の全 job pass に移し、手元の CLI は 6 ステップ・5 分以内に縮めました。残したのは、証跡の真正性と顧客に見える正しさのうち、安価なものだけです。

    さらに実行順を安い順に並べ替えました。PR 本文だけを見る検査を最初に、型検査とテストは後に。番号順に回していたころは、本文の体裁ミス 1 つを見つけるのに 20 分以上待たされていました。

    - 手元は早く落とす。CI は確定する
    - base が進んだら、検査基準が変わったときだけ止める。理由の分からない BLOCK は迂回を誘発する
    - CI で落ちる検査の一覧は手書きにせず、実測と突合するテストで守る
    - 除外の理由は非空ではなく実体を要求する

    検査を増やすほど品質が上がる、という直感は、私の実測では成り立ちませんでした。手元と CI の役割分担を 1 章にまとめています。
