  text: |-
    手元で回す検査をレビュー待ちの条件にしていたら、いつのまにか誰も実行しない関門になっていました。子供の歯みがきや宿題を記録する家庭向けアプリ「がんばりクエスト」の開発では、手元の一括検査が 20 段階、22 分半に育っていました。

    通らなければ次へ進めない検査を関門と呼びます。22 分半かかる検査は実行されず、実行されない関門は機能していない関門です。判定の根拠を自動検査の全処理が通ることに移し、手元の一括検査は 6 段階、300 秒以内に縮めました。

    残したのは、安価な検査だけです。さらに実行順を安い順に並べ替えました。プルリクエストの本文だけを見る検査を最初に、型検査は後に。

    番号順に回していたころは、本文の体裁の誤り 1 つを見つけるために、型検査と単体テストの完走を 23 分待たされていました。

    - 手元は早く落とす。自動検査は確定する
    - 元にしたブランチが進んでも、検査基準が変わったときだけ止める。理由の分からない停止は迂回を誘発する
    - 自動検査で止まる検査の一覧は手書きにせず、設定の実測と突き合わせるテストで守る

    手元の合格は自動検査の合格を意味しない、という事実も残ります。負荷に依存する失敗は、手元からは原理的に見えません。

    判定の根拠を自動検査に置いたのは、同じ検査を並列に回して数分で終わり、実行したかを人の申告で確かめずに済むからです。手元と自動検査の役割分担は、開発の記録をまとめた本の 1 章に整理しています。
