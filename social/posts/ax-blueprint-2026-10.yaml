  text: |-
    『AIトランスフォーメーションの設計図』は、AIトランスフォーメーション(AX)を経営会議で決めるために、生成AIの系譜と現在地と未来の道筋を出典つきで整理した本です。日本企業の生成AI導入率は、調査によって2割から9割まで開きます。どれも誤りではなく、母集団と設問が違うだけです。

    自社の位置を知るために他社と比べるなら、同じ規模と同じ定義の調査を選ぶ必要があります。一方で、どの調査でも共通する段差があります。公的機関IPAの「DX動向2026」(回収1,799社)では、AIを導入した企業の効果として、業務が効率化・迅速化したと答えた企業が91.6%、売上や利益が向上したと答えた企業は3.9%でした。

    この段差は、個人と組織の間にあります。速くなった時間が、残業の削減や外注の縮小といった別の価値に変換されていないからです。

    本書は企業の導入の深さを、S1「触れる」からS6「顧客へ届ける」までの6段階(Sは段階の番号)で測ります。下の2段は個人が、中の2段は組織が手順として、上の2段は顧客との関係の中で決まります。段差は、S2「仕事に適用する」と、S3「仕事に組み込む」の境だと整理しました。

    日本の公的統計は、S2までが広がりS3から先が細い分布を示します。配ることは契約で済みますが、組み込むことは業務の設計を変える仕事です。

    未来は1つに決めず、加速・漸進・調整の3つの道筋を、分岐の条件と早期警戒指標の表とともに置きました。経営会議で見る指標は3つに絞っています。そのうえで、自社の現在地を診断し、次の90日で上げる段階を1つ決め、10の見出しを持つ1枚の会議資料に落とす手順を示しました。

    同じ枠組みを画面にしたWebアプリ「AXコンパス」も公開しています。質問に答えると、現在地、前提に置く道筋、次の一手の候補、会議資料の1枚を出力します。入力は端末の中に保存され、外部には送信されません。

    本は第0章から第38章と付録からなり、出典は608件です。第0章の1枚の図から読めます。事実と解釈は章ごとに分け、事実には一次資料へのリンクを付けています。
