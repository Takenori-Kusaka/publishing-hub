  posts:
    - text: |-
        画面の経路からデータベースを直接触らない、と指示書に書いても、生成AIは守りませんでした。「がんばりクエスト」では、その決まりをリポジトリを走査する単体テストへ写し、境界を越えた瞬間、落ちる形にしています。構造や文書と実装の一致を見るこの種のテストを、契約テストと呼びます。守っているのは文書ではなく、落ちるテストでした。
      external:
        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/fitness-functions
        title: "第Ⅴ部-4　契約をテストにする ― 構造と文書と実装の一致を見る 97 本"
        description: "リポジトリの構造や運用文書と実装の一致を検査する走査テスト 97 本の形と、効いた 3 種、掛けすぎた分。"
    - text: |-
        97 本の契約テストのうち効いたのは 3 種で、顧客への約束をコードに置く検査、検査していないのに合格と出る不具合の型を止める検査、不採用の記録を反証できる検査です。どれも人の注意では守れず、テストにして初めて守られました。逆に道具自身の不具合まで同じ型ごと止めると「道具を守る道具」が増えるので、対象は顧客の金とデータと認可に絞りました。リンク先の本が導いた 10 条の原則のうち「原則は書くだけでは守られない」の実例です。
