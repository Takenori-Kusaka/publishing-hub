        title: "第Ⅰ部-2　滞在時間を価値毀損と数える ― anti-engagement 原則と「卒業」"
        description: "子供のアプリ内滞在時間を価値毀損と数える原則と、それを検査と構造で守る仕組み。"
    - text: |-
        その原則は文章で終わらせず、仕組みに埋めています。紹介ページに射幸心を煽る語が混ざれば公開前の検査が止め、子どもの端末には通知を送れない構造にし、画面は 15 分で自動的に休みます。解約画面は引き止めではなく、卒業を祝う場にしました。
