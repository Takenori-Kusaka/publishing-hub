    - text: |-
        子ども向けアプリ「がんばりクエスト」では、子どもがアプリの中にいる時間は短いほどよい、と決めています。滞在時間を伸ばす仕掛けは採用せず、追う数字は毎日開かれたかだけです。お金を払うのは親で、親が増やしたいのは現実の活動の時間だからです。
