  posts:
    - text: |-
        子供向けアプリ「がんばりクエスト」は、子供がアプリの中にいる時間は短いほどよい、と決めています。滞在時間を延ばす仕掛けは採用せず、追うのは日ごとの起動率と現実の活動の記録数で、セッションの長さは追いません。お金を払うのは親で、親が増やしたいのは歯みがきや宿題など現実の活動の時間だからです。
      external:
        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/anti-engagement
        title: "第Ⅰ部-2　滞在時間を価値の毀損と数える ― 子供を留めない設計と卒業"
        description: "子供のアプリ内の滞在時間を価値の毀損と数える原則と、それを自動検査・単体テスト・画面の構造で守る仕組み。"
    - text: |-
        原則は文章で終わらせず、構造に埋めてあります。製品の紹介ページに射幸心を煽る語が混ざれば自動検査が止め、子供の端末には通知を送れない構造にし、画面は連続 15 分で自動的に休みます。解約の画面も引き止めではなく卒業を祝う場で、使わなくなることを成功と先に決めたからこそ仕掛けを断れました。
