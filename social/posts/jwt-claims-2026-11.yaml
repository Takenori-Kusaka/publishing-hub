  text: |-
    JWT のクレームは、1 つの発行者が書き、多数のサービスが読む契約です。組織で共用する独自クレームの設計・伝搬・検証・ガバナンスを、新任のテックリーダー向けのスライド 149 枚にまとめ、対になるケーススタディで実際に攻撃を当てて測りました。

    Storm-0558 や nOAuth のような事故では、署名は正しく、暗号も破られていません。欠けていたのは、どのクレームを何と照合するかという設計でした。そこでガイドは、どの組織でも外せない共通の基準の上に、題材ごとの重点と、見直しの条件つきの見送りを置きます。

    ケーススタディで分かったことは次のとおりです。

    - 共通の基準は、alg none や別の発行者の鍵で iss を偽るトークンなど、汎用の攻撃 14 件をすべて止めた
    - AIエージェントの委任への攻撃 12 件は、共通の基準では 1 件も止まらなかった。止めたのは承認の束縛や宛先に束縛した交換などの重点
    - 必須クレームの欠落を拒否すると、正規の管理者まで止まった。解いたのは確認を外すことではなく、入口での正規化などの重点を足すことだった
    - 共有クレームの区切りを空白からカンマに変えると、壊れた 7 つの受け手はすべて黙って誤り、型を確かめる契約テストでは 1 つも見つからなかった

    クレームを出典ごとに集めた 805 行の一覧表(xlsx)も、ケースごとの採否と見直し条件つきで公開しています。
