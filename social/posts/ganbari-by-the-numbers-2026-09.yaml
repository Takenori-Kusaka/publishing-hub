  text: |-
    ひとりと生成AIで商用サービスを 7 か月作ると、どんな数字になるのか。「がんばりクエスト」という子育て向けサービスの開発を、git、GitHub、手元の Claude Code のログから数えました。

    本番に届いたコミットはおよそ 3,000、マージされたプルリクエストは 2,200 超、Issue は 2,500 超です。1 日あたりコミット 14、プルリクエスト 10 ほどで、この速さは 7 か月ほぼ一定でした。使うモデルは 7 回変わり、ブランチの運用は 3 回変わりましたが、速さは変わっていません。

    費用は、ほぼ 2 つです。

    - 開発は Claude Max の定額。トークンが増えても請求は変わらず、制約は金額ではなく週間の上限でした
    - 運用は AWS が月 1〜3 ドル。顧客のリクエストを処理する部分は無料枠の中です
    - AI 提案に使う Bedrock は月 0.0006 ドル

    もし従量で払っていたら。直近 21 日分のトークンを公開の単価で換算すると約 1 万 8 千ドル、1 日あたり約 850 ドルでした。その 7 割は出力ではなく、応答のたびに読み直される文脈（キャッシュ読み取り）の分です。

    数えられなかったものも書きました。30 日で消えるトークンのログ、人が費やした時間、生成AIが書いた行と人が書いた行の区別です。数えるなら初日から数えるべきだった、というのが最大の学びです。

    リンク先の本が導いた 10 条の原則のうち「生成AIに渡す文脈は常時読ませない」の実例で、減らすなら常時読ませる文書から減らすことになります。期間・量・速さ・モデルの遷移・トークン・費用を、取り方ごと 1 章に整理しました。
