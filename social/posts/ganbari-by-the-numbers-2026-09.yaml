  text: |-
    ひとりと生成AIで商用サービスを 7 か月作ると、どんな数字になるのか。「がんばりクエスト」という子育て向けサービスの開発を、git・GitHub・手元の Claude Code のログから数えました。

    本番に届いた変更はおよそ 3,000、取り込まれた PR は 2,200 超、Issue は 2,500 超です。1 日あたり変更 14、PR 10 ほどで、この速さは 7 か月ほぼ一定でした。使うモデルは 7 回変わり、ブランチ戦略は 3 回変わりましたが、速さは変わっていません。

    費用は 2 つだけです。

    - 開発は Claude Max の定額。トークンが増えても請求は変わらず、制約は金額ではなく週の利用上限でした
    - 運用は AWS が月 1〜3 ドル。顧客のリクエストを処理する部分は無料枠の中です
    - AI 提案に使う Bedrock は月 0.0006 ドル

    数えられなかったものも書きました。30 日で消えるトークンのログ、人が費やした時間、AI が書いた行と人が書いた行の区別。数えるなら初日から数えるべきだった、というのが最大の学びです。

    期間・量・速さ・モデルの遷移・トークン・費用を、取り方ごと 1 章にまとめました。
