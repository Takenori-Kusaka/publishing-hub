      why: 「経路」が何の経路か(クレームの JSON パスか、トークンの伝搬経路か)が定義されていない。
    - quote: 9 つの受け手のうち 7 つが壊れ
      why: 「受け手」が何か(ケーススタディ内のサービス実装か、ライブラリか)が書かれていない。文脈から推測はできるが確かめられない。
    - quote: Storm-0558(別の鍵で偽造されたトークン)
      why: Storm-0558 は事件名(攻撃者名)で、括弧の説明は手口のみ。どの組織の事故か、いつのものかが書かれておらず、知らない読者は既知の事故として受け取れない。退けてもよい候補(括弧で最低限の意味は取れる)。
  bounce_points:
    - quote: そこでガイドは、判断を 2 段に分けます。
      why: 直後の文が長く用語定義を詰め込んでおり、ここで読む負荷が上がる。「2 段」と言いながら共通の基準・重点・見送りの 3 つが出てくるため、段の数え方が本文から確かめられない。
    - quote: 必須クレームの欠落を拒否すると、グループが多すぎて一覧が消えた正規の管理者まで止まった。
      why: 前提知識(グループ一覧が省略される仕組み)を要する箇条で、分からない読者はこの項目で読み進める理由を失う。
  figure_only_subject: JWT 独自クレーム設計の層構造(下に共通の基準、その上にマルチテナント SaaS・社内業務システム・AIエージェントの委任ごとの重点と見送り候補)
  next_step_clear: true
  ending_natural: true
  ending_note: LinkedIn 本文の最後の一文は「クレームを出典ごとに集めた 805 行の一覧表(xlsx)も、…記事からリンクしたケーススタディのリポジトリに置いています。」で、リンクカード(記事)を開き、そこからリポジトリへ進ませたい意図が読み取れる。ケーススタディの結果の箇条から付属資料の案内へ移る流れは自然。ただし「記事」という語は本文でここが初出で、リンクカードがその記事だと結びつけるのは読者側の推測に頼る。
