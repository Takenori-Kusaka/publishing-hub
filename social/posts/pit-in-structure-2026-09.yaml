    - text: |-
        AIで実装が高速化した時、真のボトルネックはコード生成ではなく「人間の検証と意思決定」に移ります。これを扱うために書いたのが「ピットイン方式」です。

        対策は、人間が引き受ける境界線をコード差分から「不変条件と受入テスト」へと引き上げること。既存の稟議や決裁は外殻にそのまま温存し、内側の AI 協調ループだけを機能単位で高速に回します。判定は1人が単独で行い、AI がどれだけ実行しても結果責任は必ず人間に紐づきます。
