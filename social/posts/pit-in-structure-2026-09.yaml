  text: |-
    AIで実装が速くなっても、開発全体が速くなるとは限りません。むしろ、人間のレビューと意思決定が詰まり、ボトルネック化します。

    「ピットイン方式」は、既存の組織構造や稟議制度を一切壊さず、内側の「AI 協調ループ」だけを高速化するための二層の境界線設計です。

    - 外殻（低頻度）: 投資決裁やステージ変更などの既存の意思決定を温存する。
    - 内側（高頻度）: 仕様承認、AI 実装、自動検証、独立レビューを機能単位で回す。
    - 工程ゲートは8つ。機能仕様承認（G-4）と自動検証（G-5）だけは、どの事業ステージでも省略しない。
    - G-5 は人の判断を挟まず機械が判定する。秘匿情報の混入だけは「記録して後で対応」を認めない。

    運用を支えるのは3つの原則です。判定は1人が単独で行い、作成を指示した本人は承認しません。AI はどれだけ実行しても、結果責任は必ず人間に紐づきます。

    AI にどこまで任せるかは、L1〜L3 の自律レベルで定義します。引き上げは判定を要し、引き下げは検知した時点で自動に発火します。差し戻し率が0%のまま推移したら、うまくいっているのではなく形骸化の疑いとして扱います。

    この構造により、開発者はコードを「書く」人から、仕様を「定義し検証する」立場へとシフトします。判断の質は、コードの行数ではなく「検証した観点の数」で保証されます。

    詳細は、意思決定の記録（ADR）を含めてこちらに整理しました。
