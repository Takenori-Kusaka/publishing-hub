    - text: |-
        コードをナレッジグラフにする Graphify を、「がんばりクエスト」では実測のうえ不採用と記録し、1 週間後に採用しました。理由は clone 直後から構造を引けること。ただし 30MB の graph.json を main に置いた結果、並行する PR が全部 conflict しました。
