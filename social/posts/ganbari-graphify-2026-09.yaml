        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/graphify
        title: "第Ⅵ部-4　graphify ― 不採用から採用へ、grep の前に hook で挟む、bot が develop に PR を出す"
        description: "不採用から採用へ覆った経緯、並行 PR が全部 conflict した事故、bot の再生成パイプライン。"
    - text: |-
        正直に書くと、本を書くために打った graphify query は grep より当たりませんでした。価値は god-nodes とレポートにあり、query を hook で強制するのは価値の無い方を強制していました。オーナーの判断は、より軽量なツールへの見直しです。
