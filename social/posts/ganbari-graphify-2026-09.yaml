    - text: |-
        子供の歯みがきや宿題を記録する家庭向けアプリ「がんばりクエスト」の開発で、コードをナレッジグラフにする graphify を実測のうえ不採用と記録し、1 週間後に採用しました。理由は、リポジトリを複製した直後から構造を引けることです。ただし全ブランチでコミットのたびに 27MB 超のグラフを再生成していたため、開発ブランチへマージするたびに開いている他のプルリクエストが全部そのファイルで衝突しました。
      external:
        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/graphify
        title: "第Ⅵ部-4　graphify ― 不採用から 1 週間で採用へ、検索の前にフックで挟む、機械名義が開発ブランチに変更を出す"
        description: "不採用から採用へ覆った経緯、並行するプルリクエストが全部衝突した事故、機械名義による再生成の装置。"
    - text: |-
        リンク先の本を書くために問いを投げる機能を打ちましたが、検索より当たりませんでした。価値は中心の節点の一覧と報告書、つまり必要なときに構造を引けることにあり、検索のたびにフックで読ませていた機能にはありませんでした。再生成の装置は機械名義のプルリクエストと 30 件の依存の固定まで膨らみ、道具より大きくなりました。
