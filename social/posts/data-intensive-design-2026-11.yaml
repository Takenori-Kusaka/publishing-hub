  text: |-
    大規模クラウドサービスの全体設計を任されたら、何から見るか。新任のテックリーダー向けに、見る順番を 9 つのステップにしたスライド 256 枚と、実測のケーススタディを公開しました。対象は、業務サービスと、データ・ログ・認証・分析などの共通基盤から成るシステムです。

    出発点は、データはコードより長く残る、という見方です。コードは書き直され、製品は入れ替わりますが、注文の記録のようなデータは読まれ続けます。だから、コードの設計より先に、データの持ち方と流し方を決めます。

    ケーススタディでは、架空の宅配注文サービスを 1 台の Docker 環境に組み、3 つの構成を比べました。よくある素朴な構成、ガイドの主張を対策にした共通の基準を入れた構成、題材ごとの対策(重点)を足した構成です。同じ実験は最初から 2 回流しています。

    - DB に書いてから別のシステムへも書く二重書き込みは、障害を入れなくても、届く順序が入れ替わった。エラーは返らなかった
    - スキーマの互換性検査は、Redpanda の内蔵のレジストリの既定(BACKWARD)だと、直前の版とだけ比べる。段ごとには通るが、最新の版の受け手が最初の版のデータを読めなくなる変更の列を通した
    - PostgreSQL は、同期する複製先を設定で名指ししないと、複製の経路が切れた後に応答した書き込みを、複製先への切り替えで失った。名指しすると、複製先を止めたとき、観測の時間(15 秒と 60 秒)の間は書き込みが返らなかった
    - 新旧の索引を並べて切り替える手順で、前より古い版を読む読み取りが、1 回目は 5 試行で 0 件、2 回目は 1 件起きた

    基準を入れた構成は、欠落を 0 件にした場面で、代わりに重複が届き、届くまでの遅れが延びました。失わない設定は、別の止まり方を持ち込みました。

    「0 件」は、その手順と試行の数で起きなかったという意味でしかありません。0 か 1 以上かが 2 回で入れ替わった組(構成とケースと数えたものの組)は、比べた 1,382 組のうち 21 組でした。試験の結果を聞くときは、試行の数と、流し直したかを一緒に聞きます。

    測ったのは、1 台の機械に自分で入れて動かした製品だけです。クラウドのマネージド製品と、認証・AI・セキュリティの各基盤は測っていません。

    設計レビューで問うことを 1 行 1 問で並べた一覧表(xlsx)も作りました。下の記事から、ケーススタディのリポジトリにある表へ進めます。
