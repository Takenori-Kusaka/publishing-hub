        個人出版で Zenn・Qiita・note・SNSへ同じ原稿を手で貼り直す作業と、誤公開やトークン漏洩の恐怖を、Git＋GitHub Actionsの配信基盤で解決しました。

        正本はZennに一本化し、媒体ごとの派生原稿は機械検査に通してから、手動起動とEnvironmentに紐づくジョブで投稿します。投稿の結果は台帳に記録し、UTMの付与は決定的な処理だけに限定しました。設計と実装はGitHubで公開しています。
