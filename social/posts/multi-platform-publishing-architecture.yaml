  text: |-
    技術ブログはZenn、解説はQiita、エッセイはnote、仕事での主張はLinkedIn、カジュアルな対話はBluesky。
    
    現代の発信はチャネルが多様化していますが、同時に「原稿の断片化」や「コピペ転載の手間」、そして「認証情報の漏洩・誤公開の恐怖」という課題が付きまといます。

    私たちはこの課題を、エンジニアリング（Git ＋ CI ＋ 自動検証）で解決する「マルチプラットフォーム出版・配信基盤」として実装しました。

    本基盤が採用した中核的な設計ポリシーは、「同じ本文の複製ではなく、同じテーマに基づく個別成果物（バリアント）の管理」です。

    - 長文原稿が「正本（SSOT）」: books/ や articles/ 内の Markdown
    - social/posts/*.yaml が「配信用バリアント」: PRでのレビューを必須化
    - 公開処理は「決定的な処理」のみ: UTM自動付与、Grapheme文字数検証、ピュアJSによるJPEG画像EXIF除去

    さらに、GitHub Environmentの承認（Required Reviewers）によるシークレット保護と、二重投稿を阻止する「公開台帳システム」を組み合わせ、100%安全なSNS公開パイプラインを実現しました。

    「プログラムを書く」ように「自分の言葉と意思決定を届ける」こと。
    設計・実装の詳細は、こちらにオープンソースとして公開・整理しました。
