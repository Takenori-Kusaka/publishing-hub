  text: |-
    個人出版の原稿を Git で管理し、CI で検査してから配信する基盤を作りました。技術ブログはZenn、解説はQiita、エッセイはnote、仕事での主張はLinkedIn、カジュアルな対話はBluesky。
    
    現代の発信はチャネルが多様化していますが、同時に「原稿の断片化」や「コピペ転載の手間」、そして「認証情報の漏洩・誤公開の恐怖」という課題が付きまといます。

    私はこの課題を、エンジニアリング（Git ＋ CI ＋ 自動検証）で解決する「マルチプラットフォーム出版・配信基盤」として実装しました。

    派生物の設計原則は、「同じ本文の複製ではなく、同じテーマに基づく個別の成果物」です。

    - 長文原稿が「正本（SSOT）」: books/ や articles/ 内の Markdown
    - social/posts/*.yaml が「配信用バリアント」: 公開前に人が読む
    - 公開処理は「決定的な処理」のみ: UTM自動付与、Grapheme文字数検証

    公開は手動で起動するジョブだけが行い、シークレットもそのジョブだけに渡します。投稿の結果は「公開台帳」に記録します。誤公開を防ぐ門を仕組みとして置いたSNS公開パイプラインです。

    「プログラムを書く」ように「自分の言葉と意思決定を届ける」こと。
    設計・実装の詳細は、こちらに整理しました。
