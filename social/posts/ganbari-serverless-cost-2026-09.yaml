    - text: |-
        「がんばりクエスト」の AWS は、認証・DB・CDN・メール・監視・デモ環境まで含めて月 1〜3 ドルで動いています。3 か月の実測で、顧客のリクエストを処理する Lambda・Cognito・Aurora DSQL はすべて無料枠の中で 0 ドルでした。
      external:
        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/serverless-cost
        title: "第Ⅲ部-1　月額 1〜3 ドルで商用運用する ― 実測の内訳と、測るコストが最大の費目"
        description: "毎月の監査 workflow が残した 3 か月の実測を、費目ごとに公開する。"
    - text: |-
        意外なことに、最大の費目は 2 回、測るコストでした。Cost Explorer の API は 1 回 0.01 ドルで無料枠がなく、運営画面が開くたびに問い合わせていました。費用を知りたいなら、月次の監査ログを読む方が安く済みます。
