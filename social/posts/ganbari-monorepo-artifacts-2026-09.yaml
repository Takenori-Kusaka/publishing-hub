        description: "モノレポの判断と、生成物の 5 つの行き先、履歴の書き換え、30MB を 24 回 commit した代償。"
    - text: |-
        いちばん高くついたのは、30MB の再生成物を main に置いたことです。24 版が履歴に積まれ、pack の大半を占めました。証跡のスクリーンショットは orphan ブランチで正しく分けていたのに、グラフには適用しませんでした。行き先は初日に決めるべきでした。
