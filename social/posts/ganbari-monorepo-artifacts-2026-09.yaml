  posts:
    - text: |-
        生成AIはコード以外の生成物も大量に作り、子供の歯みがきや宿題を記録する家庭向けアプリ「がんばりクエスト」を開発した 7 か月で、その行き先は 5 つに分かれました。残すものは本番ブランチ、証跡のスクリーンショットは独立したブランチ、本文に貼る画像は GitHub のプルリクエストです。調査メモは追跡しない一時ディレクトリに置き、不要になれば履歴からも消します。行き先を最初に決めていたわけではなく、事故が 1 つ起きるたびに置き場が 1 つ足されていきました。
      external:
        url: https://zenn.dev/takenori_kusaka/books/ganbari-quest-design/viewer/monorepo-and-artifacts
        title: "第Ⅶ部-1　1 つのリポジトリと生成物の置き場 ― 生成AIが量産するものをどこに置くか"
        description: "1 つのリポジトリにまとめた判断と、生成物の 5 つの行き先、履歴の書き換え、30 MB を 24 回コミットした代償。"
    - text: |-
        最も高くついたのは、30 MB の再生成物であるナレッジグラフを本番ブランチに置いたことです。24 版が履歴に積まれ、リポジトリの圧縮済みのデータ 916 MiB の大半を占めました。スクリーンショットの証跡は独立したブランチで正しく分けていたのに、同じ形をグラフには適用せず、置き場は初日に決めるべきでした。
