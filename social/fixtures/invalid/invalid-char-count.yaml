    - text: |-
        このBlueskyのテキストは300文字（あるいは300グラフェムクラスター）を大幅に超過するように設計されたエラーテスト用のフィクスチャです。通常の上限値である300文字を超えて長文を書き連ねることによって、自動バリデーションのR7・graphemeチェックで確実に検知されてエラーとなる必要があります。同じ文字をただ繰り返すだけでなく、このように現実的な文章を極めて長く引き延ばすことで、パーサーが文字数超過を大外にトラップし、誤った状態でAPIにリクエストが送信されてしまう事態を未然に、かつ完全に防ぐことができるのです。文字数チェックはシステム全体の最も堅牢であるべき防衛線の1つです。さらに、この追加テキストにより、文字数は完全に300文字の上限を突破することになり、ユニットテストが期待通りに不合格となります。
