    - text: |-
        技術のギャップは、モデルの進化とともに時間の経過が自然と解決します。一方で、組織やプロセスのギャップは、人間が能動的に設計し直さなければ埋まりません。(2/3)
    - text: |-
        例えば「決定権限の一意性」「稟議による責任分散の解消」「暗黙知の明文化」など、組織に根ざす不確実性は、AIがどれだけ賢くなってもそのまま残る本質的課題です。(3/3)
