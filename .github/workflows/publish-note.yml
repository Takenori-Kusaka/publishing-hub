# note 自動投入ワークフロー
#
# 契機:
#   - push(main の platforms/note/public/**): このコミット範囲でファイルが変わり、変更後の status が
#     ready か published の原稿を投稿する(scripts/note-targets.mjs)。マージで変わった原稿は自動で反映される。
#     ファイルが変わっていない原稿は対象にしない(ready のまま残っている原稿を毎回投稿しないため)。
#   - 手動実行: main で起動したときだけ動き、指定した原稿が ready か published なら投稿する(失敗の後のやり直しなど)。
#     main 以外のブランチから起動すると、最初のジョブで止まる(公開は main からだけ行う)。
#
# ready は、台帳(platforms/note/ledger.json)に投稿の記録があれば既存の投稿の更新、無ければ新規の投稿になる。
# published は、台帳に記録があるときだけ既存の投稿を更新し、無ければ投稿せずに止まる(台帳の外の投稿を重複して作らないため)。
# どちらも、内容の指紋が前回と同じなら何もしない。この判断には、投稿の直前に origin/main から読んだ最新の台帳を使う
# (待っていた実行の作業ツリーの台帳には、先の実行が書き戻した記録が無いことがある)。
#
# 投稿の前に、原稿の検査(check:note / lint:note)とビルドを通し、status と publish_after の gate を
# スクリプト側(scripts/publish-note.mjs)でも二重に確認します。draft と retired は投稿されません。
# ready はブランチ上で誰が立ててもよく、main へのマージが承認です(AGENTS.md 1 章)。投稿後は status を published に変えてください。
#
# Environment note-production に Required reviewers を設定すると、投稿の直前に承認を挟めます。

name: publish-note

on:
  push:
    branches:
      - main
    paths:
      - "platforms/note/public/**"
  workflow_dispatch:
    inputs:
      post_id:
        description: "noteへ投入する投稿ID(platforms/note/public/<id>.md)"
        required: true
        default: "multi-platform-publishing-architecture"
        type: string
      runner:
        description: "実行環境 (noteのクラウドIP制限を回避するため self-hosted を推奨します)"
        required: true
        default: "self-hosted"
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: write # 投稿後に platforms/note/ledger.json(投稿の対応表)を書き戻すため

# 実行は 1 つずつ動かす。queue: max で、待っている実行を取り消さずに残す(既定の single では、待ちは 1 つだけで、
# 新しい実行が待っている実行を取り消す。取り消された push で変わった原稿は反映されなかった)。待ちは 100 まで。
concurrency:
  group: publish-note
  cancel-in-progress: false
  queue: max

jobs:
  targets:
    name: Decide which manuscripts to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.pick.outputs.ids }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      # 公開は main からだけ行う。push の契機は main だけで、手動の起動もここで main 以外を止める。
      # 手動の起動では、GitHub は起動したブランチにあるこのファイルを使う。この段を含まないブランチから起動すれば、ここは効かない。
      - name: Refuse to run from a branch other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::publish-note は main からだけ動きます(起動した ref: $REF)。原稿をマージしてから、main で起動してください。"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick changed manuscripts whose status is ready or published
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          POST_ID: ${{ github.event.inputs.post_id }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ids=$(node scripts/note-targets.mjs --post-id "$POST_ID")
          else
            ids=$(node scripts/note-targets.mjs --before "$BEFORE" --after "$AFTER")
          fi
          count=$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')
          json=$(printf '%s\n' "$ids" | sed '/^$/d' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.stringify(s.split(/\r?\n/).filter(Boolean))))")
          echo "ids=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "### 📝 publish-note" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" = "0" ]; then
            echo "投稿対象の原稿はありません(変わった原稿のうち status が ready か published のものがない、または指定の原稿が ready でも published でもない)。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "投稿対象: $json" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-note:
    name: Publish or update the manuscript on note
    needs: targets
    if: needs.targets.outputs.count != '0'
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    environment: note-production
    timeout-minutes: 20
    strategy:
      matrix:
        post_id: ${{ fromJson(needs.targets.outputs.ids) }}
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成AIの開示の検査が、原稿のコミットの共著記録(Co-Authored-By)を読むため

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        if: github.event.inputs.runner == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium

      - name: Human review of AI-authored changes (Reviewed-by)
        run: node scripts/lint/check-human-review.mjs --channel note --post-id ${{ matrix.post_id }}

      # 自己ホストの Windows ランナーは Windows PowerShell で、`&&` を文の区切りとして解釈しない。2 段に分ける。
      - name: Check note structure
        run: node scripts/lint/check-note.mjs --strict

      - name: Lint note (textlint)
        run: npm run lint:note

      - name: Build Clean HTML and Assets
        env:
          POST_ID: ${{ matrix.post_id }}
        run: |
          node -e "require('node:child_process').execFileSync(process.execPath, ['scripts/build-note.mjs', process.env.POST_ID], { stdio: 'inherit' })"

      - name: Run Playwright Publisher (status and publish_after gates are enforced in the script)
        env:
          POST_ID: ${{ matrix.post_id }}
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
        run: |
          node -e "require('node:child_process').execFileSync(process.execPath, ['scripts/publish-note.mjs', process.env.POST_ID], { stdio: 'inherit' })"

      # 投稿後に、原稿 id → note の投稿の対応表(台帳)を、main の最新の台帳に重ねて書き戻す。次回はこれを見て同じ投稿を更新し、重複を作らない。
      # 書き戻しの失敗ではジョブを赤にしない(終了コード 0)。作業ツリーが main の履歴に無いときだけ、書き戻さずに終了コード 1。
      - name: Commit note ledger
        if: always()
        run: node scripts/note-commit-ledger.mjs

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-publish-screenshots-${{ matrix.post_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
