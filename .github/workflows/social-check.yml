# PR時および手動実行時のSNS原稿・自動検査
#
# このワークフローは読み取り専用権限で動き、機密情報（Secrets）には一切アクセスしません。
# 投稿原稿のスキーマ・意味検査・編集規則(docs/social-editorial-guide.md)、本文の校正、
# 媒体間の非対称(正本への導線)、ユニットテスト、およびプレビューMDの生成を行います。

name: social-check

on:
  pull_request:
    paths:
      - "social/**"
      - "scripts/social/**"
      - "scripts/lint/**"
      - "lint/**"
      - "test/social/**"
      - "test/lint/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/social-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  social-check:
    name: Validate and Test Social Posts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Schema, Semantic and Editorial Validations
        run: npm run social:validate

      - name: Lint post texts (social textlint profile)
        run: npm run lint:social

      - name: Check canonical links across variants
        run: npm run check:variants

      - name: Run Social Unit Tests
        id: tests
        run: |
          npm run social:test 2>&1 | tee .tmp-social-test.log
          rc="${PIPESTATUS[0]}"
          pass=$(grep -E '^# pass ' .tmp-social-test.log | awk '{print $3}')
          fail=$(grep -E '^# fail ' .tmp-social-test.log | awk '{print $3}')
          echo "pass=${pass:-0}" >> "$GITHUB_OUTPUT"
          echo "fail=${fail:-0}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Generate Redacted Previews
        run: |
          mkdir -p .tmp/social-previews
          npm run social:render -- --output .tmp/social-previews

      - name: Upload Redacted Previews as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-markdown-previews
          path: .tmp/social-previews/
          retention-days: 14

      - name: Output Summary
        if: always()
        run: |
          {
            echo "### 🦋 SNS Publishing Hub - Verification Report"
            echo "- Job status: ${{ job.status }}"
            echo "- Unit tests: ${{ steps.tests.outputs.pass || '0' }} passed, ${{ steps.tests.outputs.fail || '0' }} failed"
            echo "- Redacted Markdown previews were uploaded as the \`social-markdown-previews\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
