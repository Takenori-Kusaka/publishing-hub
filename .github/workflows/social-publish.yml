# SNS 投稿公開・台帳記録ワークフロー
#
# このワークフローは手動実行（workflow_dispatch）でのみ起動します。起動は main へのマージの後に行い、人でも AI でもかまいません(AGENTS.md 1 章)。
# 人だけが通せる門は main への PR のマージです。原稿の campaign.publish_after は投稿を止めないので、予定日を守るのは起動する側です。
# main で起動したときだけ動き、指定した source_sha が main に含まれなければ投稿の前に止まります(公開は main からだけ行う)。
# 誤公開防止のために、確認ワード（PUBLISH）の入力を要求します。承認は PR のマージです。
# GitHub Environment `social-production` は Secrets の置き場で、Required reviewers は置いていません。

name: social-publish

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "パブリッシュする投稿ID (例: pit-in-structure-2026-09)"
        required: true
        type: string
      platform:
        description: "配信先プラットフォーム"
        required: true
        type: choice
        options:
          - both
          - linkedin
          - bluesky
      source_sha:
        description: "status: ready の原稿を含む main のコミットの SHA（40 桁）。原稿の revision の値ではない（revision は ready にする前のコミットを指すことがある）"
        required: true
        type: string
      confirm:
        description: "誤投稿防止用: 'PUBLISH' と完全一致で入力してください"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: social-publish-${{ github.event.inputs.platform }}-${{ github.event.inputs.post_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify Post Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify confirmation keyword
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PUBLISH" ]; then
            echo "❌ ERROR: Confirmation word mismatch. Aborting."
            exit 1
          fi

      # 公開は main からだけ行う。main 以外のブランチから起動したら、ここで止める。
      # 手動の起動では、GitHub は起動したブランチにあるこのファイルを使う。この段を含まないブランチから起動すれば、ここは効かない。
      - name: Refuse to run from a branch other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::social-publish は main からだけ動きます(起動した ref: $REF)。main で起動し直してください。"
            exit 1
          fi

      # source_sha は 40 桁の SHA に限る。ブランチの名前を渡すと、main に含まれるかを確かめた時と、取り出して投稿する時とで指す先がずれうる。
      - name: Verify source_sha is a full commit SHA
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha は 40 桁の 16 進数(コミットの SHA)で指定してください(入力: $SOURCE_SHA)。"
            exit 1
          fi

      - name: Checkout specific source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          fetch-depth: 0

      # 投稿するコミットは main に含まれていなければならない(マージの前の原稿を公開しない)。
      - name: Verify the source commit is on main
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::source_sha $SOURCE_SHA は main に含まれていません。マージした後の main のコミットを指定してください。"
            exit 1
          fi
          echo "✅ source_sha $SOURCE_SHA is on main."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Human review of the post (Reviewed-by)
        env:
          POST_ID: ${{ github.event.inputs.post_id }}
        run: node scripts/lint/check-human-review.mjs --channel social --post-id "$POST_ID"

      - name: Run Schema and Semantic Validation
        run: |
          # Ensure file exists and is validated correctly in this commit SHA
          npm run social:validate -- --id ${{ github.event.inputs.post_id }}

      - name: Verify Revision SHA match
        run: |
          # Read YAML and check that data.source.revision exists in git history
          node -e "
            import fs from 'node:fs';
            import { execSync } from 'node:child_process';
            import YAML from 'yaml';
            const data = YAML.parse(fs.readFileSync('social/posts/${{ github.event.inputs.post_id }}.yaml', 'utf8'));
            if (data.status !== 'ready') {
              console.error('❌ ERROR: Post status is ' + data.status + ' but must be ready to publish!');
              process.exit(1);
            }
            try {
              execSync('git cat-file -e ' + data.source?.revision);
              console.log('✅ source.revision is a valid commit in git history.');
            } catch (err) {
              console.error('❌ ERROR: source.revision ' + data.source?.revision + ' does not exist in git history!');
              process.exit(1);
            }
            console.log('✅ Validation and SHA constraints verified.');
          "

  publish:
    name: Approve and Publish to SNS
    needs: prepare
    environment: social-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Perform actual publish
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          ALLOW_SOCIAL_PUBLISH: "true"
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          BSKY_IDENTIFIER: ${{ vars.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_SERVICE: ${{ vars.BSKY_SERVICE }}
        run: |
          npm run social:publish -- --id ${{ github.event.inputs.post_id }} --platform ${{ github.event.inputs.platform }} --source-sha ${{ github.event.inputs.source_sha }}

      # 投稿が途中で失敗しても台帳は必ず持ち出す。失敗時に落とすと、
      # 公開できた媒体の記録が残らず、再実行で二重投稿になる(2026-09-16 に LinkedIn で踏んだ)。
      - name: Upload ledger artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-ledgers
          path: social/ledger/
          retention-days: 1

  # 投稿のジョブが動いたときだけ台帳を書く(失敗しても書く)。投稿の前の検査(prepare)で止まったときは
  # 投稿のジョブが skipped になり、台帳の artifact も無い。以前は always() だけで動き、artifact の取得の失敗が
  # 本当の原因(prepare の失敗)を隠した(2026-09-21 の run 35608569535)。
  record:
    name: Record Publishing Results to Ledger
    needs: publish
    runs-on: ubuntu-latest
    if: always() && needs.publish.result != 'skipped'
    steps:
      - name: Download updated ledgers
        uses: actions/download-artifact@v4
        with:
          name: updated-ledgers
          path: social/ledger/

      # 台帳のブランチは、リポジトリを clone した作業ツリーで作る。
      # 以前は remote の無い `git init` だったため push できず、失敗を `|| echo` で飲み込んでいた。
      - name: Checkout the repository for the ledger branch
        uses: actions/checkout@v4
        with:
          path: ledger-repo
          fetch-depth: 0

      - name: Update and push ledger
        working-directory: ledger-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin social-ledger; then
            git fetch origin social-ledger
            git switch social-ledger
          else
            git switch --orphan social-ledger
            git rm -rfq --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p ledger
          cp -r ../social/ledger/* ledger/
          git add ledger/
          if git diff --cached --quiet; then
            echo "No changes to ledger"
          else
            git commit -m "chore(ledger): update social ledger for ${{ github.event.inputs.post_id }} [skip ci]"
            git push origin social-ledger
          fi
