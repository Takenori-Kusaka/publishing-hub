# note 下書き用アセットパッケージ自動生成
#
# mainブランチへのマージ、および手動実行を契機に、note 向けに書き直した原稿
# (platforms/note/public/<id>.md)を、note のインポート規格（WXR）および
# HTML/Plain text/Markdown 形式の配信パッケージとして生成・ステージングします。
#
# 原稿は scripts/lint/check-note.mjs の検査(生コード・図の記法の禁止、正本への導線など)に
# 通らなければビルドされません。push 契機では原稿をすべてビルドし、まとめて Artifact にします。

name: stage-note

on:
  push:
    branches: [main]
    paths:
      - "platforms/note/public/**"
      - "scripts/build-note.mjs"
      - "scripts/lint/**"
      - "lint/**"
  workflow_dispatch:
    inputs:
      post_id:
        description: "note用アセットをビルドする投稿ID(空なら全原稿)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  stage-note:
    name: Build note Import Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成AIの開示の検査が、原稿のコミットの共著記録(Co-Authored-By)を読むため

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check note manuscripts
        run: node scripts/lint/check-note.mjs --strict && npm run lint:note

      - name: Build packages
        env:
          POST_ID: ${{ github.event.inputs.post_id }}
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const one = (process.env.POST_ID || '').trim();
            if (one && !/^[a-z0-9][a-z0-9-]{2,79}$/.test(one)) { console.error('invalid post id'); process.exit(1); }
            const ids = one ? [one] : fs.readdirSync('platforms/note/public').filter((f) => f.endsWith('.md') && f !== 'README.md').map((f) => path.basename(f, '.md'));
            if (!ids.length) { console.log('note の原稿がありません'); process.exit(0); }
            for (const id of ids) execFileSync(process.execPath, ['scripts/build-note.mjs', id], { stdio: 'inherit' });
          "

      - name: Upload note Packages as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-publish-packages
          path: platforms/note/exports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Output Summary
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const lines = ['### 📝 note Stage Packages', '', 'Artifact \`note-publish-packages\` に各原稿の import.wxr / article.html / article.md / article.txt / manifest.json が入っています。', ''];
            const dir = 'platforms/note/exports';
            if (fs.existsSync(dir)) for (const id of fs.readdirSync(dir)) {
              const m = path.join(dir, id, 'manifest.json');
              if (!fs.existsSync(m)) continue;
              const j = JSON.parse(fs.readFileSync(m, 'utf8'));
              lines.push('#### ' + id + ' (status: ' + j.status + ')', '', '\`\`\`json', JSON.stringify({ title: j.title, source: j.source, canonical_url: j.canonical_url, date: j.date, checks: j.checks, warnings: j.warnings }, null, 2), '\`\`\`', '');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
