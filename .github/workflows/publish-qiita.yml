# Qiita 記事自動同期ワークフロー
#
# mainブランチの platforms/qiita 配下の記事変更、および手動実行を契機に、
# 公式 Qiita CLI を使用して、Qiita上の記事と同期（パブリッシュ）します。
# 手動実行は main で起動したときだけ動き、main 以外のブランチから起動すると最初のジョブで止まります(公開は main からだけ行う)。
#
# 同期は公式の Qiita CLI(@qiita/qiita-cli)で行い、同期で付いた id と updated_at は
# scripts/qiita-commit-sync.mjs が main の最新に載せ直して書き戻します(拒まれたらやり直します)。
# 同期が途中で失敗しても書き戻します(そこまでに作った記事の id を main に残すため)。
#
# 同期の前に Qiita バリアントの検査(校正・レシピの要件・正本への導線・複数称)を通します。
# 検査は Qiita の記事だけを対象にし、note や本の問題では止まりません。
# 記事は公開で作ります。private: false の未同期(id なし)の記事は、マージ後の最初の同期で公開の状態で作られます
# (オーナーの決定(2026-09-22)で Q10 を外した。lint/policies/qiita.json の publish_gate.unsynced_must_be_private)。
# 公開のスイッチ(private: false)はブランチ上で誰が立ててもよく、main へのマージが承認です(AGENTS.md 1 章)。
# lint/derive/review-policy.json の mode が human のときは、公開記事の本文が変わったあとに人の確認(Reviewed-by トレーラー)の記録がないと同期しません(H1)。

name: publish-qiita

on:
  push:
    branches:
      - main
    paths:
      - "platforms/qiita/**"
  workflow_dispatch:

permissions:
  contents: write

# 実行は 1 つずつ動かし、待っている実行を取り消さない(queue: max。待ちは 100 まで)。
# 先の実行が新しく作った記事の id を main へ書き戻してから、次の実行が同期するため(書き戻しの前に同期すると、同じ記事をもう一度作る)。
concurrency:
  group: publish-qiita
  cancel-in-progress: false
  queue: max

jobs:
  check:
    name: Gate — Qiita variant checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      # 公開は main からだけ行う。push の契機は main だけで、手動の起動もここで main 以外を止める。
      # 手動の起動では、GitHub は起動したブランチにあるこのファイルを使う。この段を含まないブランチから起動すれば、ここは効かない。
      - name: Refuse to run from a branch other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::publish-qiita は main からだけ動きます(起動した ref: $REF)。記事をマージしてから、main で起動してください。"
            exit 1
          fi

      # 起動したコミットではなく、その時点の最新の main を検査する(先の実行が書き戻した id を含めるため)。
      - name: Checkout the latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 生成AIの開示の検査が、原稿のコミットの共著記録(Co-Authored-By)を読むため

      - name: Record the checked commit
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Human review of AI-authored changes (Reviewed-by)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ steps.main.outputs.sha }}
        run: node scripts/lint/check-human-review.mjs --channel qiita --before "$BEFORE" --after "$AFTER"

      - name: Qiita textlint profile
        run: npm run lint:qiita

      - name: Qiita structure (recipe requirements, publish gate)
        run: node scripts/lint/check-qiita.mjs --strict

      - name: Canonical links and duplicate ratio against the Zenn source (Qiita only)
        run: node scripts/lint/check-variants.mjs --channel qiita --strict

      - name: Japanese character set and pronoun rules (Qiita only)
        run: node scripts/check-japanese.mjs --qiita

  publish:
    name: Sync Articles with Qiita
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ブランチ main を取り出す(同期の後に、新しく作った記事の id を main へ書き戻すため)。
      - name: Checkout the latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 検査した後に main の platforms/qiita が変わっていたら、この実行では同期しない(検査していない内容を同期しない)。
      # その変更の push で動く実行が、検査してから同期する。
      - name: Sync only what was checked
        id: same
        env:
          CHECKED: ${{ needs.check.outputs.sha }}
        run: |
          if git diff --quiet "$CHECKED" HEAD -- platforms/qiita; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::検査の後に main の platforms/qiita が変わりました(検査 $CHECKED、今 $(git rev-parse HEAD))。この実行では同期せず、その変更で動く実行に任せます。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        if: steps.same.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.same.outputs.ok == 'true'
        run: npm ci

      # 公式の Qiita CLI(devDependencies の @qiita/qiita-cli)で同期する。
      # 以前使っていたアクション(increments/qiita-cli/actions/publish@v1)は、同期のあとに id を git push で
      # 書き戻し、拒まれるとやり直さずに失敗した。CLI は同期だけを行い、書き戻しは次の段が行う。
      - name: Publish and Sync with Qiita
        if: steps.same.outputs.ok == 'true'
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: npx qiita publish --all --root platforms/qiita

      # 新しく作った記事の id と、同期した記事の updated_at を main へ書き戻す。
      # 同期のあいだに main が進んでいたら、最新の main に載せ直して push する(scripts/qiita-commit-sync.mjs)。
      # always() を付ける理由: qiita publish --all は記事を 1 本ずつ同期し、途中で失敗しても、
      # そこまでに Qiita へ作った記事の id を原稿のファイルへ書いている。ここを飛ばすとその id が
      # main に残らず、次の同期が同じ記事をもう一度作る。書き戻す変更が無ければ終了コード 0 で抜ける。
      - name: Write the ids back to main
        if: always() && steps.same.outputs.ok == 'true'
        run: node scripts/qiita-commit-sync.mjs
