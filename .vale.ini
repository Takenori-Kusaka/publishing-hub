# Vale の試験導入(issue #79)。CI だけで動かし、警告にとどめる(docs/linting.md §「Vale の試験導入」)。
# 日本語の校正は textlint が担う。Vale には、製品名の大小文字のような、言語に依らない語彙の規則だけを置く。
StylesPath = .vale/styles
MinAlertLevel = warning


[{articles,books,platforms/qiita/public,platforms/note/public}/**/*.md]
BasedOnStyles = Kusaka
# 本文に裸で書いた URL(github.com、*.github.io)を製品名と誤認しない
TokenIgnores = (https?://[^\s)>\]]+), ([A-Za-z0-9-]+\.github\.io[^\s)>\]]*)
