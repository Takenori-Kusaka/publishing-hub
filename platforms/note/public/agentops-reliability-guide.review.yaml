cold_read:
  first_lines_given: 10
  subject_identified: AIエージェントに業務操作を任せるとき、プロンプトの指示ではなく仕組みで危険な操作を止める設計
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: 社内文書を検索して答える RAG の改善を調べてきました
      why: RAG が略語のまま。「社内文書を検索して答える」という説明が前に付いているので仕組みのおおよそは分かるが、略語の展開は無い（退ける候補）
    - quote: コードフリーズの指示があったのに本番のデータベースを削除しました
      why: プログラムを書かない読者には「コードフリーズ」が何を禁止する指示なのか分からない。事故の深刻さ（何を破ったのか）が伝わりにくい
    - quote: 権限の分離、削除の遅延、ロールバックといった構造です
      why: 「削除の遅延」「ロールバック」が説明なしに並ぶ。具体的に何をする仕組みなのか、管理職として誰に何を指示すればよいのかが分からない
    - quote: その利用者に権限があるかを決定的に判定します
      why: 「決定的に」が技術用語（同じ入力なら必ず同じ結果）なのか、「確実に」の意味なのか判断できない
    - quote: "## 注入は防ぎきれない前提で"
      why: 「注入」が何を何に注入するのか、本文に定義が無い。続く段落のメールや Web フォームの例から「外部の文章でエージェントを騙すこと」と推測するしかない
  bounce_points:
    - quote: AIエージェントを任されたテックリードが最初に分けるべきもの
      why: 題が「テックリード」向けと明示しており、プログラムを書かない管理職は自分向けではないと判断してタイムラインで読み飛ばす可能性がある
    - quote: 形式と対象と業務の条件を検証し、その利用者に権限があるかを決定的に判定します。必要なら人の承認を取り、そのうえで実行を引き受ける層が代わりに操作します。
      why: 「実行を引き受ける層」など抽象的な仕組みの説明が続き、図も無いので、非エンジニアにはどんな構成なのか像が結べない。ここで読むのをやめたくなる
  figure_only_subject: ""
  next_step_clear: true
  ending_natural: true
  ending_note: 「最初の 1 か月でやること」（成功と禁止事項を担当者と決める、実際の失敗から小さな評価セットを作る、本番の書き込み権限を外す）は本文の主張から自然に出てきて、管理職にも行動に移せる。最後の一文は Zenn の記事とスライドへ誘導するもの。ただし URL が 2 本並ぶだけで、どちらが記事でどちらがスライドかの説明は無く、非エンジニアには Zenn が何かも分からない
