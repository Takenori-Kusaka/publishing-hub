cold_read:
  first_lines_given: 10
  subject_identified: 社内文書を生成AIに答えさせる仕組み(RAG / Advanced RAG)の改善手法を、自社データで1段ずつ実測した事例。チームに検証を指示する立場の人向け
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: Advanced RAG を 8 段階で実測して分かった
      why: タイトルの「Advanced RAG」は本文で一度も定義されない。本文の「素朴な RAG」との対比で推測はできるが、何を指すかは書かれていない。また「8 段階」が本文のどの段に当たるのか数えても確定できない(丸ごと渡す/素朴なRAG/取り込み修正/ハイブリッド/型番の書き込み/見出し付与/表・別冊参照/再ランキング…と、何を1段と数えるか不明)
    - quote: ハイブリッド検索、再ランキング、親子検索、グラフ、エージェント。
      why: 手法名が列挙されるだけで説明がない。ハイブリッド検索は後で説明されるが、再ランキング・親子検索・グラフ・エージェントは最後まで説明されない。特に再ランキングは 44 問に上がった決め手として出てくるのに、何をする手法か分からない
    - quote: 再ランキングまで重ねて 44 問になったあと
      why: 直前の段落までの数字は 38 問(本文タイトル)で止まっており、表・別冊参照は「改善しませんでした」とある。38 から 44 への 6 問の上昇が再ランキング単独によるものか読み取れない
    - quote: 回答に必要な事実が、検索結果の上位 5 件に揃ったかで判定しました。
      why: 「上位 5 件」の「件」が文書なのか断片(500字の塊)なのか、この時点では分からない。後で「500 字ずつに分けて」と出てきて断片だと推測できるが、判定方法としての意味(AIの回答の正しさは見ていないのか)が管理職には掴みにくい
    - quote: 文書の名前を検索対象の見出しに付けたときは、ファイル名を使うと 34 問、本文のタイトルを使うと 38 問でした。
      why: 直前の基準値は 37 問。ファイル名版は 37 から下がった(悪化した)のか、別の基準からの数字なのかが明示されていない。「見出しに付ける」という操作自体も非技術者には具体像がない
    - quote: 表を表ごと読ませる工夫と、別冊の参照をたどる工夫を足しました。
      why: 何をしたのかが抽象的で、どういう処理か想像できない。改善しなかったと書かれているので致命的ではないが、意味は取れなかった
  bounce_points:
    - quote: 逆に、良かれと思って入れた手が裏目に出る場面もありました。
