      reason: 題名の主張は C04 と同じく正本の言い方(暗号が破られたのではない)を言い換えたもの。本文の見出し「暗号は破られていなかった」と揃えるなら、題名側も「暗号を破らずに通るトークン」等、正本の表現の範囲に寄せることを検討する。C04 を直す場合は題名と冒頭節の整合を一緒に確かめる。
