cold_read:
  first_lines_given: 10
  subject_identified: JWT独自クレームの設計方針
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: 2023 年の Storm-0558 では、個人向けアカウントの署名鍵で、企業向けのトークンが偽造されました。
      why: Storm-0558 が何(攻撃者名か事件名か)で、どの会社の製品で起きたのかが書かれていない。また「署名鍵で偽造」がなぜクレームの照合の問題になるのかが、プログラムを書かない読者には結び付かない。
    - quote: 変更できるメールアドレスを利用者のキーにしていたアプリでは、他人のアカウントに入れる問題(nOAuth)が起きました。
      why: 「利用者のキー」が何を指すか(ID のことか、暗号の鍵か)が定義されていない。nOAuth も名前だけで説明がない。
    - quote: ログイン用ではなく API 用のトークンか
      why: トークンにログイン用と API 用の種類があることが、本文のここまでで一度も説明されていない。違いと、取り違えると何が起きるのかが分からない。
    - quote: 社内の業務システムなら、トークンの宛先を絞ることと、利用者の情報が古くなっていないかです。
      why: 「トークンの宛先」の意味(どのサービス向けに発行されたか)が定義されていない。直前の「自分宛てか」と同じ概念なのかも判断できない。
    - quote: 呼び出し先ごとに、その相手宛ての新しいトークンに取り替え、受け取ったトークンをそのまま渡さない。
      why: 誰が、どこでトークンを取り替えるのかが書かれていない。方針として採るときに、どのチームに何を頼めばよいのかが分からない。
    - quote: 入口で各製品のトークンを組織の形に直し
      why: 「入口」がどこ(ゲートウェイか、各サービスか)で、「組織の形に直す」が何をすることなのかが具体的に書かれていない。
    - quote: 3 つのケースごとに、採用するか、採用しないなら何ができなくなるか、いつ見直すかを書いています。
      why: 前の節では題材を「4 つ」と書いている。ここの「3 つのケース」が、汎用の攻撃を除いた SaaS・社内業務システム・AIエージェントの 3 つを指すのかが本文から確かめられない。
    - quote: 実際に動かした認証の製品は Keycloak だけで
      why: Keycloak が何の製品かの説明がない。検証の限界を判断する材料なのに、自社が使う製品と同じ種類かを読者が判断できない。
  bounce_points:
    - quote: 受け取ったトークンについて、署名、発行者、自分宛てか、期限、ログイン用ではなく API 用のトークンか、を確かめてから読みます。
      why: 1 文に 5 つの確認項目が説明なしに並ぶ。マネージャーとしては、これが既に自社でできているのかを誰に聞けば確かめられるのかが分からず、ここで「エンジニアに任せる話」と判断して読むのをやめたくなる。
    - quote: 止めたのは、エージェントのための重点の対策でした。
      why: 続く 2 つの対策が技術的な手段の説明になっており、方針として何を決めればよいかへの言い換えがない。自組織で AI エージェントを使っていない読者には、この節全体が関係ないように見える。
    - quote: クレームが絡む事故を調べると、共通点があります。
      why: 退ける候補。直後の 2 事例は固有名が分からなくても「暗号が破られたのではない」「欠けていたのは設計」という結論が同じ段落で示されるため、読み続ける理由は保たれている。
  figure_only_subject: "図なし(本文に [画像: …] の記載がない)"
