      quote: そこで私は、埋まらない席を隠さず、「未達」として表示し続ける設計にしました。心地よい表示ではありません。それでも、宣言すれば済む形にはしませんでした。宣言が通過儀礼へ変わった瞬間、この仕組み全体が意味を失うと考えたからです。
      status: supported
      source: books/pit-in-process/summary.md
      source_quote: そこで、達成できないゲートを**省略ではなく「未達」として表示し続ける**設計にしました。
      severity: 任意
