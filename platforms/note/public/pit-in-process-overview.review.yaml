cold_read:
  first_lines_given: 3
  subject_identified: 開発プロセスの名づけ
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: 仕様を人が承認し、AI が実装し、機械が検証し、作った本人以外の人が見る。この4つを、機能の単位で短く回す。
      why: 「AI が実装」と「機械が検証」の区別がつかない。AI も機械ではないのか。「機能の単位」が何を指すか、「短く回す」が何を繰り返すのかも説明がない。稟議・決裁と並べて語られる内側の輪の中身が、この一文だけでは把握できなかった。
    - quote: 意見は事前に非同期で集め、判定は一人が名前で引き受ける。
      why: 「非同期」は意味が取れない。会議ではない、という程度の推測はできるが、何をどう集めるのか分からない。また、ここで言う「判定」が何に対する判定なのか(変更か、リリースか、仕様か)が本文のどこにも定義されていない。
    - quote: AI で代わりをさせることも考えましたが、同じモデルを使う限り、分けたつもりの目は同じ知識を共有しています。
      why: 「モデル」が何かの説明がない。AI の種類のことらしいと察するが、同じモデルだとなぜ同じ知識になるのか、別のモデルなら席が埋まるのかが分からない。
    - quote: そこで私は、埋まらない席を隠さず、「未達」として表示し続ける設計にしました。
      why: 「未達」が何の状態を表す語か、どこに(画面か、書類か、一覧か)表示されるのかが書かれていない。「宣言すれば済む形」の宣言が誰による何の宣言かも分からない。
    - quote: このプロセスはまだ参照モデルであり、数値の多くは実測ではなく初期値です。
      why: 「参照モデル」の「モデル」が、二段落前の AI の「モデル」と同じ意味なのか別なのか判断できない。「数値」は本文にひとつも出てこないので、どの数値のことか分からない。「初期値」も未定義。
    - quote: 満たしたかどうかは、判定の記録と、標準から外した項目の宣言で示します。
      why: 「標準」という語がここで初めて出る。本文では「プロセス」「仕組み」「設計」と呼んでいたものが標準なのか、別の文書なのかが分からない。「標準から外した項目」を誰がどう宣言するのかも説明されていない。
  bounce_points:
    - quote: 私は個人でも開発をしていますが、一人と AI の体制では、どうしても埋まらない席が1つあります。
      why: ここまで会社・部門の話として読んできたのに、急に筆者個人の開発の話に切り替わる。部門に導入する側としては、一人体制の話は自分の課題と関係が薄いと感じ、読み飛ばしたくなった。
    - quote: 全体の構造を一枚の図と表で整理したものを、Zenn に置きました。
      why: 「Zenn」が何か分からない。社内文書なのか、外部サイトなのか、誰向けの場所なのかの説明がないため、クリックして良いものか迷う。
  figure_only_subject: ""
  next_step_clear: true
  ending_natural: false
  ending_note: 次の行き先は末尾のリンク一つで、行き先が図と表だと書かれているので迷わない。ただし結びの段落は本文から自然には出てこない。「数値」「初期値」「標準から外した項目」は本文で一度も触れられておらず、名づけの話が突然、精度や規格の話に変わる印象を受けた。最後の一文はリンク先を読ませたいのだと分かるが、「稟議・決裁を壊さない」「判定は一人」という、管理職が持ち帰れる結論を結びで反復していないため、何を決めればよいかは自分で拾う必要がある。
