      source: https://github.com/Takenori-Kusaka/process-compass/blob/main/src/content/docs/adr/0027-process-name-pit-in.md
      source_quote: ピットイン方式と名乗ることは、本標準の要求事項を満たしたことの根拠になりません。適合の主張は、ゲート判定の記録とテーラリングの宣言によります
      severity: 任意
      reason: ADR-0027 と一致する。「テーラリングの宣言」を「標準から外した項目の宣言」と言い換えたのは、the-structure.md の「標準から外した項目を、理由とともに残します」に沿う。
      rule: AGENTS-2.3-2
    - id: C29
      quote: このプロセスはまだ参照モデルであり、数値の多くは実測ではなく初期値です。
      status: supported
      source: books/pit-in-process/summary.md
      source_quote: 本書が紹介するプロセスは**参照モデル**です。そのまま全組織に適用するものではありません。 - 閾値の多くは実測に基づく値ではない。自組織の値で置き換える前提
      severity: 任意
      reason: 正本は「閾値の多くは実測に基づく値ではない」で、「数値の多く」より狭い。「初期値」は the-structure.md の G-5 の表の列名にある。「まだ」は参照モデルを脱する予定があるかのように読め、正本に無い。「閾値」「初期の値」のように寄せる。
