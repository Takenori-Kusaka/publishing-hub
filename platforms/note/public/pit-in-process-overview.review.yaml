      quote: 二十人近い人が、二秒ほどで作業を終える。タイヤ一本に三人がつき、作業を最小の単位に分けて専任を置く。レースそのものは止まらず、決められた場所でだけ人の手が入る。
      severity: 直す
      reason: 本文はですます調なのに、この段落と「けれど、みんなで決める形は、誰も決めていない状態を作りやすい。承認欄に印は並ぶのに、結果を引き受ける人の名前が見えない。」「その外側の輪はそのままにして、内側の輪だけを AI の速さに合わせて作り替える。…この4つを、機能の単位で短く回す。」「意見は事前に非同期で集め、判定は一人が名前で引き受ける。」が常体で、同じ段落の中で敬体と常体が混ざる。意図した緩急なら段落単位で揃える。「何を作るかを決めること。…外に出すこと。」の体言止めは問題ない。
      rule: textlint no-mix-dearu-desumasu
    - id: F02
      quote: AI 時代の開発は、よく「AI が自律的に作り、人は意思決定だけを行う」と語られます。
      severity: 直す
      reason: 正本の「」の引用(summary.md「AI が自律的に開発し、人間は意思決定だけを行う。」)を「作り」「人は」へ書き換えている。C07 と同じ。
      rule: V11
    - id: F03
      quote: 「AI が書いたので分かりません」が通ってしまいます。
      severity: 直す
      reason: 正本に無い文句を「」で括り、正本の引用に見える。正本の「AI が勝手にやった」(japanese-organizations.md)へ置き換える。C21 と同じ。
      rule: V11 / AGENTS-1.3
    - id: F04
      quote: 意見は事前に非同期で集め、判定は一人が名前で引き受ける。
      severity: 直す
      reason: 「非同期」はプログラムを書かない管理職には通じにくい実装の語。lint/policies/note.json の jargon パターンには無いが、N11 の趣旨(note の読者に通じない語は言い換える)に当たる。「会議を開かず、事前に文書で集め」のように言い換える。同様に「同じモデルを使う限り」の「モデル」も、AI のモデルだと分かる語(「同じ AI を使う限り」など)にする。ゲート記号(G-6 など)は原稿に出ていない。
      rule: N11
    - id: F05
      quote: 読む側は、読み切れない量を前にして、だんだんと「読んだことにして承認する」ほうへ流れていきます。
      severity: 任意
      reason: 「」の中は正本に無い言い回し。意味は正本の「実質的な承認操作へ縮退」と同じだが、「」が引用に見える。「」を外すか正本の「レビュー済み」を使う。
      rule: V11
    - id: F06
      quote: 二十人近い人が、二秒ほどで作業を終える。タイヤ一本に三人がつき
      severity: 直す
      reason: 数の表記が揺れている。この段落と「一人が単独で」は漢数字、「この4つを」「2つの輪」「もう1つ」「席が1つ」は算用数字。媒体内で片方に揃える(正本の本・記事は算用数字)。
      rule: AGENTS-2.0 用語統一
    - id: F07
      quote: 全体の構造を一枚の図と表で整理したものを、Zenn に置きました。
      severity: 直す
      reason: "導線先の正本 articles/pit-in-process-overview.md は frontmatter が published: false で、まだ Zenn に置かれていない。note の publish_after(2026-10-20)より前に Zenn 側の公開スイッチが main に入ることを公開手順で確かめる。順序が逆になると、本文の唯一の正本への導線(N の canonical 要件)が切れる。"
      rule: AGENTS-2.0 note canonical
    - id: F08
      quote: 正直に書いておきたいことがあります。
      severity: 任意
      reason: 本文そのものについて語るメタ談話。「最後に、名づけた本人として書いておきます。」も同じ。expressions.json のパターンには当たらず、正本も「正直に書きます」と書いているので、継承としては許容。削っても意味は変わらない。
      rule: expressions.metadiscourse
    - id: F09
      quote: 設計で最初に決めたのは、既存の稟議や決裁の制度を壊さないことでした。
      severity: 任意
      reason: 「最初に決めた」「迷った末に」「ずっと違和感を」「変えると導入が止まります」は、決定の順序・経緯・因果で正本に無い。2.0 は note を意思決定の物語と定める一方、2.3 手順 2 は体験談を削ると定める。どこまでを物語の装飾として許すかは取りまとめ役が決め、採否表に根拠を残す。
      rule: AGENTS-2.3-2
    - id: F10
      quote: 数値の多くは実測ではなく初期値です。
      severity: 任意
      reason: 但し書きは原稿全体でこの 1 回だけで、N13(但し書きの定型文の繰り返し)には当たらない。煽り(絶対・革命・100%・爆速・行動の強要)も、複数称・組織称(私たち・弊社)も原稿に無い。候補として検査し、退けた。
      rule: N13
