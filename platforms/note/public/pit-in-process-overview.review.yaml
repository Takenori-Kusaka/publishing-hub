  (3) 正本の「」の引用(「AI が自律的に開発し、人間は意思決定だけを行う」)を言い換えて引用し、正本に無い「」の文句(「AI が書いたので分かりません」)を正本の引用のように置いたため、引用元を探した読者が見つけられない。また本文の末尾で「Zenn に置きました」と書いたが、正本の Zenn 記事は published: false のままで、公開順序を誤ると導線が切れる。
