      reason: 「人は決めるだけ」という語り方への評価が、正本より弱い。フェーズ2総括は「理想像は「人は決めるだけ」と語りますが、技術の現実はむしろ逆でした。」と書き、概要記事も「しかし技術の現実は逆です」と書く。原稿は一人称の違和感として書いているが、「間違っていない」と言い切ると正本の「逆」と向きが食い違う。この1文を外すか、「語られていない部分のほうが大きい」という趣旨だけを残す。
      rule: AGENTS-2.3-2
    - id: F02
      quote: できたものを検証したと説明する責任。
      severity: 任意
      reason: 正本は「検証の能力(個人)」と「説明責任の一意性(組織)」を別の項目として挙げる。原稿は2つを1つの句にまとめており、正本に無い項目(検証したと説明する責任)に見える。「できたものを検証すること。説明の責任を一人に定めること。」のように分けると正本と対応する。
      rule: AGENTS-2.3-2
    - id: F03
      quote: 「単独の判定と、事前の文書でのコメント」
      severity: 任意
      reason: 鉤括弧で囲んでいるため標準からの引用に見えるが、正本の語は「単独判定+事前の非同期コメント」。意味は変わらない。鉤括弧を外すか、正本の語に合わせる。
      rule: AGENTS-2.3-2
    - id: F04
      quote: この仕組みは標準の文書としてまとめていますが
      severity: 任意
      reason: 本文から標準本文(Process Compass の GitHub Pages)への導線が無く、行き先は概要記事だけ。概要記事は「正本は Process Compass の標準本文です」と明記している。事実の誤りではないが、正本の所在を1行足すと、概要記事を正本と読まれない。
      rule: AGENTS-2.3-2
