cold_read:
  first_lines_given: 10
  subject_identified: 新任テックリーダー向けの、大規模サービス全体の設計の考え方をまとめたスライドと、その実測(スライドの名前、参考にした本の名前、手法名は冒頭 10 行に書かれていないので言えない)
