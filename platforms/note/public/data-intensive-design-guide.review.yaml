      why: 「参考にした本」の書名も著者も、全文のどこにも書かれていない。後の段落で「本の章立てをなぞることは選びませんでした」「本は地図として使い」と続くが、どの本かを知らない読者には、何をなぞらなかったのかが確かめられない。
    - quote: 何をどの数字で約束するのか。
      why: 誰が誰に何を約束するのか(利用者への応答の速さか、社内の取り決めか)が書かれていない。「数字」の例が 1 つもなく、プログラムを書かない読者には何の問いかが分からない。
    - quote: よくある素朴な作り、どの組織でも外せない基準を入れた作り、さらに題材ごとの重点を足した作りの 3 つを並べます。
      why: 「基準」と「重点」が何を指すのか(対策の集まりのことか、規格のことか)が定義されていない。次の段落の「基準が異常を減らし」もこの語に頼っている。「題材」もここが初出で、何が題材なのかが書かれていない。
    - quote: 同じ処理の中で送信用の表に書いてから運ぶ作りでは、この入れ替わりは、試した範囲では 0 件でした。
      why: 「送信用の表」が何で、誰がどこへ「運ぶ」のかが説明されていない。直前の「データベースと別のシステムの両方へ順に書く」との違いが、仕組みを知らない読者には読み取れない。
    - quote: 控えの機械への反映を待ってから応答する設定にすると、経路が切れた後に応答した書き込みを失うことは、試した範囲ではありませんでした。
      why: 「控えの機械」「経路が切れた」が何と何の間の話かが書かれていない。「経路が切れた後に応答した書き込みを失うことは…ありませんでした」は修飾が長く、何が起きなかったのかを 1 回で読み取れない。
    - quote: 新旧のデータの置き場を並べて切り替える、手堅いはずの手順での出来事です。
      why: どんな手順なのか、起きた「異常」が何だったのか(データが消えたのか、食い違ったのか)が書かれていない。「1 件起きていました」の重さを読者が判断できない。
    - quote: こうした入れ替わりは、4 つの題材を合わせて 21 組ありました。
      why: 「4 つの題材」が何なのかが全文のどこにも並んでいない。「組」が何と何の組なのか、全部で何組のうちの 21 組なのかも書かれておらず、21 が多いのか少ないのかが分からない。
    - quote: 照らし合わせた記述のうち、無条件に食い違ったと判定したものはありませんでした。
      why: 「無条件に食い違った」が何を意味するのか(条件つきで食い違ったものはあるのか)が、次の文を読むまで分からない。照らし合わせた記述が何件で、条件を足したものが何件かも書かれていない(続く例は 2 つだが、全部で 2 つかは確かめられない)。
    - quote: 読み取りの間隔を縮めると遅れは縮みましたが、試した範囲では大小は入れ替わりませんでした。
      why: 「大小」が何と何の大小なのかが文中に書かれていない。前の文の「素朴な運び方より遅れました」との比較だと推測はできるが、確かめられない。また「すぐ下流へ流せる…仕組み」の名前も説明もなく、「下流」も定義されていない。
    - quote: 間に中継を置けば下流が止まっても記録はたまる、という記述です。
      why: 「中継」が何で、何と何の間に置くのかが書かれていない。続く「読む側」が「下流」と同じものかも判断できない。
    - quote: 直した内容は、直した担当とは別の目でもう一度、結果の記録と突き合わせています。
      why: ここまで主語はずっと「私」だったのに、「直した担当」と「別の目」が突然出てくる。直したのは筆者なのか、別の人なのか、生成AIなのかが本文から確かめられない。
    - quote: 自分のシステムで使う前に、自分の版と設定で確かめてください。
      why: 「版」が何の版(ソフトウェアのバージョンのことか)かが書かれていない。プログラムを書かない管理職が自分で確かめるのか、誰かに頼むのかも分からない。
  bounce_points:
    - quote: たとえば、データベースと別のシステムの両方へ順に書く素朴な作りは、障害を入れなくても、届く順序が入れ替わりました。
      why: ここから 2 段落にわたって、仕組みの説明のない技術の例(順に書く作り、送信用の表、控えの機械、経路が切れる)が続く。段落の結論(「失わない設定は、別の止まり方を連れてきます。どちらを受け入れるかは、設計する人が選ぶことです。」)は段落の最後にしかなく、そこに着くまで、管理職の読者には自分に関係する話かどうかが判断できない。
    - quote: 1 つは、データベースの変更をすぐ下流へ流せる、と書いた仕組みです。
      why: 節「実測で、スライドのほうを直した」の 2 つの例は、スライドを見ていない読者には元の記述が分からないまま、その直し方だけを読むことになる。前の節で題の「0 件でした」の話は結論(書き方の規則、人の報告の聞き方)まで出ているため、ここで読み終えたと判断しやすい。
    - quote: そこで、コードの設計より先に、データの持ち方と流し方を決める順番にしました。
      why: 題は「0 件でした」を信じない話なのに、この節まで「0 件」は 1 度も出てこない。題から来た読者は、4 つ目の見出し(「0 件でした」が、次の実行で 1 件になった)まで題の中身に着かない。1 つ目の節の終わりに「この記事では、その過程で私が下した判断を 3 つ書きます。」とあるので順番の予告はあるが、どれが題の話かはそこでは示されていない。
    - quote: この規則は、人の報告を聞くときにも使えます。
      why: 退ける候補。技術の話から管理の話へ切り替わる箇所だが、直後に「何回試したのか、流し直したのかを一緒に聞く」と、プログラムを書かない読者がそのまま使える行動が書かれており、読み続ける理由になっている。
    - quote: こうした問いを 9 つのステップとして並べました。
      why: 退ける候補。9 つのうち本文に出るのは 4 つの問いだけだが、直前に問いの例が 4 つ並んでおり、残りは結びで「9 つのステップの中身…は、技術記事にまとめています」と行き先が示されている。
  figure_only_subject: "図なし(本文に [画像: …] の記載がない)"
  next_step_clear: true
  ending_natural: true
  ending_note: 結びの節「持ち帰ってほしいのは、数字ではなく条件」は、実測の限界を述べたうえで「この条件で、これが起きた、または起きなかった、という文」を持ち帰るように求めており、3 つ目の判断(0 件には回数を添える、「防げる」と書かない)から自然に出てくる。最後の文(リンクを除く)は「9 つのステップの中身、題材ごとの結果と条件、一覧表の使い方は、技術記事にまとめています。」で、読者を Zenn の技術記事へ送る。確かめられた点は 3 つ。(1) 行き先が 3 つ(技術記事、ガイドのスライド、ケーススタディのスライド)並び、プログラムを書かない読者がまずどれを開くべきかは書かれていない。「ガイド」「ケーススタディ」という呼び名は本文に 1 度も出ず、リンクの見出しで初めて現れる(本文では「スライド」と「実測」)。(2) 「問いを 1 行ずつ並べた一覧表」は結びで初めて出てくる。空欄のまま「配っています」とあるが、どのリンクで手に入るのかは書かれていない(使い方が技術記事にある、としか読めない)。(3) 題は「大規模サービスの設計ガイド」だが、結びでは「規模は小さく」と書かれている。大規模なのはガイドの対象で、小さいのは実測の規模だと読めるが、その区別は本文に明記されていない。
