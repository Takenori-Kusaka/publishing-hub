premortem: |
  (1) 正本に無い説明を物語のつなぎとして足している(基準を「どの組織でも外せない」とする性格づけ、測ると決めた時期を「公開した後」とする時系列、費用を数える理由)。正本と公開リポジトリで裏が取れず、訂正の原因になる。
  (2) 数字を落として言い換えた文が、正本の条件を落として強くなっている(同期スタンバイ停止の「観測の時間の間は」、追加実験 A-P1 の「1 回だけ流した」、CDC の「読み取りの間隔を指定しない」)。題が「0 件をそのまま信じない」なので、条件の欠落は記事の主張そのものと食い違う。
  (3) 「」で括った語が正本の「」の引用と一致しない(「5 試行で 0 件だった」を「5 回試して 0 件だった」に変えている)。また、N の構成を指す「素朴」を、基準(B)のポーリングにも使っており、構成の呼び名が正本と入れ替わって読まれる。
