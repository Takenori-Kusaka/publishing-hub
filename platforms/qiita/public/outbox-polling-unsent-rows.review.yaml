  unintelligible:
    - quote: 連番の続きだけ読む:応答済みなのに索引に効果なし
      why: 「索引」がここで初めて出て、本文のどこにも定義が無い。受け手が何で、何を何に書き込むもの(検索用の索引なのか、DB のインデックスなのか)かが分からない。後段の「通知は、失われたまま戻りません。」の「通知」も同じで、受け手が索引と通知の 2 種類あるらしいことは「読み飛ばしたイベントの残り方は、受け手で違いました。」から推測するしかない。構成(書き手・運び手・ブローカー・受け手が何か)を述べた文が無い。
    - quote: 数は「1 回目・2 回目」の順で、かっこの中は、1 件以上起きた試行の数です。
      why: 表の数の単位と集計の仕方が確かめられない。12 や 76 は 5 試行の合計なのか 1 試行あたりなのか、分母は更新 2000 件なのか 2000 件 × 5 試行なのかが書かれていない。「実行」「回」「試行」の 3 語の関係も、「1 回の実行は、注文 200 件への更新 2000 件です。」と「同じ実験を最初から 2 回流し、条件ごとに 5 試行しました。」からは一意に読めない(1 回の実行 = 1 試行なのか、5 試行をまとめたものが 1 回なのか)。また「未送信の行を読む」の列は「0」が 1 つだけで、1 回目・2 回目の両方が 0 なのかが表からは分からない。
    - quote: この条件の最終状態の食い違いは、1 回目 2 注文(2/5 試行)、2 回目 0 注文です。
      why: 表の「12・1」と、この「2 注文・0 注文」の関係が、この文の時点では分からない。2 段落あとの「食い違ったまま残ったのは、最後の更新を読み飛ばした注文です。」まで読んで初めて、表は読み飛ばした更新の数、こちらは最後まで直らなかった注文の数らしいと推測できる。説明の順が逆になっている。
    - quote: 読み飛ばしはエラーにならない。正と導出の差を数える照合が無いと見つからない
      why: 「正」「導出」「照合」は、まとめで初めて出る語で、本文に定義も説明も無い。本文には、読み飛ばした件数をどうやって数えたか(何と何を比べたか)が書かれていないので、「題の課題を解きたい」読者が自分の環境で読み飛ばしを見つける方法が分からない。
    - quote: 受け手の冪等性を外した構成では、届いた重複がそのまま通知の重複になっています。
      why: 「受け手の冪等性を外した構成」と、直前の運び手を強制終了する実験は、「測った結果」の章に出てこない(そこでは「障害は入れていません。」とある)。別の実験があることの前置きが無く、件数も条件も書かれていないので、何をどれだけ測った結果なのかが確かめられない。
