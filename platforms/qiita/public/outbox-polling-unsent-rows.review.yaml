premortem: |
  (1) 「同じ実験を最初から 2 回流し」と書いた記事の中で、1 回だけ流した追加実験 A-P1(CDC の遅れと poll.interval.ms)の結果を、回数の断りなしに「変わりました」と書いている。summary と正本(Zenn)は必ず「1 回だけ」を添えており、まとめの「流し直したかを添えて読む」とも合わない。ここが訂正の原因になりうる。
  (2) まとめの「照合が無いと見つからない」は、照合があれば読み飛ばしが見つかると読める。summary の「照合が見つけた数」は索引に残った差(並行度 4 で 2・0 注文)だけで、読み飛ばした件数(12・1 件)と通知の欠落は照合では数えていない。2 回目の並行度 4 は、1 件を読み飛ばして照合は 0 だった。
  (3) コードの抜粋・SQL・表の数字が実物とずれること。照合した結果、抜粋は cs/a/relay.py の 42〜66 行と 69〜73 行に逐語で一致(67〜68 行は `# ...`)、恒久リンクのコミット 9a7beca から HEAD(d0c0a78)まで cs/a と results/a/summary.md に差分は無く、表の 4 行も summary の A-V1・A-N2 の表と一致した。残る危険は「実行」の節で、cs/a/run.sh は setup_venv.sh が作る venv が無いと動かないのに、記事はそれに触れていない。
