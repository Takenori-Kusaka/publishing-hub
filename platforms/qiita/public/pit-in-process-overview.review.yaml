      reason: yaml ブロックは実装と逐語で一致し、省略は `# ...` で示している(1行ずつ突合済み。team.json も全行一致)。ただし push の直前で省いた3行のコメントには「このファイルは強制層であり、変更は AI維持管理者の承認を要する」という安全のための但し書きがあり、本文の落とし穴で「push.branches を改めます」と書く以上、この但し書きを本文で補うか行を載せる。また冒頭のコメント8行(ファイル先頭〜空行)を省いた印(`# ...`)が無い
