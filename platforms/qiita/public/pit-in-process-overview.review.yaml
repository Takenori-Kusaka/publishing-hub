      reason: 失敗するのはテストのコマンドが空の場合に限られる。静的解析・ライセンス検査などの任意の検査は、空でも「未実施」として証跡へ残り通過する(scripts/gate/adapter.mjs「任意の検査は空でも通す。必須の検査は空を許さない」)。構成が未設定のあいだも gate-g5 は警告つきで合格する。「テストのコマンドが空なら G-5 が失敗する」と範囲を絞る。
      rule: AGENTS-2
    - id: C29
      quote: このファイルは強制層であり、変更には AI 維持管理者(強制層の設定を所有する席)の承認を要します。
      status: supported
      source: https://github.com/Takenori-Kusaka/pit-in-template/blob/main/README.md
      source_quote: "- ワークフローと判定のスクリプトは強制層です。変更は、AI 維持管理者の承認を要します(`state:needs-platform`)。PR の先頭を checkout する手順や、承認を付ける手順を足さないでください"
