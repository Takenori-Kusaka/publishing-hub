    - id: F05
      quote: // https://github.com/Takenori-Kusaka/pit-in-template/blob/main/.github/rulesets/team.json
      severity: 任意
      reason: 規則は先頭行に「リポジトリ内のパス」を書くとしている。抜粋元が別リポジトリ(pit-in-template)なので blob URL は識別として妥当だが、規則の読みどおりなら `// .github/rulesets/team.json` とリポジトリ名を本文で示す形もある。取りまとめ役の判断に委ねる
