  first_lines_given: 10
  subject_identified: JWT の受け手の検証の除去実験（検証要素を 1 つずつ外して攻撃を当て直す。Python・PyJWT・Keycloak）
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: 9 要素をすべて入れた構成 B が共通の基準
      why: 9 つの要素が本文のどこにも列挙されていない。コード抜粋に出るのは iss・aud・exp・typ・required・types の 6 つで、alg は本文の箇条書きにだけ出てくる。「不変の ID と組織の名前空間」も要素として語られるが、9 に含まれるのか BE の重点なのか判別できない。「何を確認すれば十分か」を知りたい読者には、その答えの一覧が無い
    - quote: B に題材ごとの重点を足した構成が BE です
      why: 「重点」が定義されていない。後段の「承認の束縛、宛先に束縛した交換、タスク単位の短命トークンなどの重点の要素」で例は出るが、題材ごとに何を足したのかの一覧は無い
    - quote: 署名を確かめた後の判定を抜粋します。
      why: alg と署名の確認は抜粋の外にあり、コードに出てこない。「alg を外す」と最も多くの攻撃が通ると書かれているのに、その確認をどう書いたかが示されていない
    - quote: kid のパス、jku、jwk
      why: 攻撃の名前だけで中身の説明がない。「kid のパス」がパストラバーサルを指すのかは推測になる。実務 3〜5 年なら jku・jwk ヘッダは調べれば分かるため退ける候補だが、本文に定義はない
    - quote: 軽量アクセストークンで落ちるクレームなど
      why: Keycloak の「軽量アクセストークン」が何か、どのクレームが落ちるのかが書かれていない。技術選定の理由として挙げているが、本文で再び触れられない
    - quote: 社内業務システム(Okta のログイン名の再利用)とマルチテナント SaaS(パスとヘッダでテナントを偽る)の題材で効いています
      why: 題材が複数あることがここで初めて分かる。題材の一覧も各題材の攻撃の中身も無く、「ログイン名の再利用」がどういう攻撃なのか読み取れない
    - quote: 宛先に束縛した交換
      why: トークン交換（RFC 8693 の類）を指すと推測はできるが、本文に説明がない
  bounce_points:
    - quote: そこから 1 つずつ外すと、再び通る攻撃は要素ごとに分かれます。
      why: 続く箇条書きは alg・iss・exp の 3 要素だけで、aud・typ・required・types を外した結果が書かれていない。9 要素のうち何が汎用の攻撃に効くのかを知りたいのに残りが分からず、全体像を求めて正本へ移りたくなる。攻撃の総数も書かれていない
    - quote: AIエージェントの委任の題材では、B は攻撃を 1 件も止めず、B から何を外しても結果は同じでした。
      why: 通常の API の JWT 検証を知りたい読者には話題が逸れる。B が 1 件も止めないという強い結果に根拠の数字や攻撃の例がなく、自分に関係するのか判断できない（1 段落で終わるので退ける候補）
    - quote: Entra ID・Okta・Cognito・Auth0 は模擬
      why: 技術選定の表が本題（何を確認するか）の前に来る。表自体は短いので離脱には至らない（退ける候補）
