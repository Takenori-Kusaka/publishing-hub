cold_read:
  first_lines_given: 10
  subject_identified: JWT 受け手検証の除去実験(PyJWT)
  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: 題材は、組織で共用する独自クレームを扱うケーススタディです。
      why: 「題材」が何種類あり何を指すかが本文で列挙されない。後段で「汎用の題材」「社内業務システム」「マルチテナント SaaS」「AIエージェントの委任」が個別に出てくるが、これで全部なのか、冒頭の「組織で共用する独自クレーム」とどう対応するのかが本文からは確かめられない。
    - quote: 汎用の題材には攻撃が 14 件あり、B で通ったのは 0 件でした。
      why: 直後の箇条書きで外した要素ごとに再び通る攻撃を数えると、重複(別の発行者の鍵で iss を偽るトークン)を除いて 6+1+2+4=13 件になり、14 件と合わない。残る 1 件が何で、どの要素で止まっているのか(どれを 1 つ外しても通らないのか)が書かれていない。
    - quote: aud や exp の検証は `options` で切り、要素ごとの分岐が受け持ちます。
      why: "コードでは 'verify_iat': False と 'verify_nbf': False も切っているが、9 要素に nbf・iat は無く、分岐でも確かめていない。「何を確認すれば十分か」を知りたい読者には、nbf・iat を確かめなくてよいと判断した理由が本文に無いため、意図した省略か抜けかが判別できない。"
    - quote: 要素 `alg` が無い構成は、過去の誤りを再現した別の処理に進みます。
      why: 抜粋コードは「# ...」で alg・kid・jku の扱いを省いており、要素 alg が有るときの確認(RS256 固定、kid は登録済みの鍵だけ、jku 等を無視)がコード上どこでどう分岐するかが見えない。表の 1 行目の内容をコードで追えない。
