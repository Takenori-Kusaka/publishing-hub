  subject_is_named_in_first_lines: true
  unintelligible:
    - quote: units.append(dict(kind='excel_row', section=f'{ws.title}', text=f'【{ws.title}】{block}｜' + ' / '.join(vals)))
      why: 変数 block がコード中で一度も定義されていない。直前の「# ...」で省略された部分にあると推測はできるが、手順 4「ヘッダより上の行（製品名・図番・FMEA ID）をまとめ、各行の先頭に付ける」をどう組むかが本文から読み取れない。title / docno も初期化の '' のまま返っている。
    - quote: "| ＋文書名・章の文脈ヘッダと型番の正規化 | 8 |"
      why: 結果表で最も良い 8 問を出した構成だが、「文脈ヘッダ」「型番の正規化」の中身が本文のどこにも説明されていない。インデックス設定の nfkc や n-gram が「型番の正規化」に当たるのかも明示がない。
    - quote: FMEA や DRBFM の Excel は、帳票として作られています。
      why: DRBFM の展開・説明がない。品質部門の読者なら通じる可能性が高いので、致命的ではない候補として記録する(BOM も同様に未定義)。
    - quote: 'lex = {"bool": {"should": [{"match": {"text": q}}, {"match": {"text.ng": q}}], "filter": flt}}'
      why: text.ng と emb を持つインデックスの mappings(サブフィールドへの analyzer 割り当て、knn_vector の次元 768 と method)が示されていない。SETTINGS には analyzer 定義しかないため、このクエリが当たるフィールド構成を本文だけでは作れない。flt, n, v, os_ も未定義。
  bounce_points:
    - quote: "        # ..."
      why: 読者像は今日この課題を解きたいので、コードをそのまま動かしたい。ヘッダ上部のブロック抽出が省略され、結果として block 未定義のコードになっているため、ここで GitHub に移るか読むのをやめる判断をしやすい。
    - quote: "| ＋ハイブリッド（RRF） | 7 |"
      why: 本文の後半を割いて説明した hybrid + RRF が、数字上は 1 行 1 レコード＋Dense と同じ 7 問で改善がない。なぜ入れるのかの説明が本文にないため、OpenSearch の節を飛ばしてよいのか迷う。(退ける候補ではないが、読み進めを止めるほどではない可能性もある)
