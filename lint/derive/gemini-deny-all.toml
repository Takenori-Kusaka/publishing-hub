# 派生物パイプラインで Gemini CLI を呼ぶときのポリシー。すべてのツールを拒否する。
# 各段の入力はスクリプトが標準入力で渡し、出力は JSON の応答だけにする(ファイルの読み書きやシェルをさせない)。
# 呼び出しごとに stats.tools.totalCalls が 0 であることを scripts/derive/lib/gemini-cli.mjs が検証する。
[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search", "search_file_content", "write_file", "replace", "run_shell_command", "web_fetch", "google_web_search", "save_memory", "write_todos", "update_topic", "activate_skill", "codebase_investigator", "cli_help", "complete_task", "enter_plan_mode", "exit_plan_mode", "ask_user"]
decision = "deny"
priority = 999
denyMessage = "Tools are disabled in this pipeline step."
