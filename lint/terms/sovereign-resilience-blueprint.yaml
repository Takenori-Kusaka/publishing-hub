# 『未来予測の設計図』の用語辞書。
# 本書は付録B(用語集)で概念を定義している。ここでは表記のゆれだけを扱い、
# 定義は付録Bに任せる。根拠は 2026-09-13 の全章読み込み(97 章)による多数派表記。
# 本書の方針: 接続・副詞・形式名詞はひらがな(したがって・おおむね・のもとで・にあたる)、
# 列挙は漢数字(第一に)、個数は算用数字(3つ)、国名はカタカナ、国際機関は正式名。

scope: sovereign-resilience-blueprint
rules:
  - expected: 第Ⅰ部
    patterns:
      - "第I部(?!第)"
      - "第１部"
      - "第1部(?!第)"
    reason: 部の番号はローマ数字(U+2160 系)で書く。ASCII の I は check-links の章ラベル検出にも掛からない
  - expected: 第Ⅱ部
    patterns:
      - "第II部(?!第)"
      - "第２部"
      - "第2部(?!第)"
    reason: 同上
  - expected: 第Ⅲ部
    patterns:
      - "第III部(?!第)"
      - "第３部"
      - "第3部(?!第)"
    reason: 同上
  - expected: 第Ⅳ部
    patterns:
      - "第IV部(?!第)"
      - "第４部"
      - "第4部(?!第)"
    reason: 同上
  - expected: 第Ⅴ部
    patterns:
      - "第V部(?!第)"
      - "第５部"
      - "第5部(?!第)"
    reason: 同上
  - expected: 章ラベルの体系(第Ⅰ・Ⅱ部は系列英字あり「第Ⅰ部A-1」、第Ⅲ〜Ⅴ部は英字なし「第Ⅲ部-4」)
    fix: false
    patterns:
      - "第[ⅢⅣⅤ]部[A-D]-?\\d"
      - "第[ⅠⅡ]部-\\d"
      - "第[ⅠⅡⅢⅣⅤ]部[A-D]?[‐－–—]\\d"
    reason: 章ラベルの体系が部ごとに固定されている(ハイフンは半角)
  - expected: 統治OS
    patterns:
      - "統治 OS"
      - "統治　OS"
      - "統治ＯＳ"
    reason: 本書の造語(第Ⅰ部B-1 で定義)。スペースなし
  - expected: 砂時計アーキテクチャ
    patterns:
      - "砂時計アーキテクチャー"
      - "砂時計モデル"
    reason: 本書の方法論の名称
  - expected: 生成AI
    patterns:
      - "生成 AI"
      - "生成　AI"
      - "生成ＡＩ"
    reason: 本書の表記(スペースなし)
  - expected: 量子計算
    patterns:
      - "量子コンピューティング"
      - "量子コンピュータ(?!ー)"
      - "量子コンピューター"
    reason: 本書は技術名を「量子計算」に統一している
  - expected: 大規模言語モデル
    patterns:
      - "(?<![A-Za-z])LLM(?![A-Za-z])"
    reason: 本書は IT 用語を漢語化する(はじめに で定義)
  - expected: 計算機
    patterns:
      - "(?<!スーパー|パーソナル|マイクロ|量子)コンピュータ(?!ー)"
      - "(?<!スーパー|パーソナル|マイクロ|量子)コンピューター"
    reason: 本書は「計算機」に統一(量子コンピュータは量子計算の規則が扱う)
  - expected: 早期警戒指標
    patterns:
      - "早期警告指標"
    reason: 付録B の定義語
  - expected: 外部衝撃
    patterns:
      - "外部ショック"
    reason: 崩壊モデルの鍵語
  - expected: 手続
    patterns:
      - "手続き(?!的)"
    reason: 送り仮名なし「手続」が本書の表記(100 回)。「手続き」は 3 ファイルで混在していた
  - expected: のもとで
    patterns:
      - "(?<=(統治|支配|体制|制度|条件|前提|指導|監督|管理|名|命令|影響|圧力|原則|法律|条約|憲法|規則|秩序|理念|主義|政権|占領))の下で"
    reason: 形式名詞はひらがな(47 回に対し漢字 2 回)。物理的な「下」(氷の下で)は対象外
  - expected: 組み合わせ
    patterns:
      - "組合せ"
      - "組み合せ"
      - "組合わせ"
    reason: 本書の表記
  - expected: おおむね
    patterns:
      - "概ね"
    reason: 副詞はひらがな(本書の方針)
  - expected: にあたる
    patterns:
      - "に当た(?=[るりっれ])"
    replacement: にあた
    reason: 形式的な動詞はひらがな(62 回に対し漢字 2 回)
  - expected: 見なす
    patterns:
      - "みなす(?=[。、])"
    reason: 本書の表記(3 回)
  - expected: 第一に・第二に・第三に(列挙副詞は漢数字)
    fix: false
    patterns:
      - "第[1-9１-９]に、"
      - "第[1-9]の(?=(機能|論点|条件|要因|側面|段階|柱|系列|理由|問い|変化))"
    reason: 列挙副詞・序数は漢数字(60 回超)。算用数字は第N節・第N条・第N層にのみ使う
  - expected: 数字＋つ(1つ、2つ)
    fix: false
    patterns:
      - "[一二三四五六七八九]つ(?![けづ])"
      - "(?<![ぁ-ん])(ひとつ|ふたつ|みっつ)(?![ぶきち])"
    reason: 個数は半角数字＋つ(250 回超)
  - expected: 数字＋か(3か所、27か国、5か月)
    fix: false
    patterns:
      - "(?<=[0-9])[ヶケカ箇](?=[月国所条年])"
    reason: 助数詞の「か」はひらがな(全編)
  - expected: 汎用の共通言語
    patterns:
      - "汎用的な共通言語"
    reason: 第Ⅰ部B-2 の章題・本文の鍵語
  - expected: 集約型インフラ
    patterns:
      - "集約型のインフラ"
    reason: 本書の造語(30 回)。「集約型の設備」は別語で許容
  - expected: 自律分散型システム
    patterns:
      - "自律分散システム"
    reason: 第Ⅴ部の正式名(はじめに で定義)
  - expected: 国際連合
    patterns:
      - "(?<![一-龥])国連(?![合邦携絡銀続立鎖名])"
    reason: 国際機関は略称を使わず正式名(国際エネルギー機関、北大西洋条約機構も同様)
  - expected: イギリス(中世〜17 世紀は「イングランド」)
    fix: false
    patterns:
      - "(?<!日)英国(?!国立|国務)"
    reason: 国名はカタカナ(イギリス・アメリカ・ヨーロッパ)
  - expected: アメリカ
    fix: false
    patterns:
      - "米国(?!国立|国務|エネルギー|議会|の議会|国防|債|連邦|軍|籍|産|系)"
    reason: 国名は「アメリカ」。漢字の略称は機関名の接頭辞(国立標準技術研究所など)にのみ使う
  - expected: ソビエト連邦
    patterns:
      - "ソ連(?!邦)"
      - "ソヴィエト"
    reason: 本書の表記
  - expected: 満洲
    patterns:
      - "満州"
    reason: 第Ⅰ部D-3 の表記に固定
  - expected: 1955年体制
    patterns:
      - "(?<!19)55年体制"
    reason: 第Ⅰ部A-7 の表記(3 回)
  - expected: 根拠つき
    patterns:
      - "根拠付き"
    reason: 第Ⅴ部-16 の造語「根拠つきの判断支援」
  - expected: 行動の余剰
    patterns:
      - "行動余剰"
    reason: 第Ⅱ部C-2 の定義語
  - expected: 人名のカタカナ表記(ジェームズ・トマス・ジョン・スノウ・ポール・デイヴィッド)
    fix: false
    patterns:
      - "ジェイムズ"
      - "トーマス・(ヒューズ|シェリング)"
      - "ジョン・スノー"
      - "ポール・デ(イビ|ビ|ヴィ)ッド"
    reason: Thomas=トマス、James=ジェームズ、Snow=スノウ、v 音=ヴ で固定
allow_variants: []
