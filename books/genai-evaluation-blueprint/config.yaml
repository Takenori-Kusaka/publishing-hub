title: "生成AI評価の設計図 ―― 出力はどこまで期待に近づいたか。評価の系譜・現在地・3つの道筋"
summary: "『AIトランスフォーメーションの設計図』の別冊です。生成AIの出力が、ユーザーの期待にどこまで近づいたかを測る「評価」の系譜(1950〜2026年)と現在地を一次資料から整理します。評価の対象を、足りない情報を集める入力側(必要・十分・精度・鮮度・出所)と、期待する出力をつくる生成側(整形・忠実・事実・安全・期待)の2層10項目に分け、公開された失敗事例から逆算して、評価の成熟度5段階と2031年までの3つの道筋(自動化・人手回帰・規制主導)を示します。事実と解釈は章ごとに分離し、すべての事実記述に一次資料への直接リンクを付しています。"
topics: ["ai", "llm", "rag", "evaluation", "management"]
published: true
