title: "ローカル完結ボイスジャーナルの設計 ― QuickScribe を Tauri + Rust + Svelte でつくる"
summary: "話した言葉を、要約せずニュアンスを残したまま整えて残す。そんなローカル完結の音声ジャーナル「QuickScribe」を、Tauri + Rust + Svelte でどう設計したかをまとめた本です。第I部の設計編では、エンジンを差し替え可能にする trait 設計、ローカル LLM での整形、中間ファイルを捨てない仕様、CER 回帰を CI で見張る品質ゲートを、実際の意思決定記録（ADR）と実装に紐づけて解説します。第II部の実測編は公開後の記録で、既定モデルを実測で覆した経緯、GPU と Vulkan で実用速度を取り戻した話、評価駆動で閾値を決め直した話を置きました。付章に単一バイナリ配布の設計をまとめています。うまくいった判断だけでなく、トレードオフや未解決の課題も正直に書きます。"
topics: ["tauri", "rust", "svelte", "whisper", "設計"]
